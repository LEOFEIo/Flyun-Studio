<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FLY YUN - 智能寻访空间</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --ios-accent: #007AFF;
            --ios-bg: #F2F2F7;
            --ios-card-pure: #FFFFFF;
            --ios-card-glass: rgba(255, 255, 255, 0.7);
            --radius-max: 35px;
            --ios-red: #FF3B30;
            --admin-purple: #AF52DE;
            --text-main: #1D1D1F;
            --text-sub: #86868B;
        }

        body, html {
            margin: 0; padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", sans-serif;
            background: var(--ios-bg);
            color: var(--text-main);
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* --- 全新：极光浅渐变背景 --- */
        .aurora-bg {
            position: fixed; inset: 0;
            z-index: -1;
            background: linear-gradient(140deg, #fdfbfb 0%, #ebedee 100%);
            overflow: hidden;
        }
        /* 动态光斑 */
        .aurora-bg::before, .aurora-bg::after {
            content: ""; position: absolute; border-radius: 50%;
            filter: blur(100px); opacity: 0.45;
            animation: auroraMove 30s infinite alternate ease-in-out;
        }
        .aurora-bg::before {
            width: 1200px; height: 1200px;
            background: radial-gradient(circle, #D4E2FF 0%, rgba(255,255,255,0) 70%);
            top: -400px; right: -200px;
        }
        .aurora-bg::after {
            width: 1000px; height: 1000px;
            background: radial-gradient(circle, #E0F2F1 0%, rgba(255,255,255,0) 70%);
            bottom: -300px; left: -100px;
            animation-delay: -5s;
        }

        @keyframes auroraMove {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(150px, 100px) scale(1.1); }
        }

        /* --- 首页：登录卡片 --- */
        #loginOverlay {
            position: fixed; inset: 0; display: flex; justify-content: center; align-items: center;
            z-index: 10000; background: rgba(255, 255, 255, 0.2); backdrop-filter: blur(50px) saturate(180%);
            transition: all 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .login-card {
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 50px; padding: 65px 45px; width: 85%; max-width: 400px;
            text-align: center; box-shadow: 0 30px 80px rgba(0,0,0,0.04);
        }
        .login-card h1 { font-size: 40px; font-weight: 800; margin: 0; letter-spacing: -2px; color: #1d1d1f; }
        .login-card p { font-size: 15px; color: #86868b; margin: 12px 0 40px; line-height: 1.5; }

        .ios-input-field {
            width: 100%; padding: 22px; border-radius: 22px; border: 1px solid #E5E5EA;
            background: #FFFFFF; font-size: 18px; font-weight: 600;
            text-align: center; outline: none; transition: 0.3s; box-sizing: border-box;
        }
        .ios-input-field:focus { border-color: var(--ios-accent); box-shadow: 0 0 0 4px rgba(0,122,255,0.1); background: #fff; }

        .btn-ios-primary {
            width: 100%; padding: 20px; border-radius: 22px; border: none;
            background: var(--ios-accent); color: white; font-size: 17px; font-weight: 700;
            cursor: pointer; transition: 0.3s; margin-top: 30px;
        }
        .btn-ios-primary:active { transform: scale(0.96); opacity: 0.9; }
        .admin-trigger { margin-top: 30px; font-size: 13px; color: var(--ios-accent); cursor: pointer; font-weight: 600; opacity: 0.5; }

        /* --- 主界面及其他样式 --- */
        .app-shell { max-width: 1400px; margin: 0 auto; padding: 30px 20px 140px; display: none; }
        .ios-card { background: rgba(255, 255, 255, 0.65); backdrop-filter: blur(30px); border-radius: var(--radius-max); padding: 25px; margin-bottom: 25px; border: 1px solid #FFFFFF; box-shadow: 0 10px 40px rgba(0,0,0,0.02); }
        .dashboard-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 25px; }
        @media (max-width: 1024px) { .dashboard-grid { grid-template-columns: 1fr; } }
        .chart-box { height: 260px; text-align: center; }
        .chart-container { height: 210px; width: 100%; }
        .mgmt-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media (max-width: 768px) { .mgmt-row { grid-template-columns: 1fr; } }
        .tree-node { background: rgba(0,0,0,0.02); border-radius: 20px; padding: 15px; margin-bottom: 15px; }
        .job-chip { display: inline-flex; align-items: center; background: white; padding: 6px 12px; border-radius: 12px; font-size: 13px; font-weight: 600; margin: 4px; border: 1px solid #F2F2F7; }
        .form-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; }
        @media (max-width: 768px) { .form-grid { grid-template-columns: 1fr; } }
        .field { display: flex; flex-direction: column; gap: 6px; }
        .field label { font-size: 11px; font-weight: 700; color: var(--text-sub); margin-left: 12px; }
        .field input, .field select { padding: 14px; border-radius: 14px; border: 1px solid #E5E5EA; background: #FFF; font-size: 15px; outline: none; }
        .search-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 25px; }
        .btn-search { background: var(--ios-accent); color: #FFF; border: none; border-radius: 12px; padding: 0 20px; font-weight: 600; cursor: pointer; height: 44px; }
        .ios-table { width: 100%; border-collapse: collapse; min-width: 1300px; }
        .ios-table th { text-align: left; padding: 15px; font-size: 12px; color: var(--text-sub); border-bottom: 1px solid #F2F2F7; }
        .ios-table td { padding: 18px 15px; font-size: 14px; border-bottom: 1px solid #F2F2F7; }
        .calc-sub { display: block; font-size: 11px; color: var(--ios-accent); font-weight: 700; margin-top: 3px; }
        .dock { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(35px); padding: 12px 25px; border-radius: 35px; display: flex; gap: 15px; border: 1px solid #FFFFFF; box-shadow: 0 15px 40px rgba(0,0,0,0.08); z-index: 999; }
        .dock-btn { border: none; padding: 14px 25px; border-radius: 20px; font-weight: 700; font-size: 14px; cursor: pointer; transition: 0.2s; }
        .btn-green { background: #34C759; color: white; }
        .btn-gray { background: #E5E5EA; color: var(--text-main); }
        .badge { padding: 4px 10px; border-radius: 8px; font-size: 11px; font-weight: 700; }
        .badge-合适 { background: #E8F5E9; color: #2E7D32; }
        .badge-不合适 { background: #FFEBEE; color: #C62828; }
        .badge-正在联系中 { background: #FFF8E1; color: #F57F17; }
    </style>
</head>
<body>

<div class="aurora-bg"></div>

<div id="loginOverlay">
    <div class="login-card">
        <h1 id="mainTitle">FLY YUN</h1>
        <p id="mainSub">生成您自己的存储空间<br><span style="font-size:12px; opacity:0.7">数据已通过浏览器端加密保护</span></p>
        <input type="password" id="sysPass" class="ios-input-field" placeholder="访问密码" onkeydown="if(event.keyCode==13) handleLogin()">
        <button class="btn-ios-primary" onclick="handleLogin()">解锁 / 进入空间</button>
        <div class="admin-trigger" onclick="toggleAdmin()">超级管理中心</div>
    </div>
</div>

<div id="adminPanel" class="app-shell" style="padding-top: 60px;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:30px;">
        <h2 style="font-size:32px; font-weight:900; color:var(--admin-purple);">MASTER ADMIN</h2>
        <button class="dock-btn btn-gray" onclick="location.reload()">退出后台</button>
    </div>
    <div class="ios-card">
        <div style="font-weight:700; margin-bottom:20px;">📦 空间数据资产概览</div>
        <table class="ios-table">
            <thead>
                <tr><th>空间密码指纹 (哈希)</th><th>候选人数</th><th>操作</th></tr>
            </thead>
            <tbody id="adminTableBody"></tbody>
        </table>
    </div>
    <button class="btn-ios-primary" style="background:var(--ios-red); max-width: 300px;" onclick="dangerClearAll()">抹除全局数据</button>
</div>

<div class="app-shell" id="app">
    <header style="margin-bottom: 40px;">
        <h2 style="font-size: 34px; font-weight: 900; letter-spacing: -2px; margin: 0;">FLY YUN</h2>
        <div id="userDisplay" style="color: var(--text-sub); font-size: 13px; margin-top: 5px;"></div>
    </header>

    <div class="dashboard-grid">
        <div class="ios-card chart-box">
            <div style="font-size: 14px; font-weight: 700; margin-bottom: 15px;">寻访状态分布</div>
            <div class="chart-container"><canvas id="chartStatus"></canvas></div>
        </div>
        <div class="ios-card chart-box">
            <div style="font-size: 14px; font-weight: 700; margin-bottom: 15px;">学历画像分布</div>
            <div class="chart-container"><canvas id="chartEdu"></canvas></div>
        </div>
        <div class="ios-card chart-box">
            <div style="font-size: 14px; font-weight: 700; margin-bottom: 15px;">项目储备统计</div>
            <div class="chart-container"><canvas id="chartJob"></canvas></div>
        </div>
    </div>

    <div class="ios-card">
        <div class="mgmt-row">
            <div>
                <div style="font-weight: 700; margin-bottom: 12px;">🏢 客户管理</div>
                <div style="display:flex; gap:10px;">
                    <input type="text" id="newComp" class="ios-input-field" style="padding:12px; font-size:14px; text-align:left" placeholder="新客户名称...">
                    <button class="btn-search" style="height:42px;" onclick="addComp()">添加</button>
                </div>
            </div>
            <div>
                <div style="font-weight: 700; margin-bottom: 12px;">💼 岗位管理</div>
                <div style="display:flex; gap:10px;">
                    <select id="compSelect" class="ios-input-field" style="padding:12px; font-size:14px; text-align:left"><option value="">选择客户</option></select>
                    <input type="text" id="newJob" class="ios-input-field" style="padding:12px; font-size:14px; text-align:left" placeholder="岗位名称...">
                    <button class="btn-search" style="height:42px;" onclick="addJob()">添加</button>
                </div>
            </div>
        </div>
        <div id="treeDisplay" style="margin-top:20px;"></div>
    </div>

    <div class="ios-card">
        <div style="font-weight: 700; margin-bottom: 20px;">📝 深度寻访详情录入</div>
        <div class="form-grid">
            <div class="field"><label>1. 推荐客户</label><select id="f1" onchange="filterJobs()"></select></div>
            <div class="field"><label>2. 推荐岗位</label><select id="f2"></select></div>
            <div class="field"><label>3. 姓名</label><input type="text" id="f3"></div>
            <div class="field"><label>4. 性别</label><select id="f4"><option>男</option><option>女</option></select></div>
            <div class="field"><label>5. 状态</label><select id="f5"><option>正在联系中</option><option>合适</option><option>不合适</option></select></div>
            <div class="field"><label>6. 出生年份</label><select id="f6"></select></div>
            <div class="field"><label>7. 岗位产品</label><input type="text" id="f7"></div>
            <div class="field"><label>8. 目前所在地</label><input type="text" id="f8"></div>
            <div class="field"><label>9. 期望所在地</label><input type="text" id="f9"></div>
            <div class="field"><label>10. 现公司</label><input type="text" id="f10"></div>
            <div class="field"><label>11. 电话/微信</label><input type="text" id="f11"></div>
            <div class="field"><label>12. 邮箱</label><input type="text" id="f12"></div>
            <div class="field"><label>13. 学历</label><select id="f13"><option>大专</option><option>本科</option><option>研究生</option><option>博士</option></select></div>
            <div class="field"><label>14. 入学年份</label><select id="f14"></select></div>
            <div class="field"><label>15. 学校</label><input type="text" id="f15"></div>
            <div class="field"><label>16. 备注</label><input type="text" id="f16"></div>
        </div>
    </div>

    <div class="ios-card" style="padding:0; overflow:hidden;">
        <div style="padding:25px 25px 0 25px;">
            <div style="font-weight: 700; margin-bottom: 15px;">🔍 智能检索与分析</div>
            <div class="search-row">
                <div class="field"><label>搜姓名</label><div style="display:flex;gap:8px"><input type="text" id="sName" style="flex:1;padding:10px;border-radius:10px;border:1px solid #E5E5EA"><button class="btn-search" onclick="doSearch()">搜索</button></div></div>
                <div class="field"><label>搜客户</label><div style="display:flex;gap:8px"><input type="text" id="sComp" style="flex:1;padding:10px;border-radius:10px;border:1px solid #E5E5EA"><button class="btn-search" onclick="doSearch()">搜索</button></div></div>
                <div class="field"><label>搜岗位</label><div style="display:flex;gap:8px"><input type="text" id="sJob" style="flex:1;padding:10px;border-radius:10px;border:1px solid #E5E5EA"><button class="btn-search" onclick="doSearch()">搜索</button></div></div>
            </div>
        </div>
        <div style="overflow-x:auto;">
            <table class="ios-table">
                <thead><tr><th>姓名</th><th>状态</th><th>客户/岗位</th><th>出生年(年龄)</th><th>学历(资历)</th><th>现公司</th><th>操作</th></tr></thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>
</div>

<div class="dock" id="userDock" style="display:none">
    <button class="dock-btn btn-blue" onclick="saveData()">✅ 存入名单</button>
    <button class="dock-btn btn-green" onclick="exportXLS()">📊 导出 Excel</button>
    <button class="dock-btn btn-gray" onclick="location.reload()">🔒 退出</button>
</div>

<script>
    let dbKey = ""; let data = []; let tree = {}; let charts = {};
    const curY = new Date().getFullYear();
    
    // 超级管理员：SHA-256 哈希值 (对应密码：FLY999)
    const MASTER_HASH = "8c6976e5b5410415bde908bd4dee15dfb167a9c873fc4bb8a81f6f2ab448a918"; 
    let isAdmin = false;

    // 轻量级哈希计算
    async function hash(str) {
        const utf8 = new TextEncoder().encode(str);
        const hashBuffer = await crypto.subtle.digest('SHA-256', utf8);
        return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    function toggleAdmin() {
        isAdmin = !isAdmin;
        const t = document.getElementById('mainTitle');
        const s = document.getElementById('mainSub');
        if(isAdmin) { t.innerText = "ADMIN 后台"; t.style.color = "var(--admin-purple)"; s.innerText = "输入管理员指纹进入管控中心"; }
        else { t.innerText = "FLY YUN"; t.style.color = "#1d1d1f"; s.innerText = "生成您自己的存储空间"; }
    }

    async function handleLogin() {
        const p = document.getElementById('sysPass').value;
        if(!p) return;
        if(isAdmin) {
            const h = await hash(p);
            if(h === MASTER_HASH) { document.getElementById('loginOverlay').style.display='none'; document.getElementById('adminPanel').style.display='block'; renderAdmin(); }
            else alert("验证未通过");
        } else {
            dbKey = "FLY_L_V12_" + btoa(p);
            registerSpace(p);
            document.getElementById('loginOverlay').style.opacity='0';
            setTimeout(() => {
                document.getElementById('loginOverlay').style.display='none';
                document.getElementById('app').style.display='block';
                document.getElementById('userDock').style.display='flex';
                document.getElementById('userDisplay').innerText = "密钥空间: " + p;
                initApp();
            }, 500);
        }
    }

    function registerSpace(p) {
        let l = JSON.parse(localStorage.getItem("FLY_REG_LIST") || "[]");
        if(!l.includes(p)) { l.push(p); localStorage.setItem("FLY_REG_LIST", JSON.stringify(l)); }
    }

    function renderAdmin() {
        const l = JSON.parse(localStorage.getItem("FLY_REG_LIST") || "[]");
        document.getElementById('adminTableBody').innerHTML = l.map(p => {
            const k = "FLY_L_V12_" + btoa(p);
            const c = JSON.parse(localStorage.getItem(k) || "[]").length;
            return `<tr><td><span style="font-family:monospace">${btoa(p).substring(0,10)}...</span></td><td>${c} 人</td><td><button onclick="delSpace('${p}')" style="color:red;border:none;background:none;cursor:pointer">销毁</button></td></tr>`;
        }).join('');
    }

    function delSpace(p) {
        if(confirm(`确定销毁该空间？`)) {
            const k = "FLY_L_V12_" + btoa(p);
            localStorage.removeItem(k); localStorage.removeItem(k+"_t");
            let l = JSON.parse(localStorage.getItem("FLY_REG_LIST") || "[]").filter(x => x !== p);
            localStorage.setItem("FLY_REG_LIST", JSON.stringify(l)); renderAdmin();
        }
    }

    function dangerClearAll() { if(confirm("抹除所有数据？")) { localStorage.clear(); location.reload(); } }

    // --- 应用逻辑保持 ---
    function initApp() {
        let y6 = ''; for(let i=1960; i<=2022; i++) y6 += `<option value="${i}">${i}</option>`;
        document.getElementById('f6').innerHTML = '<option value="">年份</option>' + y6;
        let y14 = ''; for(let i=1900; i<=2024; i++) y14 += `<option value="${i}">${i}</option>`;
        document.getElementById('f14').innerHTML = '<option value="">入学年</option>' + y14;
        data = JSON.parse(localStorage.getItem(dbKey) || "[]");
        tree = JSON.parse(localStorage.getItem(dbKey+"_t") || "{}");
        refreshMgmt(); render(); updateCharts();
    }
    function addComp() { const v = document.getElementById('newComp').value.trim(); if(v && !tree[v]) { tree[v] = []; saveT(); document.getElementById('newComp').value = ""; refreshMgmt(); } }
    function addJob() { const c = document.getElementById('compSelect').value; const j = document.getElementById('newJob').value.trim(); if(c && j && !tree[c].includes(j)) { tree[c].push(j); saveT(); document.getElementById('newJob').value = ""; refreshMgmt(); } }
    function saveT() { localStorage.setItem(dbKey+"_t", JSON.stringify(tree)); }
    function removeComp(c) { if(confirm(`移除客户“${c}”？`)) { delete tree[c]; saveT(); refreshMgmt(); } }
    function refreshMgmt() {
        document.getElementById('treeDisplay').innerHTML = Object.keys(tree).map(c => `<div class="tree-node"><div class="comp-header">${c} <span style="color:red;cursor:pointer" onclick="removeComp('${c}')">移除</span></div><div>${tree[c].map(j => `<span class="job-chip">${j}</span>`).join('')}</div></div>`).join('');
        const opt = '<option value="">-- 选择客户 --</option>' + Object.keys(tree).map(c => `<option value="${c}">${c}</option>`).join('');
        document.getElementById('compSelect').innerHTML = opt; document.getElementById('f1').innerHTML = opt; filterJobs();
    }
    function filterJobs() { const c = document.getElementById('f1').value; document.getElementById('f2').innerHTML = (c && tree[c]) ? '<option value="">-- 选择岗位 --</option>' + tree[c].map(j => `<option value="${j}">${j}</option>`).join('') : '<option value="">先选公司</option>'; }
    function doSearch() { render(); updateCharts(); }
    function saveData() { const row = { id: Date.now() }; for(let i=1; i<=16; i++) row['f'+i] = document.getElementById('f'+i).value; if(!row.f3 || !row.f1 || !row.f2) return alert("核心字段缺失"); data.push(row); localStorage.setItem(dbKey, JSON.stringify(data)); render(); updateCharts(); alert("存入成功"); }
    function render() {
        const n = document.getElementById('sName').value.toLowerCase(); const c = document.getElementById('sComp').value.toLowerCase(); const j = document.getElementById('sJob').value.toLowerCase();
        const f = data.filter(i => i.f3.toLowerCase().includes(n) && i.f1.toLowerCase().includes(c) && i.f2.toLowerCase().includes(j));
        document.getElementById('tableBody').innerHTML = f.map(i => {
            const age = i.f6 ? (curY - parseInt(i.f6)) : "-"; const exp = i.f14 ? (curY - parseInt(i.f14)) : "-";
            return `<tr><td><strong>${i.f3}</strong></td><td><span class="badge badge-${i.f5}">${i.f5}</span></td><td><div style="font-weight:700">${i.f1}</div><div style="font-size:12px;color:var(--text-sub)">${i.f2}</div></td><td>${i.f6||"-"}<span class="calc-sub">${age!="-"?age+" 岁":""}</span></td><td>${i.f13}<span class="calc-sub">${exp!="-"?"资历 "+exp+" 年":""}</span></td><td>${i.f10}</td><td><span style="color:red;cursor:pointer;font-weight:bold" onclick="del(${i.id})">移除</span></td></tr>`;
        }).join('');
    }
    function del(id) { if(confirm("移除记录？")) { data = data.filter(x => x.id !== id); localStorage.setItem(dbKey, JSON.stringify(data)); render(); updateCharts(); } }
    function updateCharts() {
        const filtered = data; if(filtered.length === 0) return;
        const s = {'合适':0,'不合适':0,'正在联系中':0}, e = {'大专':0,'本科':0,'研究生':0,'博士':0}, jb = {};
        filtered.forEach(i => { s[i.f5]++; e[i.f13]++; jb[i.f1] = (jb[i.f1] || 0) + 1; });
        draw('chartStatus', 'doughnut', Object.keys(s), Object.values(s), ['#34C759','#FF3B30','#FF9500'], true);
        draw('chartEdu', 'bar', Object.keys(e), Object.values(e), '#007AFF', false);
        draw('chartJob', 'bar', Object.keys(jb), Object.values(jb), '#AF52DE', false);
    }
    function draw(id, type, labels, data, colors, isD) {
        if(charts[id]) charts[id].destroy();
        charts[id] = new Chart(document.getElementById(id), {
            type: type, data: { labels, datasets: [{ data, backgroundColor: colors, borderRadius: 10 }] },
            options: { maintainAspectRatio:false, cutout: isD?'75%':0, plugins:{ legend:{ display:isD, position:'bottom', labels:{boxWidth:10, font:{size:10}} } }, scales:{ y:{ display:!isD, beginAtZero:true, ticks:{stepSize:1} }, x:{ display:!isD } } }
        });
    }
    function exportXLS() {
        const n = document.getElementById('sName').value.toLowerCase(); const c = document.getElementById('sComp').value.toLowerCase(); const j = document.getElementById('sJob').value.toLowerCase();
        const f = data.filter(i => i.f3.toLowerCase().includes(n) && i.f1.toLowerCase().includes(c) && i.f2.toLowerCase().includes(j));
        if(f.length === 0) return alert("无可导出数据");
        const h = ["客户", "岗位", "姓名", "性别", "状态", "出生年", "年龄", "产品", "所在地", "现公司", "学历", "入学年", "资历", "备注"];
        const s = { fill: { fgColor: { rgb: "007AFF" } }, font: { color: { rgb: "FFFFFF" }, bold: true } };
        const rows = [ h.map(x => ({v:x, s:s})), ...f.map(i => [i.f1, i.f2, i.f3, i.f4, i.f5, i.f6, i.f6?(curY-parseInt(i.f6)):"", i.f7, i.f8, i.f10, i.f13, i.f14, i.f14?(curY-parseInt(i.f14)):"", i.f16]) ];
        const ws = XLSX.utils.aoa_to_sheet(rows); const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "报告"); XLSX.writeFile(wb, "FLY_YUN_Final.xlsx");
    }
</script>
