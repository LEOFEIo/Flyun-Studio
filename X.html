<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FLY YUN - 智能寻访空间</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --ios-accent: #007AFF;
            --ios-bg: #F2F2F7;
            --glass: rgba(255, 255, 255, 0.45);
            --radius-max: 35px;
            --ios-red: #FF3B30;
        }

        body, html {
            margin: 0; padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", sans-serif;
            background: #F2F2F7;
            -webkit-font-smoothing: antialiased;
        }

        .liquid-bg { position: fixed; inset: 0; background: linear-gradient(120deg, #c3dafe 0%, #fdfbfb 100%); z-index: -1; }

        /* 登录 */
        #loginOverlay {
            position: fixed; inset: 0; display: flex; justify-content: center; align-items: center;
            z-index: 10000; background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(30px);
            transition: all 0.5s ease;
        }
        .spatial-card {
            background: rgba(255, 255, 255, 0.3); backdrop-filter: blur(50px) saturate(200%);
            border: 1px solid rgba(255, 255, 255, 0.4); border-radius: 50px;
            padding: 60px 40px; width: 85%; max-width: 380px; text-align: center;
        }

        .ios-26-input {
            width: 100%; padding: 20px; border-radius: 20px; border: none;
            background: rgba(255, 255, 255, 0.6); font-size: 18px; text-align: center; outline: none;
        }
        .ios-26-btn {
            width: 100%; padding: 18px; border-radius: 20px; border: none; background: #1d1d1f; color: white;
            font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 20px;
        }

        /* 主界面 */
        .app-shell { max-width: 1300px; margin: 0 auto; padding: 20px 20px 120px; display: none; }
        .ios-card {
            background: rgba(255, 255, 255, 0.6); backdrop-filter: blur(20px);
            border-radius: var(--radius-max); padding: 25px; margin-bottom: 25px;
            border: 1px solid rgba(255,255,255,0.5);
        }

        .dashboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 25px; }
        @media (max-width: 900px) { .dashboard { grid-template-columns: 1fr; } }
        .chart-container { height: 200px; }

        /* 搜索框 */
        .search-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 20px; }
        @media (max-width: 768px) { .search-row { grid-template-columns: 1fr; } }
        .search-input { width: 100%; padding: 12px 15px; border-radius: 15px; border: 1px solid rgba(0,0,0,0.08); background: rgba(255,255,255,0.7); outline: none; box-sizing: border-box; }

        /* 录入表单 */
        .form-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
        @media (max-width: 1024px) { .form-grid { grid-template-columns: repeat(2, 1fr); } }
        .field label { font-size: 11px; font-weight: 700; color: #8E8E93; margin-left: 10px; display: block; margin-bottom: 4px; }
        .field input, .field select { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid rgba(0,0,0,0.08); outline: none; box-sizing: border-box; }

        /* --- 聚合展示样式 --- */
        .group-header { background: rgba(0, 122, 255, 0.08); color: var(--ios-accent); font-weight: 800; }
        .group-header td { padding: 12px 20px !important; }
        .job-sub-header { background: rgba(0,0,0,0.02); font-weight: 700; color: #48484a; }
        .job-sub-header td { padding: 8px 40px !important; border-bottom: 1px solid rgba(0,0,0,0.02); }
        .indent-cell { padding-left: 65px !important; }
        .calc-info { font-size: 10px; color: var(--ios-accent); display: block; }

        /* 底部 Dock */
        .dock {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: rgba(255,255,255,0.8); backdrop-filter: blur(30px);
            padding: 12px 25px; border-radius: 35px; display: flex; gap: 15px;
            border: 1px solid rgba(255,255,255,0.5); box-shadow: 0 20px 50px rgba(0,0,0,0.1); z-index: 999;
        }
        .dock-btn { border: none; padding: 12px 25px; border-radius: 18px; font-weight: 700; cursor: pointer; }
        .btn-blue { background: #007AFF; color: white; }
        .btn-green { background: #34C759; color: white; }

        .badge { padding: 4px 8px; border-radius: 6px; font-size: 10px; font-weight: 700; }
        .badge-合适 { background: #D2F9D8; color: #1E6726; }
        .badge-不合适 { background: #FFE5E5; color: #D32F2F; }
        .badge-正在联系中 { background: #FFF4D2; color: #8A6D1F; }
    </style>
</head>
<body>

<div class="liquid-bg"></div>

<div id="loginOverlay">
    <div class="spatial-card">
        <h1>FLY YUN</h1>
        <p>输入密码解锁独立寻访空间</p>
        <input type="password" id="sysPass" class="ios-26-input" placeholder="输入密码" onkeydown="if(event.keyCode==13) login()">
        <button class="ios-26-btn" onclick="login()">解锁空间</button>
    </div>
</div>

<div class="app-shell" id="app">
    <header style="margin-bottom: 30px;">
        <h2 style="font-size: 34px; font-weight: 900; letter-spacing: -2px; margin: 0;">FLY YUN</h2>
        <div id="userDisplay" style="color: #8E8E93; font-size: 12px;"></div>
    </header>

    <div class="dashboard">
        <div class="ios-card"><div class="chart-container"><canvas id="chartStatus"></canvas></div></div>
        <div class="ios-card"><div class="chart-container"><canvas id="chartEdu"></canvas></div></div>
        <div class="ios-card"><div class="chart-container"><canvas id="chartJob"></canvas></div></div>
    </div>

    <div class="ios-card">
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px;">
            <div>
                <label style="font-size: 12px; font-weight: 700; color: #8e8e93;">🏢 添加客户</label>
                <div style="display:flex; gap:10px; mt-2">
                    <input type="text" id="newComp" class="search-input" placeholder="公司名">
                    <button class="btn-blue dock-btn" style="padding:10px 15px" onclick="addComp()">添加</button>
                </div>
            </div>
            <div>
                <label style="font-size: 12px; font-weight: 700; color: #8e8e93;">💼 添加岗位</label>
                <div style="display:flex; gap:10px;">
                    <select id="compSelect" class="search-input"><option value="">选公司</option></select>
                    <input type="text" id="newJob" class="search-input" placeholder="岗位名">
                    <button class="btn-blue dock-btn" style="padding:10px 15px" onclick="addJob()">添加</button>
                </div>
            </div>
        </div>
        <div id="treeDisplay" style="display:grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap:15px;"></div>
    </div>

    <div class="ios-card">
        <div style="font-size: 16px; font-weight: 800; margin-bottom: 15px;">📝 录入候选人</div>
        <div class="form-grid">
            <div class="field"><label>1. 客户公司</label><select id="f1" onchange="filterJobs()"></select></div>
            <div class="field"><label>2. 招聘岗位</label><select id="f2"></select></div>
            <div class="field"><label>3. 姓名</label><input type="text" id="f3"></div>
            <div class="field"><label>4. 状态</label><select id="f5"><option value="正在联系中">正在联系中</option><option value="合适">合适</option><option value="不合适">不合适</option></select></div>
            <div class="field"><label>5. 性别</label><select id="f4"><option value="男">男</option><option value="女">女</option></select></div>
            <div class="field"><label>6. 出生年</label><select id="f6"></select></div>
            <div class="field"><label>7. 现公司</label><input type="text" id="f10"></div>
            <div class="field"><label>8. 联系方式</label><input type="text" id="f11"></div>
            <div class="field"><label>9. 学历</label><select id="f13"><option value="本科">本科</option><option value="研究生">研究生</option><option value="大专">大专</option><option value="博士">博士</option></select></div>
            <div class="field"><label>10. 入学年</label><select id="f14"></select></div>
            <div class="field"><label>11. 所在城市</label><input type="text" id="f8"></div>
            <div class="field"><label>12. 备注</label><input type="text" id="f16"></div>
        </div>
    </div>

    <div class="ios-card" style="padding:0; overflow:hidden;">
        <div style="padding: 20px;">
            <div class="search-row">
                <input type="text" id="sName" class="search-input" placeholder="🔍 搜人名..." oninput="render()">
                <input type="text" id="sComp" class="search-input" placeholder="🔍 搜客户..." oninput="render()">
                <input type="text" id="sJob" class="search-input" placeholder="🔍 搜岗位..." oninput="render()">
            </div>
        </div>
        <div style="overflow-x:auto;">
            <table style="width:100%; border-collapse:collapse; min-width:1000px; font-size: 14px;">
                <thead>
                    <tr style="background:rgba(0,0,0,0.02); text-align:left; color:#8e8e93; font-size:12px;">
                        <th style="padding:15px 20px;">姓名</th>
                        <th>状态</th>
                        <th>出生年(年龄)</th>
                        <th>学历(资历)</th>
                        <th>现公司/城市</th>
                        <th>联系方式</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>
</div>

<div class="dock" id="dock" style="display:none">
    <button class="dock-btn btn-blue" onclick="saveRecord()">✅ 存入空间</button>
    <button class="dock-btn btn-green" onclick="exportExcel()">📊 导出 Excel</button>
    <button class="dock-btn" style="background:#E5E5EA;" onclick="location.reload()">🔒 锁定</button>
</div>

<script>
    let dbKey = ""; let candidates = []; let treeData = {}; let charts = {};
    const curY = new Date().getFullYear();

    function login() {
        const p = document.getElementById('sysPass').value;
        if(!p) return;
        dbKey = "FLY_YUN_V26_" + btoa(p);
        document.getElementById('loginOverlay').style.display = 'none';
        document.getElementById('app').style.display = 'block';
        document.getElementById('dock').style.display = 'flex';
        document.getElementById('userDisplay').innerText = "Auth: " + p;
        init();
    }

    function init() {
        let y6 = '<option value="">出生年</option>';
        for(let i=1970; i<=2010; i++) y6 += `<option value="${i}">${i}</option>`;
        document.getElementById('f6').innerHTML = y6;
        let y14 = '<option value="">入学年</option>';
        for(let i=1990; i<=2025; i++) y14 += `<option value="${i}">${i}</option>`;
        document.getElementById('f14').innerHTML = y14;

        candidates = JSON.parse(localStorage.getItem(dbKey) || "[]");
        treeData = JSON.parse(localStorage.getItem(dbKey + "_tree") || "{}");
        refreshMgmt(); render(); updateCharts();
    }

    function addComp() {
        const c = document.getElementById('newComp').value.trim();
        if(c && !treeData[c]) { treeData[c] = []; saveTree(); document.getElementById('newComp').value = ""; refreshMgmt(); }
    }
    function addJob() {
        const c = document.getElementById('compSelect').value;
        const j = document.getElementById('newJob').value.trim();
        if(c && j && !treeData[c].includes(j)) { treeData[c].push(j); saveTree(); document.getElementById('newJob').value = ""; refreshMgmt(); }
    }
    function saveTree() { localStorage.setItem(dbKey + "_tree", JSON.stringify(treeData)); }
    function refreshMgmt() {
        document.getElementById('treeDisplay').innerHTML = Object.keys(treeData).map(c => `
            <div style="background:white; padding:12px; border-radius:15px; border:1px solid #eee;">
                <div style="font-weight:800; font-size:13px; margin-bottom:8px;">🏢 ${c}</div>
                <div style="display:flex; flex-wrap:wrap; gap:5px;">
                    ${treeData[c].map(j => `<span style="background:#f0f0f0; padding:3px 8px; border-radius:8px; font-size:11px;">${j}</span>`).join('')}
                </div>
            </div>
        `).join('');
        const opt = '<option value="">-- 选择客户 --</option>' + Object.keys(treeData).map(c => `<option value="${c}">${c}</option>`).join('');
        document.getElementById('compSelect').innerHTML = opt;
        document.getElementById('f1').innerHTML = opt;
    }
    function filterJobs() {
        const c = document.getElementById('f1').value;
        document.getElementById('f2').innerHTML = (c && treeData[c]) ? treeData[c].map(j => `<option value="${j}">${j}</option>`).join('') : '<option value="">无岗位</option>';
    }

    function saveRecord() {
        const row = { id: Date.now() };
        for(let i=1; i<=16; i++) {
            const el = document.getElementById('f'+i);
            if(el) row['f'+i] = el.value;
        }
        if(!row.f3 || !row.f1) return alert("姓名和客户是必填项");
        candidates.push(row);
        localStorage.setItem(dbKey, JSON.stringify(candidates));
        document.getElementById('f3').value = "";
        render(); updateCharts();
    }

    // --- 核心聚合搜索逻辑 ---
    function render() {
        const n = document.getElementById('sName').value.toLowerCase();
        const c = document.getElementById('sComp').value.toLowerCase();
        const j = document.getElementById('sJob').value.toLowerCase();
        
        const filtered = candidates.filter(i => 
            (i.f3||"").toLowerCase().includes(n) && 
            (i.f1||"").toLowerCase().includes(c) && 
            (i.f2||"").toLowerCase().includes(j)
        );

        const grouped = {};
        filtered.forEach(item => {
            if (!grouped[item.f1]) grouped[item.f1] = {};
            if (!grouped[item.f1][item.f2]) grouped[item.f1][item.f2] = [];
            grouped[item.f1][item.f2].push(item);
        });

        let html = "";
        for (const compName in grouped) {
            html += `<tr class="group-header"><td colspan="7">🏢 ${compName}</td></tr>`;
            for (const jobName in grouped[compName]) {
                html += `<tr class="job-sub-header"><td colspan="7">└─ 💼 ${jobName}</td></tr>`;
                grouped[compName][jobName].forEach(i => {
                    const age = i.f6 ? (curY - parseInt(i.f6)) : "-";
                    const exp = i.f14 ? (curY - parseInt(i.f14)) : "-";
                    html += `
                        <tr style="border-bottom:1px solid rgba(0,0,0,0.03);">
                            <td style="padding:12px 20px;" class="indent-cell"><strong>${i.f3}</strong></td>
                            <td><span class="badge badge-${i.f5}">${i.f5}</span></td>
                            <td>${i.f6||"-"}<span class="calc-info">${age!='-'?age+'岁':''}</span></td>
                            <td>${i.f13||"-"}<span class="calc-info">${exp!='-'?'资历'+exp+'年':''}</span></td>
                            <td><div style="font-weight:600">${i.f10||"-"}</div><div style="font-size:11px;color:#999">${i.f8||"" }</div></td>
                            <td>${i.f11||"-"}</td>
                            <td><span style="color:red; cursor:pointer; font-size:12px;" onclick="del(${i.id})">移除</span></td>
                        </tr>`;
                });
            }
        }
        document.getElementById('tableBody').innerHTML = html || '<tr><td colspan="7" style="text-align:center;padding:50px;color:#ccc;">无匹配结果</td></tr>';
    }

    function del(id) { if(confirm("确定移除？")) { candidates = candidates.filter(x => x.id !== id); localStorage.setItem(dbKey, JSON.stringify(candidates)); render(); updateCharts(); } }

    function updateCharts() {
        if(candidates.length === 0) return;
        const s = { '合适':0, '不合适':0, '正在联系中':0 };
        const e = { '本科':0, '研究生':0, '大专':0, '博士':0 };
        candidates.forEach(i => { if(s[i.f5]!==undefined) s[i.f5]++; if(e[i.f13]!==undefined) e[i.f13]++; });

        draw('chartStatus', 'doughnut', Object.keys(s), Object.values(s), ['#34C759','#FF3B30','#FF9500']);
        draw('chartEdu', 'bar', Object.keys(e), Object.values(e), '#007AFF');
    }

    function draw(id, type, labels, data, colors) {
        if(charts[id]) charts[id].destroy();
        charts[id] = new Chart(document.getElementById(id), {
            type: type
