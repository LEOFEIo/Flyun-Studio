<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>飞云智能寻访空间 · Pure Light</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --ios-accent: #007AFF;
            --ios-bg: #F2F2F7;
            --ios-card: rgba(255, 255, 255, 0.75);
            --radius-max: 28px;
            --ios-red: #FF3B30;
            --admin-purple: #AF52DE;
            --text-main: #1D1D1F;
            --text-sub: #86868B;
        }

        body, html {
            margin: 0; padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", sans-serif;
            background: var(--ios-bg);
            color: var(--text-main);
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* --- 主界面极光背景 --- */
        .aurora-bg {
            position: fixed; inset: 0; z-index: -1;
            background: linear-gradient(140deg, #fdfbfb 0%, #ebedee 100%);
            overflow: hidden;
        }
        .aurora-bg::before, .aurora-bg::after {
            content: ""; position: absolute; border-radius: 50%;
            filter: blur(100px); opacity: 0.45;
            animation: auroraMove 30s infinite alternate ease-in-out;
        }
        .aurora-bg::before { width: 1200px; height: 1200px; background: radial-gradient(circle, #D4E2FF 0%, rgba(255,255,255,0) 70%); top: -400px; right: -200px; }
        .aurora-bg::after { width: 1000px; height: 1000px; background: radial-gradient(circle, #E0F2F1 0%, rgba(255,255,255,0) 70%); bottom: -300px; left: -100px; animation-delay: -5s; }
        
        @keyframes auroraMove { 
            from { transform: translate(0, 0) scale(1); } 
            to { transform: translate(150px, 100px) scale(1.1); } 
        }

        /* --- 登录层：动态彩色流动背景 --- */
        #loginOverlay { 
            position: fixed; inset: 0; 
            display: flex; justify-content: center; align-items: center; 
            z-index: 10000; 
            /* 渐变色定义：iOS 风格多彩流动 */
            background: linear-gradient(45deg, #f3f4f7, #e2ebff, #ffdbfd, #d9f2ef, #f3f4f7);
            background-size: 400% 400%;
            animation: gradientFlow 15s ease infinite;
            backdrop-filter: blur(10px);
            transition: 0.8s cubic-bezier(0.4, 0, 0.2, 1); 
        }

        @keyframes gradientFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        .login-card { 
            background: rgba(255, 255, 255, 0.55); 
            backdrop-filter: blur(30px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.7); 
            border-radius: 45px; 
            padding: 60px 40px; 
            width: 340px; 
            text-align: center; 
            box-shadow: 0 40px 100px rgba(0,0,0,0.08); 
        }
        .login-card h1 { font-size: 38px; font-weight: 900; margin: 0; letter-spacing: -2.5px; color: var(--text-main); }
        .login-card p { color: var(--text-sub); font-size: 14px; margin-top: 8px; }

        .ios-input-field { width: 100%; padding: 18px; border-radius: 18px; border: 1px solid rgba(0,0,0,0.05); background: rgba(255,255,255,0.8); font-size: 17px; font-weight: 600; text-align: center; outline: none; margin-top: 30px; box-sizing: border-box; transition: 0.3s; }
        .ios-input-field:focus { border-color: var(--ios-accent); background: #FFF; box-shadow: 0 0 0 4px rgba(0,122,255,0.1); }
        
        .btn-modern { width: 100%; padding: 18px; border-radius: 18px; border: none; background: var(--ios-accent); color: white; font-weight: 700; cursor: pointer; margin-top: 20px; transition: 0.3s; }
        .btn-modern:active { transform: scale(0.96); opacity: 0.9; }

        /* --- 核心容器 --- */
        .app-shell { max-width: 1400px; margin: 0 auto; padding: 40px 20px 140px; display: none; }
        .ios-card { background: var(--ios-card); backdrop-filter: blur(30px); border-radius: var(--radius-max); padding: 25px; margin-bottom: 25px; border: 1px solid #FFF; box-shadow: 0 10px 40px rgba(0,0,0,0.02); }

        .dashboard-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 25px; }
        @media (max-width: 1024px) { .dashboard-row { grid-template-columns: 1fr; } }
        .chart-box { height: 240px; text-align: center; }

        .form-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; }
        .field { display: flex; flex-direction: column; gap: 5px; }
        .field label { font-size: 11px; font-weight: 700; color: var(--text-sub); margin-left: 10px; }
        .field input, .field select { padding: 12px; border-radius: 12px; border: 1px solid #E5E5EA; background: #FFF; outline: none; font-size: 14px; }

        .ios-table { width: 100%; border-collapse: collapse; min-width: 1200px; }
        .ios-table th { text-align: left; padding: 15px; font-size: 12px; color: var(--text-sub); border-bottom: 1px solid #F2F2F7; }
        .ios-table td { padding: 18px 15px; border-bottom: 1px solid #F2F2F7; font-size: 14px; }
        
        .badge { padding: 4px 10px; border-radius: 8px; font-size: 11px; font-weight: 700; }
        .badge-合适 { background: #E8F5E9; color: #2E7D32; }
        .calc-sub { font-size: 11px; color: var(--ios-accent); font-weight: 700; display: block; margin-top: 2px; }

        .dock { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(40px); padding: 12px 30px; border-radius: 40px; display: flex; gap: 15px; border: 1px solid #FFF; box-shadow: 0 20px 60px rgba(0,0,0,0.1); z-index: 999; }
    </style>
<link rel="stylesheet" href="assets/tezign-system.css" />
</head>
<body>

<div class="aurora-bg"></div>

<div id="loginOverlay">
    <div class="login-card">
        <h1>飞云寻访</h1>
        <p>生成您自己的智能寻访空间</p>
        <input type="password" id="sysPass" class="ios-input-field" placeholder="输入访问密码" onkeydown="if(event.keyCode==13) handleLogin()">
        <button class="btn-modern" onclick="handleLogin()">解锁 / 进入空间</button>
    </div>
</div>

<div class="app-shell" id="app">
    <header style="margin-bottom: 40px;">
        <h2 style="font-size: 34px; font-weight: 900; letter-spacing: -2.5px; margin: 0;">飞云寻访</h2>
        <div id="userDisplay" style="color: var(--text-sub); font-size: 13px; margin-top: 5px;"></div>
    </header>

    <div class="dashboard-row">
        <div class="ios-card chart-box">
            <div style="font-size:13px; font-weight:700; margin-bottom:15px;">寻访状态</div>
            <div style="height:180px"><canvas id="chartStatus"></canvas></div>
        </div>
        <div class="ios-card chart-box">
            <div style="font-size:13px; font-weight:700; margin-bottom:15px;">学历背景</div>
            <div style="height:180px"><canvas id="chartEdu"></canvas></div>
        </div>
        <div class="ios-card chart-box">
            <div style="font-size:13px; font-weight:700; margin-bottom:15px;">客户分布</div>
            <div style="height:180px"><canvas id="chartJob"></canvas></div>
        </div>
    </div>

    <div class="ios-card">
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
            <div class="field"><label>🏢 添加公司</label><div style="display:flex;gap:8px"><input type="text" id="newC" style="flex:1" placeholder="公司名..."><button class="btn-modern" style="width:auto;margin:0;padding:0 20px" onclick="addC()">添加</button></div></div>
            <div class="field"><label>💼 添加岗位</label><div style="display:flex;gap:8px"><select id="selC" style="flex:1"></select><input type="text" id="newJ" style="flex:1" placeholder="岗位名..."><button class="btn-modern" style="width:auto;margin:0;padding:0 20px" onclick="addJ()">添加</button></div></div>
        </div>
        <div id="tree" style="margin-top:20px; display:flex; flex-wrap:wrap; gap:8px"></div>
    </div>

    <div class="ios-card">
        <div style="font-weight: 700; margin-bottom: 20px;">📝 候选人全维度录入</div>
        <div class="form-grid">
            <div class="field"><label>客户</label><select id="f1" onchange="syncJ()"></select></div>
            <div class="field"><label>岗位</label><select id="f2"></select></div>
            <div class="field"><label>姓名</label><input type="text" id="f3" placeholder="必填"></div>
            <div class="field"><label>性别</label><select id="f4"><option>男</option><option>女</option></select></div>
            <div class="field"><label>状态</label><select id="f5"><option>正在联系中</option><option>合适</option><option>不合适</option><option>已面试</option><option>入职</option></select></div>
            <div class="field"><label>出生年</label><select id="f6"></select></div>
            <div class="field"><label>负责产品</label><input type="text" id="f7"></div>
            <div class="field"><label>所在地</label><input type="text" id="f8"></div>
            <div class="field"><label>现职级</label><input type="text" id="f9"></div>
            <div class="field"><label>现公司</label><input type="text" id="f10"></div>
            <div class="field"><label>联系方式</label><input type="text" id="f11"></div>
            <div class="field"><label>薪资情况</label><input type="text" id="f12"></div>
            <div class="field"><label>学历</label><select id="f13"><option>大专</option><option>本科</option><option>研究生</option><option>博士</option></select></div>
            <div class="field"><label>入学年</label><select id="f14"></select></div>
            <div class="field"><label>毕业学校</label><input type="text" id="f15"></div>
            <div class="field"><label>备注说明</label><input type="text" id="f16"></div>
        </div>
    </div>

    <div class="ios-card" style="padding:0; overflow:hidden">
        <div style="padding:20px 25px 0">
            <div style="font-weight:700; margin-bottom:15px">🔍 名单多维搜索</div>
            <div style="display:grid; grid-template-columns:repeat(4,1fr); gap:12px">
                <input type="text" id="sN" class="ios-input-field" style="margin:0; padding:10px; font-size:14px;" placeholder="搜姓名..." oninput="render()">
                <input type="text" id="sC" class="ios-input-field" style="margin:0; padding:10px; font-size:14px;" placeholder="搜公司..." oninput="render()">
                <input type="text" id="sJ" class="ios-input-field" style="margin:0; padding:10px; font-size:14px;" placeholder="搜岗位..." oninput="render()">
                <button class="btn-modern" style="margin:0; padding:10px; background:#8E8E93; font-size:13px;" onclick="resetSearch()">清空条件</button>
            </div>
        </div>
        <div style="overflow-x:auto">
            <table class="ios-table">
                <thead><tr><th>姓名</th><th>状态</th><th>客户 / 岗位</th><th>年龄</th><th>资历</th><th>联系方式</th><th>操作</th></tr></thead>
                <tbody id="tbody"></tbody>
            </table>
        </div>
    </div>
</div>

<div class="dock" id="userDock" style="display:none">
    <button class="btn-modern" style="width:auto; padding:12px 30px" onclick="save()">✅ 存入名单</button>
    <button class="btn-modern" style="width:auto; padding:12px 25px; background:#34C759" onclick="exportExcel()">📊 导出 Excel</button>
    <button class="btn-modern" style="width:auto; padding:12px 20px; background:#E5E5EA; color:#000" onclick="location.reload()">🔒 退出</button>
</div>

<script>
    let dbKey = ""; let data = []; let tree = {}; let charts = {};
    const curY = new Date().getFullYear();

    async function handleLogin() {
        const p = document.getElementById('sysPass').value; if(!p) return;
        dbKey = "FLY_DB_V12_" + btoa(p);
        let spaces = JSON.parse(localStorage.getItem("FLY_REG_L") || "[]");
        if(!spaces.includes(p)) { spaces.push(p); localStorage.setItem("FLY_REG_L", JSON.stringify(spaces)); }
        
        const overlay = document.getElementById('loginOverlay');
        overlay.style.opacity = '0';
        overlay.style.transform = 'scale(1.1)';
        
        setTimeout(() => {
            overlay.style.display = 'none';
            document.getElementById('app').style.display = 'block';
            document.getElementById('userDock').style.display = 'flex';
            document.getElementById('userDisplay').innerText = "当前空间: " + p;
            initApp();
        }, 500);
    }

    function initApp() {
        let y6 = '<option value="">年份</option>'; for(let i=1965; i<=2022; i++) y6 += `<option value="${i}">${i}</option>`;
        document.getElementById('f6').innerHTML = y6;
        let y14 = '<option value="">年份</option>'; for(let i=1980; i<=2025; i++) y14 += `<option value="${i}">${i}</option>`;
        document.getElementById('f14').innerHTML = y14;
        data = JSON.parse(localStorage.getItem(dbKey) || "[]");
        tree = JSON.parse(localStorage.getItem(dbKey+"_t") || "{}");
        refreshMgmt(); render(); updateCharts();
    }

    function addC() { const v = document.getElementById('newC').value.trim(); if(v && !tree[v]) { tree[v] = []; saveT(); document.getElementById('newC').value = ""; refreshMgmt(); } }
    function addJ() { const c = document.getElementById('selC').value; const j = document.getElementById('newJ').value.trim(); if(c && j && !tree[c].includes(j)) { tree[c].push(j); saveT(); document.getElementById('newJ').value = ""; refreshMgmt(); } }
    function saveT() { localStorage.setItem(dbKey+"_t", JSON.stringify(tree)); }
    function refreshMgmt() {
        document.getElementById('tree').innerHTML = Object.keys(tree).map(c => `<span class="badge" style="background:#FFF;border:1px solid #DDD">${c} (${tree[c].length})</span>`).join('');
        const opt = '<option value="">-- 选择客户 --</option>' + Object.keys(tree).map(c => `<option value="${c}">${c}</option>`).join('');
        document.getElementById('selC').innerHTML = opt; document.getElementById('f1').innerHTML = opt;
    }
    function syncJ() { const c = document.getElementById('f1').value; document.getElementById('f2').innerHTML = tree[c] ? tree[c].map(j => `<option value="${j}">${j}</option>`).join('') : '<option>请选择客户</option>'; }

    function save() {
        const r = { id: Date.now() }; 
        for(let i=1; i<=16; i++) { 
            let el=document.getElementById('f'+i); 
            if(el) r['f'+i] = el.value; 
        }
        if(!r.f3) return alert("请输入候选人姓名");
        data.push(r); 
        localStorage.setItem(dbKey, JSON.stringify(data)); 
        render(); updateCharts();
        alert("存入成功");
    }

    function render() {
        const n = document.getElementById('sN').value.toLowerCase();
        const c = document.getElementById('sC').value.toLowerCase();
        const j = document.getElementById('sJ').value.toLowerCase();
        const f = data.filter(i => (i.f3||"").toLowerCase().includes(n) && (i.f1||"").toLowerCase().includes(c) && (i.f2||"").toLowerCase().includes(j));
        document.getElementById('tbody').innerHTML = f.map(i => {
            const age = i.f6 ? (curY - parseInt(i.f6)) : "-";
            const exp = i.f14 ? (curY - parseInt(i.f14)) : "-";
            return `<tr>
                <td><b>${i.f3}</b><br><small>${i.f4||""}</small></td>
                <td><span class="badge badge-${i.f5}">${i.f5}</span></td>
                <td><b>${i.f1||"-"}</b><br><small>${i.f2||"-"}</small></td>
                <td>${age}岁<span class="calc-sub">${i.f6||"-"}</span></td>
                <td>资历 ${exp}年<span class="calc-sub">${i.f13}</span></td>
                <td>${i.f11||"-"}</td>
                <td><button style="color:var(--ios-red);border:none;background:none;cursor:pointer" onclick="del(${i.id})">删除</button></td>
            </tr>`;
        }).join('');
    }

    function resetSearch() {
        document.getElementById('sN').value = ''; document.getElementById('sC').value = ''; document.getElementById('sJ').value = '';
        render();
    }

    function del(id) { if(confirm("确定删除？")) { data = data.filter(x => x.id !== id); localStorage.setItem(dbKey, JSON.stringify(data)); render(); updateCharts(); } }

    function updateCharts() {
        if(data.length === 0) return;
        const s = {'合适':0,'不合适':0,'正在联系中':0,'已面试':0,'入职':0}, e = {'大专':0,'本科':0,'研究生':0,'博士':0}, jb = {};
        data.forEach(i => { 
            if(s[i.f5] !== undefined) s[i.f5]++; 
            if(e[i.f13] !== undefined) e[i.f13]++; 
            jb[i.f1||"未分类"] = (jb[i.f1||"未分类"] || 0) + 1; 
        });
        draw('chartStatus', 'doughnut', Object.keys(s), Object.values(s), ['#34C759','#FF3B30','#FF9500','#5856D6','#AF52DE'], true);
        draw('chartEdu', 'bar', Object.keys(e), Object.values(e), '#007AFF', false);
        draw('chartJob', 'bar', Object.keys(jb), Object.values(jb), '#5AC8FA', false);
    }

    function draw(id, type, labels, data, colors, isD) {
        if(charts[id]) charts[id].destroy();
        charts[id] = new Chart(document.getElementById(id), {
            type: type, data: { labels, datasets: [{ data, backgroundColor: colors, borderRadius: 8 }] },
            options: { maintainAspectRatio:false, cutout: isD?'75%':0, plugins:{ legend:{ display:isD, position:'bottom', labels:{boxWidth:8, font:{size:10}} } }, scales:{ y:{ display:!isD, beginAtZero:true }, x:{ display:!isD } } }
        });
    }

    function exportExcel() {
        if(data.length === 0) return alert("无数据可导出");
        const h = ["客户", "岗位", "姓名", "性别", "状态", "出生年", "年龄", "负责产品", "所在地", "现职级", "现公司", "联系方式", "薪资情况", "学历", "入学年", "资历", "毕业学校", "备注说明"];
        const s = { fill: { fgColor: { rgb: "007AFF" } }, font: { color: { rgb: "FFFFFF" }, bold: true } };
        const rows = [ 
            h.map(x => ({v:x, s:s})), 
            ...data.map(i => [
                i.f1, i.f2, i.f3, i.f4, i.f5, i.f6, 
                i.f6 ? (curY - parseInt(i.f6)) : "", 
                i.f7, i.f8, i.f9, i.f10, i.f11, i.f12, i.f13, i.f14,
                i.f14 ? (curY - parseInt(i.f14)) : "",
                i.f15, i.f16
            ]) 
        ];
        const ws = XLSX.utils.aoa_to_sheet(rows); const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "报告"); 
        XLSX.writeFile(wb, `寻访报告_${new Date().toISOString().split('T')[0]}.xlsx`);
    }
</script>
<script src="assets/flyun-cms.js"></script>
<script src="assets/tezign-system.js"></script>
</body>
</html>
