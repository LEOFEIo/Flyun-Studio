<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FLY YUN - 猎头智能寻访空间</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --ios-accent: #007AFF;
            --ios-bg: #F2F2F7;
            --glass: rgba(255, 255, 255, 0.45);
            --radius-max: 35px;
            --ios-red: #FF3B30;
        }

        body, html {
            margin: 0; padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", sans-serif;
            background: #F2F2F7;
            -webkit-font-smoothing: antialiased;
        }

        /* --- iOS 26 流光背景 --- */
        .liquid-bg { position: fixed; inset: 0; background: linear-gradient(120deg, #c3dafe 0%, #fdfbfb 100%); z-index: -1; }
        .liquid-bg::after { content: ""; position: absolute; width: 200%; height: 200%; top: -50%; left: -50%; background: radial-gradient(circle, rgba(0,122,255,0.12) 0%, rgba(255,255,255,0) 50%); animation: drift 20s infinite alternate ease-in-out; }
        @keyframes drift { from { transform: rotate(0deg); } to { transform: rotate(15deg); } }

        /* --- 空间登录 --- */
        #loginOverlay { position: fixed; inset: 0; display: flex; justify-content: center; align-items: center; z-index: 10000; background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(30px); transition: 0.8s; }
        .spatial-card { background: rgba(255, 255, 255, 0.3); backdrop-filter: blur(50px); border: 1px solid rgba(255, 255, 255, 0.4); border-radius: 50px; padding: 60px 40px; width: 85%; max-width: 380px; text-align: center; box-shadow: 0 40px 100px rgba(0,0,0,0.08); }
        .ios-26-input { width: 100%; padding: 22px; border-radius: 25px; border: none; background: rgba(255, 255, 255, 0.6); font-size: 18px; font-weight: 600; text-align: center; outline: none; transition: 0.3s; box-sizing: border-box; }
        .ios-26-btn { width: 100%; padding: 20px; border-radius: 25px; border: none; background: #1d1d1f; color: white; font-size: 17px; font-weight: 700; cursor: pointer; transition: 0.3s; margin-top: 25px; }

        /* --- 主界面 --- */
        .app-shell { max-width: 1300px; margin: 0 auto; padding: 20px 20px 120px; display: none; }
        .ios-card { background: rgba(255, 255, 255, 0.6); backdrop-filter: blur(20px); border-radius: var(--radius-max); padding: 25px; margin-bottom: 25px; border: 1px solid rgba(255,255,255,0.5); box-shadow: 0 10px 40px rgba(0,0,0,0.02); }

        /* --- 新增：智能寻访聚合搜索 --- */
        .search-engine { background: linear-gradient(135deg, rgba(0,122,255,0.1), rgba(255,255,255,0.5)); }
        .search-engine-grid { display: flex; gap: 15px; margin-top: 15px; }
        .search-engine-input { flex: 1; padding: 15px; border-radius: 18px; border: 1px solid rgba(0,0,0,0.1); background: white; font-size: 15px; outline: none; }

        /* 可视化看板 */
        .dashboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 25px; }
        @media (max-width: 900px) { .dashboard { grid-template-columns: 1fr; } }
        .chart-container { height: 200px; }

        /* 搜索功能区 */
        .search-filter-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-top: 15px; }
        @media (max-width: 768px) { .search-filter-row { grid-template-columns: 1fr; } }
        .btn-search { background: var(--ios-accent); color: white; border: none; border-radius: 12px; padding: 10px 20px; font-weight: 600; cursor: pointer; transition: 0.2s; white-space: nowrap; }

        /* 表单网格 */
        .form-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; }
        @media (max-width: 768px) { .form-grid { grid-template-columns: 1fr; } }
        .field { display: flex; flex-direction: column; gap: 5px; }
        .field label { font-size: 11px; font-weight: 700; color: #8E8E93; margin-left: 10px; }
        .field input, .field select { padding: 14px; border-radius: 15px; border: 1px solid rgba(0,0,0,0.08); background: white; font-size: 15px; outline: none; }

        /* 底部 Dock */
        .dock { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: rgba(255,255,255,0.75); backdrop-filter: blur(35px); padding: 12px 25px; border-radius: 35px; display: flex; gap: 15px; border: 1px solid rgba(255,255,255,0.5); box-shadow: 0 20px 50px rgba(0,0,0,0.1); z-index: 999; }
        .dock-btn { border: none; padding: 14px 25px; border-radius: 20px; font-weight: 700; font-size: 14px; cursor: pointer; transition: 0.2s; }
        
        /* 徽章与计算结果 */
        .badge { padding: 4px 10px; border-radius: 8px; font-size: 11px; font-weight: 700; }
        .badge-合适 { background: #D2F9D8; color: #1E6726; }
        .badge-不合适 { background: #FFE5E5; color: #D32F2F; }
        .badge-正在联系中 { background: #FFF4D2; color: #8A6D1F; }
        .calc-sub { display: block; font-size: 11px; color: var(--ios-accent); font-weight: 700; margin-top: 2px; }
    </style>
</head>
<body>

<div class="liquid-bg"></div>

<div id="loginOverlay">
    <div class="spatial-card">
        <h1>FLY YUN</h1>
        <p>生成您自己的存储空间<br><span style="font-size: 11px; opacity: 0.7;">数据将加密保存在您的浏览器本地</span></p>
        <input type="password" id="sysPass" class="ios-26-input" placeholder="输入访问密码" onkeydown="if(event.keyCode==13) login()">
        <button class="ios-26-btn" onclick="login()">解锁 / 进入</button>
    </div>
</div>

<div class="app-shell" id="app">
    <header style="margin-bottom: 30px;">
        <h2 style="font-size: 34px; font-weight: 900; letter-spacing: -2px; margin: 0;">FLY YUN</h2>
        <div id="userDisplay" style="color: #8E8E93; font-size: 12px; margin-top: 5px;"></div>
    </header>

    <div class="ios-card search-engine">
        <div style="font-size: 16px; font-weight: 800; color: var(--ios-accent);">🔍 全网人才雷达 (一键 Mapping)</div>
        <div class="search-engine-grid">
            <input type="text" id="radarSearch" class="search-engine-input" placeholder="输入：公司 + 职位关键词（例如：华为 芯片架构师）">
            <button class="btn-search" onclick="radarGo('boss')">搜BOSS</button>
            <button class="btn-search" onclick="radarGo('liepin')">搜猎聘</button>
            <button class="btn-search" style="background:#000" onclick="radarGo('google')">搜全网</button>
        </div>
        <div style="font-size: 11px; color: #8e8e93; margin-top: 10px;">* 点击后将自动为您调配高级搜索指令并跳转对应平台</div>
    </div>

    <div class="dashboard">
        <div class="ios-card"><div class="chart-container"><canvas id="chart1"></canvas></div></div>
        <div class="ios-card"><div class="chart-container"><canvas id="chart2"></canvas></div></div>
        <div class="ios-card"><div class="chart-container"><canvas id="chart3"></canvas></div></div>
    </div>

    <div class="ios-card">
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
            <div>
                <div style="font-size: 14px; font-weight: 700; margin-bottom: 10px;">🏢 客户公司</div>
                <div style="display:flex; gap:10px;"><input type="text" id="newC" class="search-input" style="flex:1; padding:12px; border-radius:12px; border:1px solid #ddd;" placeholder="新增客户..."><button class="btn-search" onclick="addC()">添加</button></div>
            </div>
            <div>
                <div style="font-size: 14px; font-weight: 700; margin-bottom: 10px;">💼 岗位库</div>
                <div style="display:flex; gap:10px;"><select id="selC" style="flex:1; padding:12px; border-radius:12px; border:1px solid #ddd;"></select><input type="text" id="newJ" style="flex:1; padding:12px; border-radius:12px; border:1px solid #ddd;" placeholder="岗位名..."><button class="btn-search" onclick="addJ()">添加</button></div>
            </div>
        </div>
        <div id="tree" style="margin-top:20px;"></div>
    </div>

    <div class="ios-card">
        <div style="font-size: 14px; font-weight: 700; margin-bottom: 15px;">📝 录入候选人 (16环节)</div>
        <div class="form-grid">
            <div class="field"><label>1. 推荐公司</label><select id="f1" onchange="syncJ()"></select></div>
            <div class="field"><label>2. 推荐岗位</label><select id="f2"></select></div>
            <div class="field"><label>3. 姓名</label><input type="text" id="f3"></div>
            <div class="field"><label>4. 性别</label><select id="f4"><option>男</option><option>女</option></select></div>
            <div class="field"><label>5. 状态</label><select id="f5"><option>正在联系中</option><option>合适</option><option>不合适</option></select></div>
            <div class="field"><label>6. 出生年份</label><select id="f6"></select></div>
            <div class="field"><label>7. 岗位产品</label><input type="text" id="f7"></div>
            <div class="field"><label>8. 目前所在地</label><input type="text" id="f8"></div>
            <div class="field"><label>9. 期望所在地</label><input type="text" id="f9"></div>
            <div class="field"><label>10. 现公司</label><input type="text" id="f10"></div>
            <div class="field"><label>11. 电话/微信号</label><input type="text" id="f11"></div>
            <div class="field"><label>12. 邮箱</label><input type="text" id="f12"></div>
            <div class="field"><label>13. 学历</label><select id="f13"><option>大专</option><option>本科</option><option>研究生</option><option>博士</option></select></div>
            <div class="field"><label>14. 入学年份</label><select id="f14"></select></div>
            <div class="field"><label>15. 学校</label><input type="text" id="f15"></div>
            <div class="field"><label>16. 备注</label><input type="text" id="f16"></div>
        </div>
    </div>

    <div class="ios-card" style="padding:0; overflow:hidden;">
        <div style="padding: 20px;">
            <div style="font-size: 15px; font-weight: 800; margin-bottom: 15px;">🔍 人才名单检索</div>
            <div class="search-filter-row">
                <div class="field"><label>搜姓名</label><div style="display:flex;gap:5px"><input type="text" id="sN" class="search-input" style="flex:1;padding:10px;border-radius:10px;border:1px solid #ddd;"><button class="btn-search" onclick="renderTable()">搜索</button></div></div>
                <div class="field"><label>搜公司</label><div style="display:flex;gap:5px"><input type="text" id="sC" class="search-input" style="flex:1;padding:10px;border-radius:10px;border:1px solid #ddd;"><button class="btn-search" onclick="renderTable()">搜索</button></div></div>
                <div class="field"><label>搜岗位</label><div style="display:flex;gap:5px"><input type="text" id="sJ" class="search-input" style="flex:1;padding:10px;border-radius:10px;border:1px solid #ddd;"><button class="btn-search" onclick="renderTable()">搜索</button></div></div>
            </div>
        </div>
        <div style="overflow-x:auto;">
            <table style="width:100%; border-collapse:collapse; min-width:1400px;">
                <thead><tr style="background:rgba(0,0,0,0.02);"><th style="padding:15px; text-align:left; font-size:12px; color:#8e8e93;">姓名</th><th style="text-align:left; font-size:12px; color:#8e8e93;">状态</th><th style="text-align:left; font-size:12px; color:#8e8e93;">推荐客户/岗位</th><th style="text-align:left; font-size:12px; color:#8e8e93;">年龄/出生年</th><th style="text-align:left; font-size:12px; color:#8e8e93;">资历/学历</th><th style="text-align:left; font-size:12px; color:#8e8e93;">操作</th></tr></thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>
</div>

<div class="dock" id="dock" style="display:none">
    <button class="dock-btn btn-blue" onclick="saveData()">✅ 存入空间</button>
    <button class="dock-btn" style="background:#34C759; color:white;" onclick="exportExcel()">📊 导出 Excel</button>
    <button class="dock-btn" style="background:#E5E5EA;" onclick="location.reload()">🔒 退出</button>
</div>

<script>
    let dbKey = ""; let candidates = []; let treeData = {}; let charts = {};
    const curY = new Date().getFullYear();

    function login() {
        const p = document.getElementById('sysPass').value; if(!p) return;
        dbKey = "FLY_YUN_MASTER_" + btoa(p);
        document.getElementById('loginOverlay').style.opacity = '0';
        setTimeout(() => {
            document.getElementById('loginOverlay').style.display='none';
            document.getElementById('app').style.display='block';
            document.getElementById('dock').style.display='flex';
            document.getElementById('userDisplay').innerText = "当前空间密钥: " + p;
            init();
        }, 500);
    }

    function init() {
        let y6 = '<option value="">年份</option>'; for(let i=1960; i<=2022; i++) y6 += `<option value="${i}">${i}</option>`; document.getElementById('f6').innerHTML = y6;
        let y14 = '<option value="">入学年</option>'; for(let i=1900; i<=2024; i++) y14 += `<option value="${i}">${i}</option>`; document.getElementById('f14').innerHTML = y14;
        candidates = JSON.parse(localStorage.getItem(dbKey) || "[]");
        treeData = JSON.parse(localStorage.getItem(dbKey + "_tree") || "{}");
        refreshMgmt(); renderTable(); updateCharts();
    }

    // --- 新增：雷达搜索逻辑 ---
    function radarGo(platform) {
        const kw = document.getElementById('radarSearch').value;
        if(!kw) return alert("请输入搜索关键词");
        let url = "";
        if(platform === 'boss') url = `https://www.google.com/search?q=site:zhipin.com ${kw}`;
        if(platform === 'liepin') url = `https://www.liepin.com/zhaopin/?key=${kw}`;
        if(platform === 'google') url = `https://www.google.com/search?q=("简历" OR "resume" OR "CV") ${kw} -inurl:jobs`;
        window.open(url, '_blank');
    }

    // --- 管理逻辑 ---
    function addC() { const v = document.getElementById('newC').value.trim(); if(v && !treeData[v]) { treeData[v] = []; saveT(); document.getElementById('newC').value = ""; refreshMgmt(); } }
    function addJ() { const c = document.getElementById('selC').value; const j = document.getElementById('newJ').value.trim(); if(c && j && !treeData[c].includes(j)) { treeData[c].push(j); saveT(); document.getElementById('newJ').value = ""; refreshMgmt(); } }
    function saveT() { localStorage.setItem(dbKey + "_tree", JSON.stringify(treeData)); }
    function refreshMgmt() {
        document.getElementById('tree').innerHTML = Object.keys(treeData).map(c => `
