<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FLY YUN - 智能寻访空间</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --ios-accent: #007AFF;
            --ios-bg: #F2F2F7;
            --ios-card-pure: #FFFFFF;
            --ios-card-glass: rgba(255, 255, 255, 0.7);
            --radius-max: 30px;
            --ios-red: #FF3B30;
            --admin-purple: #AF52DE;
            --text-main: #1D1D1F;
            --text-sub: #86868B;
        }

        body, html {
            margin: 0; padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", sans-serif;
            background: var(--ios-bg);
            color: var(--text-main);
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* --- 苹果风格：极光浅渐变背景 (Aurora Light) --- */
        .apple-bg {
            position: fixed; inset: 0;
            background: linear-gradient(135deg, #f5f7fa 0%, #ffffff 100%);
            z-index: -1;
            overflow: hidden;
        }
        .bg-blob {
            position: absolute; border-radius: 50%;
            filter: blur(100px); opacity: 0.4;
            animation: breathe 15s infinite alternate ease-in-out;
        }
        .blob-1 { width: 600px; height: 600px; background: #d2e3fc; top: -100px; left: -100px; }
        .blob-2 { width: 500px; height: 500px; background: #fce4ec; bottom: -50px; right: -50px; animation-delay: -5s; }
        
        @keyframes breathe {
            from { transform: translate(0,0) scale(1); }
            to { transform: translate(50px, 30px) scale(1.05); }
        }

        /* --- 首页：登录卡片 --- */
        #loginOverlay {
            position: fixed; inset: 0; display: flex; justify-content: center; align-items: center;
            z-index: 10000; background: rgba(255, 255, 255, 0.3); backdrop-filter: blur(40px) saturate(180%);
            transition: all 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .login-card {
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(255, 255, 255, 1);
            border-radius: 45px; padding: 60px 40px; width: 85%; max-width: 380px;
            text-align: center; box-shadow: 0 25px 60px rgba(0,0,0,0.03);
        }
        .login-card h1 { font-size: 38px; font-weight: 800; margin: 0; letter-spacing: -2px; }
        .login-card p { font-size: 15px; color: var(--text-sub); margin: 15px 0 40px; }

        /* --- 全新按钮样式 (Apple Modern Style) --- */
        .btn-modern {
            background: linear-gradient(180deg, #007AFF 0%, #0066D6 100%);
            color: white; border: none; border-radius: 14px;
            font-weight: 600; cursor: pointer; transition: all 0.3s;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 12px rgba(0, 122, 255, 0.2);
            font-size: 14px;
        }
        .btn-modern:hover { transform: translateY(-1px); box-shadow: 0 6px 15px rgba(0, 122, 255, 0.3); filter: brightness(1.05); }
        .btn-modern:active { transform: scale(0.96); filter: brightness(0.95); }

        .btn-full { width: 100%; padding: 18px; border-radius: 20px; font-size: 16px; margin-top: 20px; }

        .ios-input {
            width: 100%; padding: 18px; border-radius: 18px; border: 1px solid #E5E5EA;
            background: #FFFFFF; font-size: 17px; font-weight: 600;
            text-align: center; outline: none; transition: 0.3s; box-sizing: border-box;
        }

        /* --- 主界面布局 --- */
        .app-shell { max-width: 1400px; margin: 0 auto; padding: 30px 20px 140px; display: none; }
        .ios-card {
            background: var(--ios-card-glass); backdrop-filter: blur(30px);
            border-radius: var(--radius-max); padding: 25px; margin-bottom: 25px;
            border: 1px solid #FFFFFF; box-shadow: 0 10px 40px rgba(0,0,0,0.02);
        }

        /* 看板设计 */
        .dashboard-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 25px; }
        @media (max-width: 1024px) { .dashboard-grid { grid-template-columns: 1fr; } }
        .chart-box { height: 260px; text-align: center; }

        /* Mapping联动区 */
        .mgmt-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .mgmt-input-group { display: flex; gap: 10px; align-items: center; }
        .mgmt-input-group select, .mgmt-input-group input { 
            flex: 1; padding: 12px 15px; border-radius: 12px; border: 1px solid #e5e5ea; background: #fff; outline: none;
        }

        /* 搜索功能区 */
        .search-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 25px; }
        .search-field { display: flex; flex-direction: column; gap: 8px; }
        .search-field label { font-size: 11px; font-weight: 700; color: var(--text-sub); margin-left: 10px; }

        /* 表格 */
        .ios-table { width: 100%; border-collapse: collapse; min-width: 1300px; }
        .ios-table th { text-align: left; padding: 15px; font-size: 12px; color: var(--text-sub); border-bottom: 1px solid #F2F2F7; }
        .ios-table td { padding: 18px 15px; font-size: 14px; border-bottom: 1px solid #F2F2F7; }

        /* 底部 Dock */
        .dock {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(35px);
            padding: 12px 25px; border-radius: 35px; display: flex; gap: 15px;
            border: 1px solid #FFFFFF; box-shadow: 0 15px 45px rgba(0,0,0,0.08); z-index: 999;
        }
        .badge { padding: 4px 10px; border-radius: 8px; font-size: 11px; font-weight: 700; }
        .badge-合适 { background: #E8F5E9; color: #2E7D32; }
        .badge-不合适 { background: #FFEBEE; color: #C62828; }
        .calc-sub { font-size: 11px; color: var(--ios-accent); font-weight: 700; display: block; margin-top: 2px; }
    </style>
</head>
<body>

<div class="apple-bg">
    <div class="bg-blob blob-1"></div>
    <div class="bg-blob blob-2"></div>
</div>

<div id="loginOverlay">
    <div class="login-card">
        <h1>FLY YUN</h1>
        <p>生成并解锁您的私有寻访空间</p>
        <input type="password" id="sysPass" class="ios-input" placeholder="访问密码" onkeydown="if(event.keyCode==13) handleLogin()">
        <button class="btn-modern btn-full" onclick="handleLogin()">解锁 / 进入空间</button>
        <div style="margin-top:25px; font-size:12px; color:var(--ios-accent); cursor:pointer; opacity:0.6;" onclick="toggleAdmin()">超级管理中心</div>
    </div>
</div>

<div class="app-shell" id="app">
    <header style="margin-bottom: 40px; display:flex; justify-content:space-between; align-items:flex-end;">
        <div>
            <h2 style="font-size: 34px; font-weight: 900; letter-spacing: -2px; margin: 0;">FLY YUN</h2>
            <div id="userDisplay" style="color: var(--text-sub); font-size: 13px; margin-top: 5px;"></div>
        </div>
    </header>

    <div class="dashboard-grid">
        <div class="ios-card chart-box">
            <div style="font-size:14px; font-weight:700; margin-bottom:15px;">寻访状态分布</div>
            <canvas id="chartStatus"></canvas>
        </div>
        <div class="ios-card chart-box">
            <div style="font-size:14px; font-weight:700; margin-bottom:15px;">学历画像分布</div>
            <canvas id="chartEdu"></canvas>
        </div>
        <div class="ios-card chart-box">
            <div style="font-size:14px; font-weight:700; margin-bottom:15px;">项目人才储备</div>
            <canvas id="chartJob"></canvas>
        </div>
    </div>

    <div class="ios-card">
        <div class="mgmt-row">
            <div>
                <div style="font-weight: 700; margin-bottom: 12px; font-size: 14px;">🏢 客户管理</div>
                <div class="mgmt-input-group">
                    <input type="text" id="newComp" placeholder="新客户名称...">
                    <button class="btn-modern" style="padding: 10px 20px;" onclick="addComp()">添加</button>
                </div>
            </div>
            <div>
                <div style="font-weight: 700; margin-bottom: 12px; font-size: 14px;">💼 岗位管理</div>
                <div class="mgmt-input-group">
                    <select id="compSelect"><option value="">选择客户</option></select>
                    <input type="text" id="newJob" placeholder="岗位名称...">
                    <button class="btn-modern" style="padding: 10px 20px;" onclick="addJob()">添加</button>
                </div>
            </div>
        </div>
        <div id="treeDisplay" style="margin-top:20px;"></div>
    </div>

    <div class="ios-card">
        <div style="font-weight: 700; margin-bottom: 20px; font-size: 15px;">📝 候选人详情录入 (16环节)</div>
        <div class="form-grid" id="formEntry">
            <div class="field"><label>1. 推荐客户</label><select id="f1" onchange="filterJobs()"></select></div>
            <div class="field"><label>2. 推荐岗位</label><select id="f2"></select></div>
            <div class="field"><label>3. 姓名</label><input type="text" id="f3"></div>
            <div class="field"><label>4. 性别</label><select id="f4"><option>男</option><option>女</option></select></div>
            <div class="field"><label>5. 状态</label><select id="f5"><option>正在联系中</option><option>合适</option><option>不合适</option></select></div>
            <div class="field"><label>6. 出生年份</label><select id="f6"></select></div>
            <div class="field"><label>7. 岗位产品</label><input type="text" id="f7"></div>
            <div class="field"><label>8. 目前所在地</label><input type="text" id="f8"></div>
            <div class="field"><label>9. 期望所在地</label><input type="text" id="f9"></div>
            <div class="field"><label>10. 现公司</label><input type="text" id="f10"></div>
            <div class="field"><label>11. 电话/微信</label><input type="text" id="f11"></div>
            <div class="field"><label>12. 邮箱</label><input type="text" id="f12"></div>
            <div class="field"><label>13. 学历</label><select id="f13"><option>大专</option><option>本科</option><option>研究生</option><option>博士</option></select></div>
            <div class="field"><label>14. 入学年份</label><select id="f14"></select></div>
            <div class="field"><label>15. 学校</label><input type="text" id="f15"></div>
            <div class="field"><label>16. 备注</label><input type="text" id="f16"></div>
        </div>
    </div>

    <div class="ios-card" style="padding:0; overflow:hidden;">
        <div style="padding:25px 25px 0 25px;">
            <div style="font-weight: 700; margin-bottom: 15px;">🔍 名单多维检索</div>
            <div class="search-row">
                <div class="search-field"><label>人选姓名</label><div class="mgmt-input-group"><input type="text" id="sName"><button class="btn-modern" onclick="doSearch()">搜索</button></div></div>
                <div class="search-field"><label>所属客户</label><div class="mgmt-input-group"><input type="text" id="sComp"><button class="btn-modern" onclick="doSearch()">搜索</button></div></div>
                <div class="search-field"><label>寻访岗位</label><div class="mgmt-input-group"><input type="text" id="sJob"><button class="btn-modern" onclick="doSearch()">搜索</button></div></div>
            </div>
        </div>
        <div style="overflow-x:auto;">
            <table class="ios-table">
                <thead>
                    <tr><th>姓名</th><th>状态</th><th>客户/岗位</th><th>年龄</th><th>资历</th><th>现公司</th><th>操作</th></tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>
</div>

<div class="dock" id="userDock" style="display:none">
    <button class="dock-btn btn-modern" style="padding: 12px 30px;" onclick="saveData()">✅ 存入空间</button>
    <button class="dock-btn btn-green" onclick="exportXLS()">📊 导出 Excel</button>
    <button class="dock-btn" style="background:#E5E5EA; color:#000" onclick="location.reload()">🔒 退出</button>
</div>

<script>
    let dbKey = ""; let data = []; let tree = {}; let charts = {};
    const curY = new Date().getFullYear();
    const MASTER_HASH = "8c6976e5b5410415bde908bd4dee15dfb167a9c873fc4bb8a81f6f2ab448a918"; // FLY999
    let isAdminMode = false;

    async function hash(str) {
        const utf8 = new TextEncoder().encode(str);
        const hashBuffer = await crypto.subtle.digest('SHA-256', utf8);
        return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    function toggleAdmin() {
        isAdminMode = !isAdminMode;
        document.getElementById('mainTitle').innerText = isAdminMode ? "ADMIN 后台" : "FLY YUN";
        document.getElementById('mainSub').innerText = isAdminMode ? "请输入超级管理员指纹" : "生成并解锁您的私有寻访空间";
    }

    async function handleLogin() {
        const p = document.getElementById('sysPass').value;
        if(!p) return;
        if(isAdminMode) {
            const h = await hash(p);
            if(h === MASTER_HASH) { alert("后台模块集成中，逻辑同前"); location.reload(); }
            else alert("指纹错误");
        } else {
            dbKey = "FLY_V13_" + btoa(p);
            document.getElementById('loginOverlay').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('loginOverlay').style.display='none';
                document.getElementById('app').style.display='block';
                document.getElementById('userDock').style.display='flex';
                document.getElementById('userDisplay').innerText = "Security Area: " + p;
                initApp();
            }, 600);
        }
    }

    function initApp() {
        let y6 = ''; for(let i=1960; i<=2022; i++) y6 += `<option value="${i}">${i}</option>`;
        document.getElementById('f6').innerHTML = '<option value="">年份</option>' + y6;
        let y14 = ''; for(let i=1900; i<=2024; i++) y14 += `<option value="${i}">${i}</option>`;
        document.getElementById('f14').innerHTML = '<option value="">入学年</option>' + y14;
        data = JSON.parse(localStorage.getItem(dbKey) || "[]");
        tree = JSON.parse(localStorage.getItem(dbKey+"_t") || "{}");
        refreshMgmt(); render(); updateCharts();
    }

    function addComp() { const v = document.getElementById('newComp').value.trim(); if(v && !tree[v]) { tree[v] = []; saveT(); document.getElementById('newComp').value = ""; refreshMgmt(); } }
    function addJob() { const c = document.getElementById('compSelect').value; const j = document.getElementById('newJob').value.trim(); if(c && j && !tree[c].includes(j)) { tree[c].push(j); saveT(); document.getElementById('newJob').value = ""; refreshMgmt(); } }
    function saveT() { localStorage.setItem(dbKey+"_t", JSON.stringify(tree)); }
    function refreshMgmt() {
        document.getElementById('treeDisplay').innerHTML = Object.keys(tree).map(c => `<div class="ios-card" style="margin-bottom:10px; padding:15px; background:rgba(0,0,0,0.02); border:none"><b>${c}</b><div>${tree[c].map(j => `<span class="badge" style="background:#fff; margin-right:5px; margin-top:5px; border:1px solid #eee">${j}</span>`).join('')}</div></div>`).join('');
        const opt = '<option value="">-- 选择客户 --</option>' + Object.keys(tree).map(c => `<option value="${c}">${c}</option>`).join('');
        document.getElementById('compSelect').innerHTML = opt; document.getElementById('f1').innerHTML = opt;
    }
    function filterJobs() { const c = document.getElementById('f1').value; document.getElementById('f2').innerHTML = (c && tree[c]) ? '<option value="">-- 选择岗位 --</option>' + tree[c].map(j => `<option value="${j}">${j}</option>`).join('') : '<option value="">先选客户</option>'; }

    function doSearch() { render(); }
    function saveData() { 
        const r = { id: Date.now() }; for(let i=1; i<=16; i++) r['f'+i] = document.getElementById('f'+i).value;
        data.push(r); localStorage.setItem(dbKey, JSON.stringify(data)); render(); updateCharts(); alert("存入成功");
    }

    function render() {
        const n = document.getElementById('sName').value.toLowerCase();
        const f = data.filter(i => i.f3.toLowerCase().includes(n));
        document.getElementById('tableBody').innerHTML = f.map(i => {
            const age = i.f6 ? (curY - parseInt(i.f6)) : "-";
            const exp = i.f14 ? (curY - parseInt(i.f14)) : "-";
            return `<tr><td><b>${i.f3}</b></td><td><span class="badge badge-${i.f5}">${i.f5}</span></td><td><b>${i.f1}</b><br><small>${i.f2}</small></td><td>${age}岁</td><td>资历${exp}年</td><td>${i.f10}</td><td><button style="color:red; border:none; background:none; cursor:pointer" onclick="del(${i.id})">移除</button></td></tr>`;
        }).join('');
    }

    function del(id) { if(confirm("删除？")) { data = data.filter(x => x.id !== id); localStorage.setItem(dbKey, JSON.stringify(data)); render(); updateCharts(); } }

    function updateCharts() {
        const s = {'合适':0,'不合适':0,'正在联系中':0}, e = {'大专':0,'本科':0,'研究生':0,'博士':0}, jb = {};
        data.forEach(i => { s[i.f5]++; e[i.f13]++; jb[i.f1] = (jb[i.f1] || 0) + 1; });
        draw('chartStatus', 'doughnut', Object.keys(s), Object.values(s), ['#34C759','#FF3B30','#FF9500'], true);
        draw('chartEdu', 'bar', Object.keys(e), Object.values(e), '#007AFF', false);
        draw('chartJob', 'bar', Object.keys(jb), Object.values(jb), '#AF52DE', false);
    }
    function draw(id, type, labels, data, colors, isD) {
        if(charts[id]) charts[id].destroy();
        charts[id] = new Chart(document.getElementById(id), {
            type: type, data: { labels, datasets: [{ data, backgroundColor: colors, borderRadius: 8 }] },
            options: { maintainAspectRatio:false, cutout: isD?'75%':0, plugins:{ legend:{ display:isD, position:'bottom', labels:{boxWidth:8, font:{size:10}}} }, scales:{ y:{ display:!isD, beginAtZero:true}, x:{display:!isD}} }
        });
    }
</script>
</body>
</html>
