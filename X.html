<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FLY YUN - 智能寻访空间</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --ios-accent: #007AFF;
            --ios-bg: #F2F2F7;
            --glass: rgba(255, 255, 255, 0.45);
            --radius-max: 35px;
            --ios-red: #FF3B30;
            --admin-purple: #AF52DE;
        }

        body, html {
            margin: 0; padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", sans-serif;
            background: #F2F2F7;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* --- iOS 26 流光背景 --- */
        .liquid-bg { position: fixed; inset: 0; background: linear-gradient(120deg, #c3dafe 0%, #fdfbfb 100%); z-index: -1; }
        .liquid-bg::after { content: ""; position: absolute; width: 200%; height: 200%; top: -50%; left: -50%; background: radial-gradient(circle, rgba(0,122,255,0.12) 0%, rgba(255,255,255,0) 50%); animation: drift 20s infinite alternate ease-in-out; }
        @keyframes drift { from { transform: rotate(0deg); } to { transform: rotate(15deg); } }

        /* --- 首页：登录 UI --- */
        #loginOverlay { position: fixed; inset: 0; display: flex; justify-content: center; align-items: center; z-index: 10000; background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(30px); transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1); }
        .spatial-card { background: rgba(255, 255, 255, 0.3); backdrop-filter: blur(50px) saturate(200%); border: 1px solid rgba(255, 255, 255, 0.4); border-radius: 50px; padding: 60px 40px; width: 85%; max-width: 380px; text-align: center; box-shadow: 0 40px 100px rgba(0,0,0,0.08); }
        .spatial-card h1 { font-size: 42px; font-weight: 900; margin: 0; letter-spacing: -2px; color: #1d1d1f; }
        .ios-26-input { width: 100%; padding: 22px; border-radius: 25px; border: none; background: rgba(255, 255, 255, 0.6); font-size: 18px; font-weight: 600; text-align: center; outline: none; transition: 0.3s; box-sizing: border-box; }
        .ios-26-btn { width: 100%; padding: 20px; border-radius: 25px; border: none; background: #1d1d1f; color: white; font-size: 17px; font-weight: 700; cursor: pointer; transition: 0.3s; margin-top: 25px; }
        .admin-link { margin-top: 25px; font-size: 12px; color: var(--ios-accent); cursor: pointer; opacity: 0.6; }

        /* --- 主界面布局 --- */
        .app-shell { max-width: 1300px; margin: 0 auto; padding: 20px; display: none; padding-bottom: 120px; }
        .ios-card { background: rgba(255, 255, 255, 0.6); backdrop-filter: blur(20px); border-radius: var(--radius-max); padding: 25px; margin-bottom: 25px; border: 1px solid rgba(255,255,255,0.5); box-shadow: 0 10px 40px rgba(0,0,0,0.02); }

        /* --- 超级后台管理面板 --- */
        #adminPanel { max-width: 1000px; margin: 40px auto; padding: 20px; display: none; }
        .admin-table { width: 100%; border-collapse: collapse; background: white; border-radius: 20px; overflow: hidden; }
        .admin-table th, .admin-table td { padding: 15px; text-align: left; border-bottom: 1px solid #f2f2f7; }
        .admin-table th { background: var(--admin-purple); color: white; font-size: 12px; }

        /* 搜索框设计 */
        .search-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 20px; }
        .search-field { display: flex; flex-direction: column; gap: 5px; }
        .search-field label { font-size: 11px; font-weight: 700; color: #8E8E93; margin-left: 10px; }
        .search-action-group { display: flex; gap: 8px; }
        .search-input { flex: 1; padding: 12px 15px; border-radius: 15px; border: 1px solid rgba(0,0,0,0.08); background: rgba(255,255,255,0.7); outline: none; font-size: 14px; }
        .btn-search { background: var(--ios-accent); color: white; border: none; border-radius: 12px; padding: 0 15px; font-weight: 600; cursor: pointer; transition: 0.2s; }

        /* 两级管理 & 表格 */
        .form-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; }
        .field { display: flex; flex-direction: column; }
        .field label { font-size: 11px; font-weight: 700; color: #8E8E93; margin-bottom: 5px; margin-left: 10px; }
        .field input, .field select { padding: 14px; border-radius: 15px; border: 1px solid rgba(0,0,0,0.08); background: white; font-size: 16px; outline: none; }
        .calc-info { display: block; font-size: 11px; color: var(--ios-accent); font-weight: 700; margin-top: 3px; }
        .tree-node { margin-bottom: 15px; padding: 10px; background: rgba(0,0,0,0.02); border-radius: 15px; }
        .comp-header { display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 5px; }
        .job-tag { display: inline-block; background: white; padding: 5px 10px; border-radius: 8px; margin: 3px; font-size: 12px; }
