<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FLY YUN - 智能寻访空间</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --ios-accent: #007AFF;
            --ios-bg: #F2F2F7;
            --glass: rgba(255, 255, 255, 0.45);
            --radius-max: 35px;
            --ios-red: #FF3B30;
        }

        body, html {
            margin: 0; padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", sans-serif;
            background: #F2F2F7;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* --- iOS 26 流光背景 --- */
        .liquid-bg {
            position: fixed; inset: 0;
            background: linear-gradient(120deg, #c3dafe 0%, #fdfbfb 100%);
            z-index: -1;
        }
        .liquid-bg::after {
            content: ""; position: absolute; width: 200%; height: 200%; top: -50%; left: -50%;
            background: radial-gradient(circle, rgba(0,122,255,0.12) 0%, rgba(255,255,255,0) 50%);
            animation: drift 20s infinite alternate ease-in-out;
        }
        @keyframes drift { from { transform: rotate(0deg); } to { transform: rotate(15deg); } }

        /* --- 首页：中文空间登录 UI --- */
        #loginOverlay {
            position: fixed; inset: 0; display: flex; justify-content: center; align-items: center;
            z-index: 10000; background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(30px);
            transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .spatial-card {
            background: rgba(255, 255, 255, 0.3); backdrop-filter: blur(50px) saturate(200%);
            border: 1px solid rgba(255, 255, 255, 0.4); border-radius: 50px;
            padding: 60px 40px; width: 85%; max-width: 380px; text-align: center;
            box-shadow: 0 40px 100px rgba(0,0,0,0.08);
        }
        .spatial-card h1 { font-size: 42px; font-weight: 900; margin: 0; letter-spacing: -2px; color: #1d1d1f; }
        .spatial-card p { font-size: 15px; color: #6e6e73; margin: 15px 0 35px; font-weight: 500; }

        .ios-26-input {
            width: 100%; padding: 22px; border-radius: 25px; border: none;
            background: rgba(255, 255, 255, 0.6); box-shadow: inset 0 2px 10px rgba(0,0,0,0.05);
            font-size: 20px; font-weight: 600; text-align: center; outline: none; transition: 0.3s; box-sizing: border-box;
            letter-spacing: 2px;
        }
        .ios-26-input:focus { background: white; transform: scale(1.02); }

        .ios-26-btn {
            width: 100%; padding: 20px; border-radius: 25px; border: none; background: #1d1d1f; color: white;
            font-size: 17px; font-weight: 700; cursor: pointer; transition: 0.3s; margin-top: 25px;
        }

        /* --- 主界面布局 --- */
        .app-shell { max-width: 1300px; margin: 0 auto; padding: 20px; display: none; padding-bottom: 120px; }
        .ios-card {
            background: rgba(255, 255, 255, 0.6); backdrop-filter: blur(20px);
            border-radius: var(--radius-max); padding: 25px; margin-bottom: 25px;
            border: 1px solid rgba(255,255,255,0.5); box-shadow: 0 10px 40px rgba(0,0,0,0.02);
        }

        /* 顶部看板 */
        .dashboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 25px; }
        @media (max-width: 900px) { .dashboard { grid-template-columns: 1fr; } }
        .chart-container { height: 220px; position: relative; }

        /* 两级联动管理 */
        .mgmt-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media (max-width: 768px) { .mgmt-grid { grid-template-columns: 1fr; } }
        .tree-node { background: rgba(0,0,0,0.03); border-radius: 20px; padding: 15px; margin-bottom: 15px; }
        .comp-header { display: flex; justify-content: space-between; align-items: center; font-weight: 800; font-size: 15px; margin-bottom: 10px; }
        .job-tag {
            display: inline-flex; align-items: center; background: white; padding: 6px 12px;
            border-radius: 10px; font-size: 12px; font-weight: 600; margin: 4px; box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .del-x { color: var(--ios-red); cursor: pointer; margin-left: 8px; font-weight: 900; }

        /* 表单 */
        .form-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; }
        @media (max-width: 768px) { .form-grid { grid-template-columns: 1fr; } }
        .field { display: flex; flex-direction: column; }
        .field label { font-size: 11px; font-weight: 700; color: #8E8E93; margin-bottom: 5px; margin-left: 10px; }
        .field input, .field select { padding: 14px; border-radius: 15px; border: 1px solid rgba(0,0,0,0.08); background: white; font-size: 16px; outline: none; }

        /* 底部 Dock */
        .dock {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: rgba(255,255,255,0.75); backdrop-filter: blur(35px);
            padding: 12px 25px; border-radius: 35px; display: flex; gap: 15px;
            border: 1px solid rgba(255,255,255,0.5); box-shadow: 0 20px 50px rgba(0,0,0,0.1); z-index: 999;
        }
        .dock-btn { border: none; padding: 14px 25px; border-radius: 20px; font-weight: 700; font-size: 14px; cursor: pointer; transition: 0.2s; }
        .btn-blue { background: #007AFF; color: white; }

        .badge { padding: 4px 10px; border-radius: 8px; font-size: 11px; font-weight: 700; }
        .badge-合适 { background: #D2F9D8; color: #1E6726; }
        .badge-不合适 { background: #FFE5E5; color: #D32F2F; }
        .badge-正在联系中 { background: #FFF4D2; color: #8A6D1F; }
    </style>
</head>
<body>

<div class="liquid-bg"></div>

<div id="loginOverlay">
    <div class="spatial-card">
        <h1>FLY YUN</h1>
        <p>生成您自己的存储空间<br><span style="font-size: 12px; opacity: 0.7;">输入密码后系统将自动为您创建加密空间</span></p>
        <input type="password" id="sysPass" class="ios-26-input" placeholder="输入您的访问密码" onkeydown="if(event.keyCode==13) login()">
        <button class="ios-26-btn" onclick="login()">解锁 / 创建空间</button>
        <div style="margin-top: 25px; font-size: 11px; color: #8e8e93;">
            不同密码对应独立存储空间，数据保存在本地浏览器
        </div>
    </div>
</div>

<div class="app-shell" id="app">
    <header style="margin-bottom: 40px; padding: 0 10px;">
        <h2 style="font-size: 34px; font-weight: 900; letter-spacing: -2px; margin: 0;">FLY YUN</h2>
        <div id="userDisplay" style="color: #8E8E93; font-weight: 500; margin-top: 5px; font-size: 13px;"></div>
    </header>

    <div class="dashboard">
        <div class="ios-card">
            <div style="font-size: 14px; font-weight: 700; margin-bottom: 10px;">人才状态分布</div>
            <div class="chart-container"><canvas id="chartStatus"></canvas></div>
        </div>
        <div class="ios-card">
            <div style="font-size: 14px; font-weight: 700; margin-bottom: 10px;">学历画像</div>
            <div class="chart-container"><canvas id="chartEdu"></canvas></div>
        </div>
        <div class="ios-card">
            <div style="font-size: 14px; font-weight: 700; margin-bottom: 10px;">项目储备统计</div>
            <div class="chart-container"><canvas id="chartJob"></canvas></div>
        </div>
    </div>

    <div class="ios-card">
        <div class="mgmt-grid">
            <div>
                <div style="font-size: 15px; font-weight: 700; margin-bottom: 15px;">🏢 1. 添加客户公司</div>
                <div style="display:flex; gap:10px;">
                    <input type="text" id="newComp" style="flex:1; padding:12px; border-radius:12px; border:1px solid rgba(0,0,0,0.1);" placeholder="例如：谷歌中国">
                    <button class="btn-blue" style="border:none; padding:10px 20px; border-radius:12px; font-weight:600; cursor:pointer;" onclick="addComp()">添加</button>
                </div>
            </div>
            <div>
                <div style="font-size: 15px; font-weight: 700; margin-bottom: 15px;">💼 2. 为公司添加岗位</div>
                <div style="display:flex; gap:10px;">
                    <select id="compSelect" style="flex:1; padding:12px; border-radius:12px; border:1px solid rgba(0,0,0,0.1);"><option value="">选择公司</option></select>
                    <input type="text" id="newJob" style="flex:1; padding:12px; border-radius:12px; border:1px solid rgba(0,0,0,0.1);" placeholder="岗位：前端专家">
                    <button class="btn-blue" style="border:none; padding:10px 20px; border-radius:12px; font-weight:600; cursor:pointer;" onclick="addJob()">添加</button>
                </div>
            </div>
        </div>
        <div id="treeDisplay" style="margin-top:25px;"></div>
    </div>

    <div class="ios-card">
        <div style="font-size: 15px; font-weight: 700; margin-bottom: 20px;">📝 寻访记录录入</div>
        <div class="form-grid">
            <div class="field"><label>1. 推荐公司 (客户)</label><select id="f1" onchange="filterJobs()"></select></div>
            <div class="field"><label>2. 推荐岗位名称</label><select id="f2"></select></div>
            <div class="field"><label>3. 姓名</label><input type="text" id="f3"></div>
            <div class="field"><label>4. 性别</label><select id="f4"><option value="男">男</option><option value="女">女</option></select></div>
            <div class="field"><label>5. 状态</label><select id="f5"><option value="正在联系中">正在联系中</option><option value="合适">合适</option><option value="不合适">不合适</option></select></div>
            <div class="field"><label>6. 出生年份</label><select id="f6"></select></div>
            <div class="field"><label>7. 岗位产品</label><input type="text" id="f7"></div>
            <div class="field"><label>8. 目前所在地</label><input type="text" id="f8"></div>
            <div class="field"><label>9. 期望所在地</label><input type="text" id="f9"></div>
            <div class="field"><label>10. 现公司</label><input type="text" id="f10"></div>
            <div class="field"><label>11. 电话/微信号</label><input type="text" id="f11"></div>
            <div class="field"><label>12. 邮箱</label><input type="text" id="f12"></div>
            <div class="field"><label>13. 学历</label><select id="f13"><option value="大专">大专</option><option value="本科">本科</option><option value="研究生">研究生</option><option value="博士">博士</option></select></div>
            <div class="field"><label>14. 入学年份</label><input type="text" id="f14"></div>
            <div class="field"><label>15. 学校</label><input type="text" id="f15"></div>
            <div class="field"><label>16. 备注</label><input type="text" id="f16"></div>
        </div>
    </div>

    <div class="ios-card" style="padding:0; overflow:hidden;">
        <div style="overflow-x:auto;">
            <table style="width:100%; border-collapse:collapse; min-width:1400px;">
                <thead>
                    <tr style="background:rgba(0,0,0,0.02);">
                        <th style="padding:20px; text-align:left; font-size:12px; color:#8e8e93;">姓名</th>
                        <th style="text-align:left; font-size:12px; color:#8e8e93;">状态</th>
                        <th style="text-align:left; font-size:12px; color:#8e8e93;">所属客户</th>
                        <th style="text-align:left; font-size:12px; color:#8e8e93;">岗位</th>
                        <th style="text-align:left; font-size:12px; color:#8e8e93;">所在地</th>
                        <th style="text-align:left; font-size:12px; color:#8e8e93;">学历</th>
                        <th style="text-align:left; font-size:12px; color:#8e8e93;">管理</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>
</div>

<div class="dock" id="dock" style="display:none">
    <button class="dock-btn btn-blue" onclick="saveCandidate()">✅ 存入空间</button>
    <button class="dock-btn" style="background:#34C759; color:white;" onclick="exportExcel()">📊 导出 Excel</button>
    <button class="dock-btn" style="background:#E5E5EA;" onclick="location.reload()">🔒 退出空间</button>
</div>

<script>
    let dbKey = ""; let candidates = []; let treeData = {}; let charts = {};

    function login() {
        const p = document.getElementById('sysPass').value;
        if(!p) return;
        dbKey = "FLY_YUN_SPATIAL_V8_" + btoa(p);
        document.getElementById('loginOverlay').style.opacity = '0';
        setTimeout(() => {
            document.getElementById('loginOverlay').style.display = 'none';
            document.getElementById('app').style.display = 'block';
            document.getElementById('dock').style.display = 'flex';
            document.getElementById('userDisplay').innerText = "当前存储空间: " + p;
            init();
        }, 600);
    }

    function init() {
        // 出生年 1960-2022
        let y = '<option value="">年份</option>';
        for(let i=1960; i<=2022; i++) y += `<option value="${i}">${i}年</option>`;
        document.getElementById('f6').innerHTML = y;

        candidates = JSON.parse(localStorage.getItem(dbKey) || "[]");
        treeData = JSON.parse(localStorage.getItem(dbKey + "_tree") || "{}");
        
        refreshManagementUI(); renderTable(); updateCharts();
    }

    // --- 联动管理 ---
    function addComp() {
        const c = document.getElementById('newComp').value.trim();
        if(c && !treeData[c]) { treeData[c] = []; saveTree(); document.getElementById('newComp').value = ""; refreshManagementUI(); }
    }
    function addJob() {
        const c = document.getElementById('compSelect').value;
        const j = document.getElementById('newJob').value.trim();
        if(c && j && !treeData[c].includes(j)) { treeData[c].push(j); saveTree(); document.getElementById('newJob').value = ""; refreshManagementUI(); }
    }
    function saveTree() { localStorage.setItem(dbKey + "_tree", JSON.stringify(treeData)); }
    function removeComp(c) { if(confirm(`移除客户“${c}”？`)) { delete treeData[c]; saveTree(); refreshManagementUI(); } }
    function removeJobFromTree(c, j) { treeData[c] = treeData[c].filter(item => item !== j); saveTree(); refreshManagementUI(); }

    function refreshManagementUI() {
        const container = document.getElementById('treeDisplay');
        const compSelect = document.getElementById('compSelect');
        const f1 = document.getElementById('f1');
        
        container.innerHTML = Object.keys(treeData).map(c => `
            <div class="tree-node">
                <div class="comp-header">${c} <span class="del-x" onclick="removeComp('${c}')">移除</span></div>
                <div style="display:flex; flex-wrap:wrap;">
                    ${treeData[c].map(j => `<div class="job-tag">${j}<span class="del-x" onclick="removeJobFromTree('${c}','${j}')">×</span></div>`).join('')}
                </div>
            </div>
        `).join('');

        const options = '<option value="">-- 选择客户 --</option>' + Object.keys(treeData).map(c => `<option value="${c}">${c}</option>`).join('');
        compSelect.innerHTML = options;
        f1.innerHTML = options;
        filterJobs();
    }
    function filterJobs() {
        const comp = document.getElementById('f1').value;
        const jobSel = document.getElementById('f2');
        if(comp && treeData[comp]) {
            jobSel.innerHTML = '<option value="">-- 选择岗位 --</option>' + treeData[comp].map(j => `<option value="${j}">${j}</option>`).join('');
        } else { jobSel.innerHTML = '<option value="">请先选客户</option>'; }
    }

    // --- 候选人存取 ---
    function saveCandidate() {
        const row = { id: Date.now() };
        for(let i=1; i<=16; i++) row['f'+i] = document.getElementById('f'+i).value;
        if(!row.f3 || !row.f1 || !row.f2) return alert("姓名和岗位是必填项");
        candidates.push(row);
        localStorage.setItem(dbKey, JSON.stringify(candidates));
        renderTable(); updateCharts(); alert("录入成功！");
    }

    function renderTable() {
        document.getElementById('tableBody').innerHTML = candidates.map(i => `
            <tr>
                <td style="padding:15px 20px;"><strong>${i.f3}</strong></td>
                <td><span class="badge badge-${i.f5}">${i.f5}</span></td>
                <td>${i.f1}</td><td>${i.f2}</td><td>${i.f8}</td><td>${i.f13}</td>
                <td><span style="color:red; cursor:pointer; font-weight:700;" onclick="del(${i.id})">移除</span></td>
            </tr>
        `).join('');
    }

    function del(id) { if(confirm("确定移除？")) { candidates = candidates.filter(c => c.id !== id); localStorage.setItem(dbKey, JSON.stringify(candidates)); renderTable(); updateCharts(); } }

    // --- 图表 ---
    function updateCharts() {
        if(candidates.length === 0) return;
        const s = { '合适':0, '不合适':0, '正在联系中':0 };
        const e = { '大专':0, '本科':0, '研究生':0, '博士':0 };
        const j = {};
        candidates.forEach(i => { s[i.f5]++; e[i.f13]++; j[i.f1] = (j[i.f1] || 0) + 1; });

        draw('chartStatus', 'doughnut', Object.keys(s), Object.values(s), ['#34C759','#FF3B30','#FF9500'], true);
        draw('chartEdu', 'bar', Object.keys(e), Object.values(e), '#007AFF', false);
        draw('chartJob', 'bar', Object.keys(j), Object.values(j), '#AF52DE', false);
    }

    function draw(id, type, labels, data, colors, isD) {
        if(charts[id]) charts[id].destroy();
        charts[id] = new Chart(document.getElementById(id), {
            type: type,
            data: { labels, datasets: [{ data, backgroundColor: colors, borderRadius: isD ? 0 : 10 }] },
            options: { maintainAspectRatio:false, cutout: isD ? '75%' : 0, plugins:{ legend:{ display:isD, position:'bottom', labels:{ boxWidth:10, font:{size:11} } } }, scales:{ y:{ display:!isD, beginAtZero:true, ticks:{stepSize:1} }, x:{ display:!isD } } }
        });
    }

    function exportExcel() {
        const h = ["推荐公司 (客户)", "岗位名称", "姓名", "性别", "状态", "出生年", "岗位产品", "目前所在地", "期望所在地", "现公司", "电话/微信", "邮箱", "学历", "入学年份", "学校", "备注"];
        const s = { fill: { fgColor: { rgb: "007AFF" } }, font: { color: { rgb: "FFFFFF" }, bold: true }, alignment: {horizontal:"center"} };
        const rows = [ h.map(i => ({v:i, s:s})), ...candidates.map(i => [i.f1, i.f2, i.f3, i.f4, i.f5, i.f6, i.f7, i.f8, i.f9, i.f10, i.f11, i.f12, i.f13, i.f14, i.f15, i.f16]) ];
        const ws = XLSX.utils.aoa_to_sheet(rows);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "寻访报告");
        XLSX.writeFile(wb, "FLY_YUN_Pro_Report.xlsx");
    }
</script>
</body>
</html>
