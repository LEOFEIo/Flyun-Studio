<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FLY YUN - 移动适配增强版</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --ios-blue: #007AFF;
            --ios-bg: #F2F2F7;
            --ios-card: rgba(255, 255, 255, 0.9);
            --ios-red: #FF3B30;
            --radius-main: 22px;
        }

        body { 
            font-family: -apple-system, system-ui, sans-serif; 
            background-color: var(--ios-bg); 
            margin: 0; padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        /* --- 登录页 --- */
        #loginOverlay {
            position: fixed; inset: 0; z-index: 10000;
            background: linear-gradient(150deg, #D1D1D6 0%, #F2F2F7 100%);
            display: flex; justify-content: center; align-items: center;
        }
        .login-card {
            background: var(--ios-card); backdrop-filter: blur(40px);
            padding: 40px 30px; border-radius: 40px;
            width: 85%; max-width: 320px; text-align: center;
        }

        /* --- 主布局 --- */
        .app-shell { 
            max-width: 1200px; margin: 0 auto; padding: 20px; 
            display: none; padding-bottom: 120px;
        }

        header h2 { font-size: 28px; font-weight: 800; margin: 0; letter-spacing: -1px; }

        .card-ios {
            background: var(--ios-card); backdrop-filter: blur(20px);
            border-radius: var(--radius-main); padding: 20px; margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.7);
        }

        /* 岗位标签样式 */
        .job-pill {
            background: white; padding: 6px 12px; border-radius: 12px;
            font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05); border: 1px solid #E5E5EA;
        }
        .job-pill span {
            color: var(--ios-red); cursor: pointer; font-size: 16px; font-weight: bold;
            padding: 0 4px;
        }

        /* 响应式网格 */
        .form-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; }
        @media (max-width: 1024px) { .form-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 480px) { .form-grid { grid-template-columns: 1fr; } }

        .form-item label { font-size: 11px; font-weight: 700; color: #8E8E93; margin-bottom: 5px; text-transform: uppercase; }
        .form-item input, .form-item select {
            background: white; border: 1px solid #D1D1D6; padding: 12px; 
            border-radius: 12px; font-size: 16px; width: 100%; box-sizing: border-box;
        }

        /* 底部工具栏 */
        .tab-bar {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(255,255,255,0.9); backdrop-filter: blur(25px);
            padding: 10px 20px; border-radius: 30px; display: flex; gap: 10px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); z-index: 999;
            width: 90%; max-width: 500px;
        }
        .tab-btn {
            border: none; border-radius: 15px; font-weight: 700; font-size: 13px;
            padding: 12px; cursor: pointer; flex: 1; transition: 0.2s;
        }
        .tab-btn:active { transform: scale(0.95); }

        /* 表格滑动 */
        .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: 15px; background: white; }
        table { width: 100%; border-collapse: collapse; min-width: 1300px; }
        th, td { padding: 12px; font-size: 14px; text-align: left; border-bottom: 1px solid #F2F2F7; }
    </style>
</head>
<body>

<div id="loginOverlay">
    <div class="login-card">
        <h1>FLY YUN</h1>
        <p>输入专属密码以同步数据</p>
        <input type="password" id="sysPass" placeholder="密码" style="width:100%; padding:15px; border-radius:15px; border:1px solid #ddd; text-align:center; font-size: 18px;">
        <button onclick="login()" style="width:100%; background:#007AFF; color:white; border:none; padding:15px; border-radius:15px; margin-top:15px; font-weight:600; font-size: 16px;">进入系统</button>
    </div>
</div>

<div class="app-shell" id="app">
    <header style="margin-bottom: 25px; display: flex; justify-content: space-between; align-items: flex-end;">
        <div>
            <h2>FLY YUN</h2>
            <div id="userDisplay" style="font-size:12px; color:#8E8E93;"></div>
        </div>
    </header>

    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px; margin-bottom: 20px;">
        <div class="card-ios"><canvas id="c1" style="max-height: 180px;"></canvas></div>
        <div class="card-ios"><canvas id="c2" style="max-height: 180px;"></canvas></div>
    </div>

    <div class="card-ios">
        <div style="font-size: 14px; font-weight: 700; margin-bottom: 12px; color: #1C1C1E;">岗位库管理</div>
        <div style="display:flex; gap:10px; margin-bottom: 15px;">
            <input type="text" id="jobInput" placeholder="输入新岗位名称" style="flex:1; padding:10px; border-radius:10px; border:1px solid #ddd; font-size: 14px;">
            <button onclick="addJob()" style="background:#007AFF; color:white; border:none; border-radius:10px; padding:0 15px; font-weight: 600;">添加</button>
        </div>
        <div id="jobList" style="display:flex; flex-wrap:wrap; gap:10px;"></div>
    </div>

    <div class="card-ios">
        <div style="font-size: 14px; font-weight: 700; margin-bottom: 12px; color: #1C1C1E;">寻访录入</div>
        <div class="form-grid">
            <div class="form-item"><label>1. 推荐公司</label><input type="text" id="f1"></div>
            <div class="form-item"><label>2. 岗位名称</label><select id="f2"></select></div>
            <div class="form-item"><label>3. 姓名</label><input type="text" id="f3"></div>
            <div class="form-item"><label>4. 性别</label><select id="f4"><option value="男">男</option><option value="女">女</option></select></div>
            <div class="form-item"><label>5. 状态</label><select id="f5"><option value="正在联系中">正在联系中</option><option value="合适">合适</option><option value="不合适">不合适</option></select></div>
            <div class="form-item"><label>6. 出生年份</label><select id="f6"></select></div>
            <div class="form-item"><label>7. 岗位产品</label><input type="text" id="f7"></div>
            <div class="form-item"><label>8. 目前所在地</label><input type="text" id="f8"></div>
            <div class="form-item"><label>9. 期望所在地</label><input type="text" id="f9"></div>
            <div class="form-item"><label>10. 现公司</label><input type="text" id="f10"></div>
            <div class="form-item"><label>11. 电话/微信号</label><input type="text" id="f11"></div>
            <div class="form-item"><label>12. 邮箱</label><input type="text" id="f12"></div>
            <div class="form-item">
                <label>13. 学历</label>
                <select id="f13">
                    <option value="大专">大专</option>
                    <option value="本科">本科</option>
                    <option value="研究生">研究生</option>
                    <option value="博士">博士</option>
                </select>
            </div>
            <div class="form-item"><label>14. 入学年份</label><input type="text" id="f14"></div>
            <div class="form-item"><label>15. 学校</label><input type="text" id="f15"></div>
            <div class="form-item"><label>16. 备注</label><input type="text" id="f16"></div>
        </div>
    </div>

    <div class="table-wrap">
        <table>
            <thead>
                <tr><th>姓名</th><th>状态</th><th>岗位</th><th>性别</th><th>出生年</th><th>所在地</th><th>联系方式</th><th>学历</th><th>管理</th></tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<div class="tab-bar" id="tabBar" style="display:none">
    <button class="tab-btn" style="background:#007AFF; color:white;" onclick="save()">✅ 存入名单</button>
    <button class="tab-btn" style="background:#34C759; color:white;" onclick="exportExcel()">📊 导出 Excel</button>
    <button class="tab-btn" style="background:#E5E5EA; color: #1C1C1E;" onclick="location.reload()">🔒 退出</button>
</div>

<script>
    let dbKey = ""; let data = []; let jobs = []; let charts = {};

    function login() {
        const p = document.getElementById('sysPass').value;
        if(!p) return;
        dbKey = "FLY_YUN_V6_" + btoa(p);
        document.getElementById('loginOverlay').style.display = 'none';
        document.getElementById('app').style.display = 'block';
        document.getElementById('tabBar').style.display = 'flex';
        document.getElementById('userDisplay').innerText = "当前空间: " + p;
        init();
    }

    function init() {
        // 初始化 1960-2022 年份
        let y = '<option value="">选择年份</option>';
        for(let i=1960; i<=2022; i++) y += `<option value="${i}">${i}年</option>`;
        document.getElementById('f6').innerHTML = y;

        data = JSON.parse(localStorage.getItem(dbKey) || "[]");
        jobs = JSON.parse(localStorage.getItem(dbKey + "_j") || "[]");
        refreshJobs(); renderTable(); refreshCharts();
    }

    // --- 岗位逻辑 (新增删除功能) ---
    function addJob() {
        const v = document.getElementById('jobInput').value.trim();
        if(v && !jobs.includes(v)) {
            jobs.push(v);
            localStorage.setItem(dbKey + "_j", JSON.stringify(jobs));
            document.getElementById('jobInput').value = "";
            refreshJobs();
        }
    }

    function removeJob(jobName) {
        if(confirm(`确定删除岗位“${jobName}”吗？`)) {
            jobs = jobs.filter(j => j !== jobName);
            localStorage.setItem(dbKey + "_j", JSON.stringify(jobs));
            refreshJobs();
        }
    }

    function refreshJobs() {
        // 渲染带有删除按钮的标签
        document.getElementById('jobList').innerHTML = jobs.map(j => `
            <div class="job-pill">
                ${j} <span onclick="removeJob('${j}')">×</span>
            </div>
        `).join('');
        
        // 更新录入框下拉菜单
        document.getElementById('f2').innerHTML = '<option value="">选择岗位</option>' + jobs.map(j => `<option value="${j}">${j}</option>`).join('');
    }

    // --- 数据存取 ---
    function save() {
        const row = {
            id: Date.now(),
            f1: document.getElementById('f1').value, f2: document.getElementById('f2').value,
            f3: document.getElementById('f3').value, f4: document.getElementById('f4').value,
            f5: document.getElementById('f5').value, f6: document.getElementById('f6').value,
            f7: document.getElementById('f7').value, f8: document.getElementById('f8').value,
            f9: document.getElementById('f9').value, f10: document.getElementById('f10').value,
            f11: document.getElementById('f11').value, f12: document.getElementById('f12').value,
            f13: document.getElementById('f13').value, f14: document.getElementById('f14').value,
            f15: document.getElementById('f15').value, f16: document.getElementById('f16').value
        };
        if(!row.f3 || !row.f2) return alert("姓名和岗位是必填项");
        data.push(row);
        localStorage.setItem(dbKey, JSON.stringify(data));
        renderTable(); refreshCharts(); alert("成功录入！");
    }

    function renderTable() {
        document.getElementById('tableBody').innerHTML = data.map(i => `
            <tr>
                <td><strong>${i.f3}</strong></td>
                <td>${i.f5}</td><td>${i.f2}</td><td>${i.f4}</td><td>${i.f6}</td>
                <td>${i.f8}</td><td>${i.f11}</td><td>${i.f13}</td>
                <td><span style="color:var(--ios-red); font-weight:600;" onclick="del(${i.id})">移除</span></td>
            </tr>
        `).join('');
    }

    function del(id) {
        if(confirm("确定移除此记录吗？")) {
            data = data.filter(i => i.id !== id);
            localStorage.setItem(dbKey, JSON.stringify(data));
            renderTable(); refreshCharts();
        }
    }

    function refreshCharts() {
        if(data.length === 0) return;
        const s = { '合适':0, '不合适':0, '正在联系中':0 };
        data.forEach(i => s[i.f5]++);
        new Chart(document.getElementById('c1'), { type:'doughnut', data:{ labels:Object.keys(s), datasets:[{data:Object.values(s), backgroundColor:['#34C759','#FF3B30','#FF9500'], borderWidth: 0}] }, options: { cutout: '70%', plugins: { legend: { position: 'bottom', labels: { boxWidth: 10 } } } } });
    }

    function exportExcel() {
        const head = ["推荐公司", "岗位名称", "姓名", "性别", "状态", "出生年", "岗位产品", "目前所在地", "期望所在地", "现公司", "电话/微信", "邮箱", "学历", "入学年份", "学校", "备注"];
        const headerStyle = { fill: { fgColor: { rgb: "007AFF" } }, font: { color: { rgb: "FFFFFF" }, bold: true }, alignment: {horizontal:"center"} };
        const excelRows = [
            head.map(h => ({ v: h, s: headerStyle })),
            ...data.map(i => [i.f1, i.f2, i.f3, i.f4, i.f5, i.f6, i.f7, i.f8, i.f9, i.f10, i.f11, i.f12, i.f13, i.f14, i.f15, i.f16])
        ];
        const ws = XLSX.utils.aoa_to_sheet(excelRows);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "寻访结果");
        XLSX.writeFile(wb, "FLY_YUN_Pro_Report.xlsx");
    }
</script>
</body>
</html>
