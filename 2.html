<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLY YUN - Google Material Design Sourcing</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            /* Google Brand Colors */
            --g-blue: #4285F4;
            --g-red: #EA4335;
            --g-yellow: #FBBC05;
            --g-green: #34A853;
            --g-bg: #F8F9FA;
            --g-surface: #FFFFFF;
            --g-border: #DADCE0;
            --g-text-main: #202124;
            --g-text-sub: #5F6368;
            --radius-xl: 28px;
            --radius-m: 12px;
            --shadow: 0 1px 2px 0 rgba(60,64,67,0.302), 0 1px 3px 1px rgba(60,64,67,0.149);
        }

        body {
            margin: 0; padding: 0;
            font-family: 'Roboto', 'Segoe UI', Tahoma, sans-serif;
            background-color: var(--g-bg);
            color: var(--g-text-main);
            -webkit-font-smoothing: antialiased;
        }

        /* --- Google Style 登录页 --- */
        #loginOverlay {
            position: fixed; inset: 0;
            background: var(--g-bg);
            display: flex; justify-content: center; align-items: center;
            z-index: 10000;
        }

        .google-login-card {
            background: var(--g-surface);
            border: 1px solid var(--g-border);
            border-radius: 8px;
            padding: 48px 40px 36px;
            width: 400px;
            text-align: center;
            box-sizing: border-box;
        }

        .google-login-card h1 { font-size: 24px; font-weight: 500; margin: 0 0 10px; color: var(--g-text-main); }
        .google-login-card h1 span:nth-child(1) { color: #4285F4; }
        .google-login-card h1 span:nth-child(2) { color: #EA4335; }
        .google-login-card h1 span:nth-child(3) { color: #FBBC05; }
        .google-login-card h1 span:nth-child(4) { color: #34A853; }

        .google-login-card p { font-size: 16px; margin-bottom: 40px; color: var(--g-text-main); }

        .g-input {
            width: 100%; padding: 13px 15px; border-radius: 4px; border: 1px solid var(--g-border);
            font-size: 16px; outline: none; transition: border 0.2s;
            margin-bottom: 24px; box-sizing: border-box;
        }
        .g-input:focus { border: 2px solid var(--g-blue); padding: 12px 14px; }

        .g-btn-main {
            background: var(--g-blue); color: white; border: none; padding: 10px 24px;
            border-radius: 4px; font-size: 14px; font-weight: 500; cursor: pointer;
            float: right; transition: box-shadow 0.2s;
        }
        .g-btn-main:hover { box-shadow: 0 1px 3px 1px rgba(66,133,244,0.3); background: #3c78d8; }

        /* --- 主界面导航 --- */
        .top-app-bar {
            height: 64px; background: var(--g-surface); border-bottom: 1px solid var(--g-border);
            display: flex; align-items: center; padding: 0 24px; position: sticky; top: 0; z-index: 100;
        }
        .top-app-bar h2 { font-size: 22px; font-weight: 400; margin: 0; }

        /* --- 容器布局 --- */
        .main-container { max-width: 1280px; margin: 24px auto; padding: 0 24px 100px; display: none; }

        .card {
            background: var(--g-surface); border-radius: var(--radius-m);
            border: 1px solid var(--g-border); padding: 24px; margin-bottom: 24px;
        }

        .section-header { font-size: 18px; font-weight: 500; margin-bottom: 20px; display: flex; align-items: center; gap: 12px; }

        /* 图表网格 */
        .analytics-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; margin-bottom: 24px; }
        .chart-wrap { height: 220px; }

        /* 表单网格 (16环节) */
        .form-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
        .g-field { display: flex; flex-direction: column; }
        .g-field label { font-size: 12px; font-weight: 500; color: var(--g-text-sub); margin-bottom: 4px; }
        .g-field input, .g-field select {
            padding: 10px; border: 1px solid var(--g-border); border-radius: 4px; font-size: 14px; outline: none;
        }
        .g-field input:focus, .g-field select:focus { border: 2px solid var(--g-blue); padding: 9px; }

        /* 状态与标签 */
        .status-pill { padding: 4px 12px; border-radius: 16px; font-size: 12px; font-weight: 500; display: inline-block; }
        .status-合适 { background: #E6F4EA; color: #137333; }
        .status-不合适 { background: #FCE8E6; color: #C5221F; }
        .status-正在联系中 { background: #FEF7E0; color: #B05E00; }

        .job-chip { 
            background: #E8F0FE; color: #1967D2; padding: 6px 12px; border-radius: 16px;
            font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 8px;
        }

        /* 底部浮动操作栏 */
        .fab-container {
            position: fixed; bottom: 24px; right: 24px; display: flex; gap: 12px;
        }
        .g-fab {
            background: var(--g-surface); color: var(--g-blue); border: none;
            padding: 16px 24px; border-radius: 16px; font-weight: 500; cursor: pointer;
            box-shadow: var(--shadow); transition: 0.2s; display: flex; align-items: center; gap: 8px;
        }
        .g-fab.primary { background: #D2E3FC; color: #174EA6; }
        .g-fab:hover { box-shadow: 0 4px 8px 3px rgba(60,64,67,0.15); }

        /* 表格样式 */
        .table-card { padding: 0; overflow: hidden; }
        table { width: 100%; border-collapse: collapse; min-width: 1600px; }
        th { background: #F8F9FA; text-align: left; padding: 12px 16px; font-size: 12px; color: var(--g-text-sub); border-bottom: 1px solid var(--g-border); }
        td { padding: 16px; font-size: 14px; border-bottom: 1px solid var(--g-border); }
        tr:hover { background: #F1F3F4; }
    </style>
</head>
<body>

<div id="loginOverlay">
    <div class="google-login-card">
        <h1><span>F</span><span>L</span><span>Y</span> <span>YUN</span></h1>
        <p>登录您的寻访工作空间</p>
        <input type="password" id="customPass" class="g-input" placeholder="输入您的专属密码" onkeydown="if(event.keyCode==13) login()">
        <div style="overflow: hidden;">
            <button class="g-btn-main" onclick="login()">下一步</button>
        </div>
        <div style="margin-top: 30px; font-size: 12px; color: var(--g-text-sub);">
            您的数据将加密存储在当前浏览器中
        </div>
    </div>
</div>

<div id="appInterface" style="display:none">
    <div class="top-app-bar">
        <h2 id="brand">FLY YUN <span style="font-size:14px; color:var(--g-text-sub); margin-left:15px;" id="userTag"></span></h2>
    </div>

    <div class="main-container">
        <div class="analytics-grid">
            <div class="card">
                <div class="section-header">寻访状态</div>
                <div class="chart-wrap"><canvas id="statusChart"></canvas></div>
            </div>
            <div class="card">
                <div class="section-header">学历背景</div>
                <div class="chart-wrap"><canvas id="eduChart"></canvas></div>
            </div>
            <div class="card">
                <div class="section-header">岗位热度</div>
                <div class="chart-wrap"><canvas id="jobChart"></canvas></div>
            </div>
        </div>

        <div class="card">
            <div class="section-header">项目岗位库</div>
            <div style="display:flex; gap:12px; margin-bottom:20px;">
                <input type="text" id="jobInput" class="g-input" style="margin:0; width:300px;" placeholder="添加新的招聘岗位...">
                <button class="g-btn-main" style="float:none; padding:12px 24px;" onclick="addJob()">添加</button>
            </div>
            <div id="jobChips" style="display:flex; flex-wrap:wrap; gap:8px;"></div>
        </div>

        <div class="card">
            <div class="section-header">录入候选人 (16个环节)</div>
            <div class="form-grid">
                <div class="g-field"><label>1. 推荐公司</label><input type="text" id="f1"></div>
                <div class="g-field"><label>2. 岗位名称</label><select id="f2"><option value="">请选择...</option></select></div>
                <div class="g-field"><label>3. 姓名</label><input type="text" id="f3"></div>
                <div class="g-field"><label>4. 性别</label><select id="f4"><option value="男">男</option><option value="女">女</option></select></div>
                <div class="g-field"><label>5. 状态</label><select id="f5"><option value="正在联系中">正在联系中</option><option value="合适">合适</option><option value="不合适">不合适</option></select></div>
                <div class="g-field"><label>6. 出生年份</label><select id="f6"></select></div>
                <div class="g-field"><label>7. 岗位产品</label><input type="text" id="f7"></div>
                <div class="g-field"><label>8. 目前所在地</label><input type="text" id="f8"></div>
                <div class="g-field"><label>9. 期望所在地</label><input type="text" id="f9"></div>
                <div class="g-field"><label>10. 现公司</label><input type="text" id="f10"></div>
                <div class="g-field"><label>11. 电话/微信号</label><input type="text" id="f11"></div>
                <div class="g-field"><label>12. 邮箱</label><input type="text" id="f12"></div>
                <div class="g-field"><label>13. 学历</label><select id="f13"><option value="本科">本科</option><option value="研究生">研究生</option><option value="博士">博士</option></select></div>
                <div class="g-field"><label>14. 入学年份</label><input type="text" id="f14"></div>
                <div class="g-field"><label>15. 学校</label><input type="text" id="f15"></div>
                <div class="g-field"><label>16. 备注</label><input type="text" id="f16"></div>
            </div>
        </div>

        <div class="card table-card">
            <div style="padding:20px; font-weight:500;">寻访人才名单</div>
            <div style="overflow-x:auto">
                <table>
                    <thead>
                        <tr><th>姓名</th><th>状态</th><th>岗位</th><th>性别</th><th>出生年</th><th>现公司</th><th>所在地</th><th>联系方式</th><th>学历</th><th>学校</th><th>备注</th><th>操作</th></tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<div class="fab-container" id="fab" style="display:none">
    <button class="g-fab primary" onclick="submitData()">+ 存入名单</button>
    <button class="g-fab" onclick="exportData()">⬇ 导出 Excel</button>
    <button class="g-fab" style="color:var(--g-red)" onclick="location.reload()">退出</button>
</div>

<script>
    let dbKey = "";
    let candidates = [];
    let jobs = [];
    let charts = {};

    function login() {
        const pass = document.getElementById('customPass').value;
        if(!pass) return;
        dbKey = "FLY_YUN_GOOGLE_" + btoa(pass);
        document.getElementById('loginOverlay').style.display = 'none';
        document.getElementById('appInterface').style.display = 'block';
        document.querySelector('.main-container').style.display = 'block';
        document.getElementById('fab').style.display = 'flex';
        document.getElementById('userTag').innerText = "Personal Data: " + pass;
        init();
    }

    function init() {
        // 初始化年份 1960-2022
        let yOpt = '<option value="">请选择...</option>';
        for(let y=1960; y<=2022; y++) yOpt += `<option value="${y}">${y}年</option>`;
        document.getElementById('f6').innerHTML = yOpt;

        candidates = JSON.parse(localStorage.getItem(dbKey) || "[]");
        jobs = JSON.parse(localStorage.getItem(dbKey + "_j") || "[]");
        renderJobs();
        renderTable();
        refreshCharts();
    }

    function addJob() {
        const val = document.getElementById('jobInput').value.trim();
        if(val && !jobs.includes(val)) {
            jobs.push(val);
            localStorage.setItem(dbKey + "_j", JSON.stringify(jobs));
            document.getElementById('jobInput').value = "";
            renderJobs();
        }
    }

    function renderJobs() {
        document.getElementById('jobChips').innerHTML = jobs.map(j => `<div class="job-chip">${j}</div>`).join('');
        document.getElementById('f2').innerHTML = '<option value="">请选择...</option>' + jobs.map(j => `<option value="${j}">${j}</option>`).join('');
    }

    function submitData() {
        const row = {
            id: Date.now(),
            f1: document.getElementById('f1').value, f2: document.getElementById('f2').value,
            f3: document.getElementById('f3').value, f4: document.getElementById('f4').value,
            f5: document.getElementById('f5').value, f6: document.getElementById('f6').value,
            f7: document.getElementById('f7').value, f8: document.getElementById('f8').value,
            f9: document.getElementById('f9').value, f10: document.getElementById('f10').value,
            f11: document.getElementById('f11').value, f12: document.getElementById('f12').value,
            f13: document.getElementById('f13').value, f14: document.getElementById('f14').value,
            f15: document.getElementById('f15').value, f16: document.getElementById('f16').value
        };
        if(!row.f3) return alert("请输入姓名");
        candidates.push(row);
        localStorage.setItem(dbKey, JSON.stringify(candidates));
        renderTable();
        refreshCharts();
        alert("已添加到您的私有库");
    }

    function renderTable() {
        document.getElementById('tableBody').innerHTML = candidates.map(i => `
            <tr>
                <td><strong>${i.f3}</strong></td>
                <td><span class="status-pill status-${i.f5}">${i.f5}</span></td>
                <td>${i.f2}</td><td>${i.f4}</td><td>${i.f6}</td><td>${i.f10}</td>
                <td>${i.f8}</td><td>${i.f11}</td><td>${i.f13}</td><td>${i.f15}</td><td>${i.f16}</td>
                <td style="color:#C5221F; cursor:pointer" onclick="removeCandidate(${i.id})">移除</td>
            </tr>
        `).join('');
    }

    function removeCandidate(id) {
        if(confirm("确定移除此记录吗？")) {
            candidates = candidates.filter(i => i.id !== id);
            localStorage.setItem(dbKey, JSON.stringify(candidates));
            renderTable();
            refreshCharts();
        }
    }

    function refreshCharts() {
        if(candidates.length === 0) return;
        const stats = { '合适':0, '不合适':0, '正在联系中':0 };
        const edus = { '本科':0, '研究生':0, '博士':0 };
        const jobCounts = {};
        candidates.forEach(i => { stats[i.f5]++; edus[i.f13]++; jobCounts[i.f2] = (jobCounts[i.f2] || 0) + 1; });

        draw('statusChart', 'doughnut', Object.keys(stats), Object.values(stats), ['#34A853','#EA4335','#FBBC05']);
        draw('eduChart', 'bar', Object.keys(edus), Object.values(edus), '#4285F4');
        draw('jobChart', 'bar', Object.keys(jobCounts), Object.values(jobCounts), '#AA47BC');
    }

    function draw(id, type, labels, data, color) {
        if(charts[id]) charts[id].destroy();
        charts[id] = new Chart(document.getElementById(id), {
            type: type,
            data: { labels, datasets: [{ data, backgroundColor: color, borderRadius: 4 }] },
            options: { cutout: '65%', plugins: { legend: { display: type==='doughnut', position:'bottom' } }, scales: { y: { display: type!=='doughnut' } } }
        });
    }

    function exportData() {
        const head = ["推荐公司", "岗位名称", "姓名", "性别", "状态", "出生年", "岗位产品", "目前所在地", "期望所在地", "现公司", "电话/微信", "邮箱", "学历", "入学年份", "学校", "备注"];
        const headerStyle = { fill: { fgColor: { rgb: "4285F4" } }, font: { color: { rgb: "FFFFFF" }, bold: true }, alignment: {horizontal:"center"} };
        const data = [
            head.map(h => ({ v: h, s: headerStyle })),
            ...candidates.map(i => [i.f1, i.f2, i.f3, i.f4, i.f5, i.f6, i.f7, i.f8, i.f9, i.f10, i.f11, i.f12, i.f13, i.f14, i.f15, i.f16])
        ];
        const ws = XLSX.utils.aoa_to_sheet(data);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "寻访数据");
        XLSX.writeFile(wb, "FLY_YUN_Material_Report.xlsx");
    }
</script>
</body>
</html>
