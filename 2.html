<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLY YUN - Think Different</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --ios-blue: #007AFF;
            --ios-green: #34C759;
            --ios-red: #FF3B30;
            --ios-orange: #FF9500;
            --ios-bg: #F2F2F7;
            --ios-card: rgba(255, 255, 255, 0.85);
            --radius-main: 22px;
            --radius-input: 12px;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif; 
            background-color: var(--ios-bg); 
            color: #000;
            margin: 0;
            -webkit-font-smoothing: antialiased;
        }

        /* --- iOS 18 登录页 --- */
        #loginOverlay {
            position: fixed; inset: 0;
            background: linear-gradient(150deg, #D1D1D6 0%, #F2F2F7 100%);
            display: flex; justify-content: center; align-items: center;
            z-index: 10000;
            transition: 0.5s ease;
        }

        .login-card {
            background: var(--ios-card);
            backdrop-filter: blur(40px) saturate(180%);
            -webkit-backdrop-filter: blur(40px) saturate(180%);
            padding: 45px 35px;
            border-radius: 45px;
            width: 320px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.06);
            border: 1px solid rgba(255,255,255,0.6);
        }

        .login-card h1 { font-size: 34px; font-weight: 800; margin: 0; letter-spacing: -1.5px; }
        .login-card p { font-size: 14px; color: #8E8E93; margin: 8px 0 35px; }

        .ios-input-auth {
            width: 100%; padding: 16px; border-radius: 16px; border: none;
            background: rgba(0,0,0,0.05); font-size: 17px; outline: none;
            text-align: center; transition: 0.2s; box-sizing: border-box;
        }
        .ios-input-auth:focus { background: rgba(0,0,0,0.08); box-shadow: 0 0 0 3px rgba(0,122,255,0.15); }

        .ios-btn-auth {
            width: 100%; background: var(--ios-blue); color: white; padding: 16px;
            border: none; border-radius: 16px; font-size: 17px; font-weight: 600;
            margin-top: 20px; cursor: pointer; transition: 0.2s;
        }
        .ios-btn-auth:active { transform: scale(0.96); opacity: 0.9; }

        /* --- 主界面设计 --- */
        .app-shell { max-width: 1300px; margin: 0 auto; padding: 50px 20px; display: none; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; }
        .header h2 { font-size: 34px; font-weight: 800; letter-spacing: -1px; margin: 0; }
        .user-pill { background: rgba(0,0,0,0.05); padding: 6px 15px; border-radius: 20px; font-size: 13px; color: #8E8E93; font-weight: 500; }

        .card-ios {
            background: var(--ios-card); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-radius: var(--radius-main); padding: 25px; margin-bottom: 25px;
            border: 1px solid rgba(255,255,255,0.7); box-shadow: 0 4px 20px rgba(0,0,0,0.02);
        }

        .title-ios { font-size: 19px; font-weight: 700; margin-bottom: 20px; color: #1C1C1E; opacity: 0.9; }

        /* 看板设计 */
        .charts-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 30px; }
        .chart-box { height: 230px; position: relative; }

        /* 16环节 布局 */
        .form-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }
        .form-item { display: flex; flex-direction: column; }
        .form-item label { font-size: 12px; font-weight: 700; color: #8E8E93; margin-bottom: 8px; padding-left: 5px; text-transform: uppercase; }
        .form-item input, .form-item select {
            background: white; border: 1px solid #D1D1D6; padding: 12px; border-radius: var(--radius-input); font-size: 15px; outline: none; transition: 0.2s;
        }
        .form-item input:focus, .form-item select:focus { border-color: var(--ios-blue); box-shadow: 0 0 0 3px rgba(0,122,255,0.1); }

        /* 状态标记 */
        .badge { padding: 4px 10px; border-radius: 8px; font-size: 12px; font-weight: 700; }
        .badge-合适 { background: #D2F9D8; color: #1E6726; }
        .badge-不合适 { background: #FFE5E5; color: #D32F2F; }
        .badge-正在联系中 { background: #FFF4D2; color: #8A6D1F; }

        /* 底部导航式按钮栏 */
        .tab-bar {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: rgba(255,255,255,0.85); backdrop-filter: blur(25px);
            border: 1px solid rgba(255,255,255,0.5); padding: 10px 30px;
            border-radius: 30px; display: flex; gap: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); z-index: 999;
        }
        .tab-btn {
            border: none; background: none; font-weight: 700; font-size: 14px;
            padding: 12px 20px; border-radius: 18px; cursor: pointer; transition: 0.2s;
        }
        .tab-btn.primary { background: var(--ios-blue); color: white; }
        .tab-btn:active { transform: scale(0.95); }

        /* 表格设计 */
        .table-wrap { overflow-x: auto; border-radius: var(--radius-main); background: white; }
        table { width: 100%; border-collapse: collapse; min-width: 1700px; }
        th { text-align: left; padding: 20px 15px; font-size: 13px; color: #8E8E93; font-weight: 600; border-bottom: 1px solid #F2F2F7; }
        td { padding: 18px 15px; font-size: 15px; border-bottom: 1px solid #F2F2F7; }
        tr:last-child td { border-bottom: none; }
    </style>
</head>
<body>

<div id="loginOverlay">
    <div class="login-card">
        <h1>FLY YUN</h1>
        <p>输入您的专属访问密码</p>
        <input type="password" id="sysPass" class="ios-input-auth" placeholder="访问密码" onkeydown="if(event.keyCode==13) login()">
        <button class="ios-btn-auth" onclick="login()">进入系统</button>
    </div>
</div>

<div class="app-shell" id="app">
    <div class="header">
        <h2>FLY YUN</h2>
        <div class="user-pill" id="userDisplay"></div>
    </div>

    <div class="charts-row">
        <div class="card-ios">
            <div class="title-ios">人才状态</div>
            <div class="chart-box"><canvas id="c1"></canvas></div>
        </div>
        <div class="card-ios">
            <div class="title-ios">学历背景</div>
            <div class="chart-box"><canvas id="c2"></canvas></div>
        </div>
        <div class="card-ios">
            <div class="title-ios">岗位进展</div>
            <div class="chart-box"><canvas id="c3"></canvas></div>
        </div>
    </div>

    <div class="card-ios">
        <div class="title-ios">岗位管理</div>
        <div style="display:flex; gap:12px; margin-bottom:20px;">
            <input type="text" id="jobInput" class="form-item" style="flex:1; padding:12px; border-radius:12px; border:1px solid #D1D1D6;" placeholder="输入新岗位，如：产品经理">
            <button class="tab-btn primary" style="padding:0 30px" onclick="addJob()">添加</button>
        </div>
        <div id="jobList" style="display:flex; flex-wrap:wrap; gap:8px;"></div>
    </div>

    <div class="card-ios">
        <div class="title-ios">寻访详情录入 (16个环节)</div>
        <div class="form-grid">
            <div class="form-item"><label>1. 推荐公司</label><input type="text" id="f1"></div>
            <div class="form-item"><label>2. 岗位名称</label><select id="f2"><option value="">请选择...</option></select></div>
            <div class="form-item"><label>3. 姓名</label><input type="text" id="f3"></div>
            <div class="form-item"><label>4. 性别</label><select id="f4"><option value="男">男</option><option value="女">女</option></select></div>
            <div class="form-item"><label>5. 状态</label><select id="f5"><option value="正在联系中">正在联系中</option><option value="合适">合适</option><option value="不合适">不合适</option></select></div>
            <div class="form-item"><label>6. 出生年份</label><select id="f6"></select></div>
            <div class="form-item"><label>7. 岗位产品</label><input type="text" id="f7"></div>
            <div class="form-item"><label>8. 目前所在地</label><input type="text" id="f8"></div>
            <div class="form-item"><label>9. 期望所在地</label><input type="text" id="f9"></div>
            <div class="form-item"><label>10. 现公司</label><input type="text" id="f10"></div>
            <div class="form-item"><label>11. 电话/微信号</label><input type="text" id="f11"></div>
            <div class="form-item"><label>12. 邮箱</label><input type="text" id="f12"></div>
            <div class="form-item"><label>13. 学历</label><select id="f13"><option value="本科">本科</option><option value="研究生">研究生</option><option value="博士">博士</option></select></div>
            <div class="form-item"><label>14. 入学年份</label><input type="text" id="f14"></div>
            <div class="form-item"><label>15. 学校</label><input type="text" id="f15"></div>
            <div class="form-item"><label>16. 备注</label><input type="text" id="f16"></div>
        </div>
    </div>

    <div class="card-ios" style="padding:0; overflow:hidden;">
        <div class="table-wrap">
            <table>
                <thead>
                    <tr><th>姓名</th><th>状态</th><th>岗位</th><th>性别</th><th>出生年</th><th>所在地</th><th>现公司</th><th>联系方式</th><th>学历</th><th>学校</th><th>备注</th><th>管理</th></tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>
</div>

<div class="tab-bar" id="tabBar" style="display:none">
    <button class="tab-btn primary" onclick="save()">✅ 存入名单</button>
    <button class="tab-btn" style="background:#34C759; color:white" onclick="exportExcel()">📊 导出 Excel</button>
    <button class="tab-btn" style="color:#FF3B30" onclick="location.reload()">🔒 退出</button>
</div>

<script>
    let dbKey = "";
    let data = [];
    let jobs = [];
    let charts = {};

    function login() {
        const pass = document.getElementById('sysPass').value;
        if(!pass) return;
        dbKey = "FLY_YUN_IOS_" + btoa(pass);
        document.getElementById('loginOverlay').style.opacity = '0';
        setTimeout(() => {
            document.getElementById('loginOverlay').style.display = 'none';
            document.getElementById('app').style.display = 'block';
            document.getElementById('tabBar').style.display = 'flex';
            document.getElementById('userDisplay').innerText = "Personal space: " + pass;
            init();
        }, 400);
    }

    function init() {
        // 出生年 1960-2022
        let yOpt = '<option value="">请选择...</option>';
        for(let y=1960; y<=2022; y++) yOpt += `<option value="${y}">${y}年</option>`;
        document.getElementById('f6').innerHTML = yOpt;

        data = JSON.parse(localStorage.getItem(dbKey) || "[]");
        jobs = JSON.parse(localStorage.getItem(dbKey + "_j") || "[]");
        refreshJobs();
        renderTable();
        refreshCharts();
    }

    function addJob() {
        const v = document.getElementById('jobInput').value.trim();
        if(v && !jobs.includes(v)) {
            jobs.push(v);
            localStorage.setItem(dbKey + "_j", JSON.stringify(jobs));
            document.getElementById('jobInput').value = "";
            refreshJobs();
        }
    }

    function refreshJobs() {
        document.getElementById('jobList').innerHTML = jobs.map(j => `<div style="background:#E9E9EB; padding:6px 12px; border-radius:15px; font-size:13px; font-weight:600;">${j}</div>`).join('');
        document.getElementById('f2').innerHTML = '<option value="">请选择...</option>' + jobs.map(j => `<option value="${j}">${j}</option>`).join('');
    }

    function save() {
        const row = {
            id: Date.now(),
            f1: document.getElementById('f1').value, f2: document.getElementById('f2').value,
            f3: document.getElementById('f3').value, f4: document.getElementById('f4').value,
            f5: document.getElementById('f5').value, f6: document.getElementById('f6').value,
            f7: document.getElementById('f7').value, f8: document.getElementById('f8').value,
            f9: document.getElementById('f9').value, f10: document.getElementById('f10').value,
            f11: document.getElementById('f11').value, f12: document.getElementById('f12').value,
            f13: document.getElementById('f13').value, f14: document.getElementById('f14').value,
            f15: document.getElementById('f15').value, f16: document.getElementById('f16').value
        };
        if(!row.f3) return alert("姓名是必须的");
        data.push(row);
        localStorage.setItem(dbKey, JSON.stringify(data));
        renderTable();
        refreshCharts();
        alert("已成功录入");
    }

    function renderTable() {
        document.getElementById('tableBody').innerHTML = data.map(i => `
            <tr>
                <td><strong>${i.f3}</strong></td>
                <td><span class="badge badge-${i.f5}">${i.f5}</span></td>
                <td>${i.f2}</td><td>${i.f4}</td><td>${i.f6}</td>
                <td>${i.f8}</td><td>${i.f10}</td><td>${i.f11}</td>
                <td>${i.f13}</td><td>${i.f15}</td><td>${i.f16}</td>
                <td><span style="color:var(--ios-red); cursor:pointer; font-weight:600" onclick="del(${i.id})">移除</span></td>
            </tr>
        `).join('');
    }

    function del(id) {
        if(confirm("确定移除此记录?")) {
            data = data.filter(i => i.id !== id);
            localStorage.setItem(dbKey, JSON.stringify(data));
            renderTable();
            refreshCharts();
        }
    }

    function refreshCharts() {
        if(data.length === 0) return;
        const s = { '合适':0, '不合适':0, '正在联系中':0 };
        const e = { '本科':0, '研究生':0, '博士':0 };
        const j = {};
        data.forEach(i => { s[i.f5]++; e[i.f13]++; j[i.f2] = (j[i.f2] || 0) + 1; });

        draw('c1', 'doughnut', Object.keys(s), Object.values(s), ['#34C759','#FF3B30','#FF9500']);
        draw('c2', 'bar', Object.keys(e), Object.values(e), '#007AFF');
        draw('c3', 'bar', Object.keys(j), Object.values(j), '#AF52DE');
    }

    function draw(id, type, labels, dataArr, color) {
        if(charts[id]) charts[id].destroy();
        charts[id] = new Chart(document.getElementById(id), {
            type: type,
            data: { labels, datasets: [{ data: dataArr, backgroundColor: color, borderRadius: 10 }] },
            options: { cutout: '75%', plugins: { legend: { display: type==='doughnut', position:'bottom' } }, scales: { y: { display: type!=='doughnut' } } }
        });
    }

    function exportExcel() {
        const head = ["推荐公司", "岗位名称", "姓名", "性别", "状态", "出生年", "岗位产品", "目前所在地", "期望所在地", "现公司", "电话/微信", "邮箱", "学历", "入学年份", "学校", "备注"];
        const headerStyle = { fill: { fgColor: { rgb: "007AFF" } }, font: { color: { rgb: "FFFFFF" }, bold: true }, alignment: {horizontal:"center"} };
        const rows = [
            head.map(h => ({ v: h, s: headerStyle })),
            ...data.map(i => [i.f1, i.f2, i.f3, i.f4, i.f5, i.f6, i.f7, i.f8, i.f9, i.f10, i.f11, i.f12, i.f13, i.f14, i.f15, i.f16])
        ];
        const ws = XLSX.utils.aoa_to_sheet(rows);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "数据报告");
        XLSX.writeFile(wb, "FLY_YUN_Sourcing_Report.xlsx");
    }
</script>

</body>
</html>
