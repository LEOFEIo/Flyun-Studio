<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLY YUN - Intelligent Sourcing</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --ios-accent: #007AFF;
            --ios-accent-gradient: linear-gradient(135deg, #007AFF, #00C6FF);
            --glass-bg: rgba(255, 255, 255, 0.4);
            --glass-border: rgba(255, 255, 255, 0.5);
            --text-main: #1D1D1F;
            --text-sub: #6E6E73;
        }

        body, html {
            margin: 0; padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", sans-serif;
            background: #000; /* 底色 */
            overflow-x: hidden;
            color: var(--text-main);
        }

        /* --- iOS 26 动态背景 --- */
        .dynamic-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(45deg, #f3f4f7, #e2e8f0, #dee2e6);
            z-index: -1;
        }
        .bg-sphere {
            position: absolute; width: 600px; height: 600px;
            background: radial-gradient(circle, rgba(0,122,255,0.15) 0%, rgba(255,255,255,0) 70%);
            border-radius: 50%;
            filter: blur(80px);
            animation: move 20s infinite alternate;
        }

        @keyframes move {
            from { transform: translate(-10%, -10%); }
            to { transform: translate(30%, 20%); }
        }

        /* --- 登录页面 (iOS 26 Style) --- */
        #loginOverlay {
            position: fixed; inset: 0;
            background: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=2564&auto=format&fit=crop') center/cover;
            display: flex; justify-content: center; align-items: center;
            z-index: 10000;
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .login-glass-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(50px) saturate(200%);
            -webkit-backdrop-filter: blur(50px) saturate(200%);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 40px;
            padding: 50px;
            width: 340px;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0,0,0,0.2);
        }

        .login-glass-card h1 { 
            color: white; font-size: 42px; font-weight: 800; margin: 0; 
            letter-spacing: -2px; text-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .login-glass-card p { color: rgba(255,255,255,0.7); font-size: 14px; margin: 10px 0 40px; }

        .ios-26-input {
            width: 100%; padding: 18px; border-radius: 18px; border: none;
            background: rgba(255, 255, 255, 0.1); color: white;
            font-size: 16px; outline: none; text-align: center;
            transition: 0.3s; margin-bottom: 20px; box-sizing: border-box;
        }
        .ios-26-input::placeholder { color: rgba(255,255,255,0.4); }
        .ios-26-input:focus { background: rgba(255, 255, 255, 0.2); box-shadow: 0 0 0 1px rgba(255,255,255,0.5); }

        .ios-26-btn {
            width: 100%; padding: 18px; border-radius: 18px; border: none;
            background: white; color: black; font-weight: 700; font-size: 16px;
            cursor: pointer; transition: 0.3s;
        }
        .ios-26-btn:hover { transform: scale(1.02); box-shadow: 0 10px 20px rgba(0,0,0,0.1); }

        /* --- 主界面 --- */
        .main-app {
            max-width: 1200px; margin: 0 auto; padding: 60px 20px;
            display: none;
        }

        .header-section { margin-bottom: 40px; display: flex; justify-content: space-between; align-items: center; }
        .header-section h2 { font-size: 40px; font-weight: 800; letter-spacing: -1.5px; margin: 0; }

        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.03);
        }

        .section-title { font-size: 20px; font-weight: 700; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }

        /* 网格布局 (iOS 风格间隔) */
        .form-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
        .input-group { display: flex; flex-direction: column; }
        .input-group label { font-size: 12px; font-weight: 700; color: var(--text-sub); margin-bottom: 8px; margin-left: 5px; }
        .input-group input, .input-group select {
            background: rgba(255,255,255,0.6); border: 1px solid rgba(0,0,0,0.05);
            padding: 14px; border-radius: 14px; font-size: 14px; outline: none; transition: 0.3s;
        }
        .input-group input:focus { background: white; border-color: var(--ios-accent); box-shadow: 0 0 0 4px rgba(0,122,255,0.1); }

        /* 状态标签 */
        .badge { padding: 6px 12px; border-radius: 10px; font-size: 12px; font-weight: 700; }
        .status-合适 { background: #E2F9E5; color: #28CD41; }
        .status-不合适 { background: #FFE9E9; color: #FF3B30; }
        .status-正在联系中 { background: #FFF4DB; color: #FF9500; }

        /* 按钮悬浮工具栏 */
        .toolbar {
            position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%);
            background: rgba(255,255,255,0.8); backdrop-filter: blur(20px);
            padding: 10px 30px; border-radius: 25px;
            display: flex; gap: 20px; border: 1px solid white;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1); z-index: 999;
        }
        .tool-btn {
            background: none; border: none; font-weight: 700; font-size: 14px;
            cursor: pointer; padding: 10px 15px; border-radius: 15px; transition: 0.2s;
        }
        .tool-btn.primary { background: var(--ios-accent); color: white; }
        .tool-btn.primary:hover { background: #0056b3; }

        /* 图表容器 */
        .dashboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 30px; }
        .chart-box { height: 240px; }

        /* 表格微调 */
        .table-container { overflow-x: auto; border-radius: 20px; background: white; }
        table { width: 100%; border-collapse: collapse; min-width: 1600px; }
        th { text-align: left; padding: 20px 15px; font-size: 12px; color: var(--text-sub); border-bottom: 1px solid #f2f2f2; }
        td { padding: 20px 15px; font-size: 14px; border-bottom: 1px solid #f9f9f9; }
    </style>
</head>
<body>

<div class="dynamic-bg"><div class="bg-sphere"></div></div>

<div id="loginOverlay">
    <div class="login-glass-card">
        <h1>FLY YUN</h1>
        <p>Intelligent Recruitment Cloud</p>
        <input type="password" id="customPass" class="ios-26-input" placeholder="输入访问密钥">
        <button class="ios-26-btn" onclick="enterSystem()">进入空间</button>
    </div>
</div>

<div class="main-app" id="appBody">
    <div class="header-section">
        <h2>FLY YUN</h2>
        <div style="font-size:14px; color:var(--text-sub)" id="userTag"></div>
    </div>

    <div class="dashboard">
        <div class="glass-card">
            <div class="section-title">人才状态分布</div>
            <div class="chart-box"><canvas id="chart1"></canvas></div>
        </div>
        <div class="glass-card">
            <div class="section-title">学历层次分析</div>
            <div class="chart-box"><canvas id="chart2"></canvas></div>
        </div>
        <div class="glass-card">
            <div class="section-title">项目寻访进展</div>
            <div class="chart-box"><canvas id="chart3"></canvas></div>
        </div>
    </div>

    <div class="glass-card">
        <div class="section-title">💼 岗位定义</div>
        <div style="display:flex; gap:15px;">
            <input type="text" id="jobName" class="input-group" style="flex:1; padding:12px; border-radius:12px; border:1px solid #ddd;" placeholder="添加新的招聘岗位...">
            <button class="ios-26-btn" style="width:auto; padding:0 30px;" onclick="addJob()">添加岗位</button>
        </div>
        <div id="jobList" style="display:flex; flex-wrap:wrap; gap:10px; margin-top:15px;"></div>
    </div>

    <div class="glass-card">
        <div class="section-title">📝 寻访记录录入 (16环节)</div>
        <div class="form-grid">
            <div class="input-group"><label>推荐公司</label><input type="text" id="f1"></div>
            <div class="input-group"><label>推荐岗位</label><select id="f2"><option value="">请选择...</option></select></div>
            <div class="input-group"><label>姓名</label><input type="text" id="f3"></div>
            <div class="input-group"><label>性别</label><select id="f4"><option value="男">男</option><option value="女">女</option></select></div>
            <div class="input-group"><label>状态</label><select id="f5"><option value="正在联系中">正在联系中</option><option value="合适">合适</option><option value="不合适">不合适</option></select></div>
            <div class="input-group"><label>出生年份</label><select id="f6"></select></div>
            <div class="input-group"><label>岗位产品</label><input type="text" id="f7"></div>
            <div class="input-group"><label>目前所在地</label><input type="text" id="f8"></div>
            <div class="input-group"><label>期望所在地</label><input type="text" id="f9"></div>
            <div class="input-group"><label>现公司</label><input type="text" id="f10"></div>
            <div class="input-group"><label>电话/微信</label><input type="text" id="f11"></div>
            <div class="input-group"><label>邮箱</label><input type="text" id="f12"></div>
            <div class="input-group"><label>学历</label><select id="f13"><option value="本科">本科</option><option value="研究生">研究生</option><option value="博士">博士</option></select></div>
            <div class="input-group"><label>入学年份</label><input type="text" id="f14"></div>
            <div class="input-group"><label>学校</label><input type="text" id="f15"></div>
            <div class="input-group"><label>备注</label><input type="text" id="f16"></div>
        </div>
    </div>

    <div class="glass-card" style="padding:0; overflow:hidden;">
        <div class="table-container">
            <table>
                <thead>
                    <tr><th>姓名</th><th>状态</th><th>岗位</th><th>性别</th><th>出生年</th><th>现公司</th><th>所在地</th><th>联系方式</th><th>学历</th><th>学校</th><th>备注</th><th>管理</th></tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>
</div>

<div class="toolbar" id="iosToolbar" style="display:none">
    <button class="tool-btn primary" onclick="submitEntry()">存入名单</button>
    <button class="tool-btn" style="background:#34C759; color:white" onclick="exportData()">导出 Excel</button>
    <button class="tool-btn" onclick="location.reload()">退出登录</button>
</div>

<script>
    let dbKey = "";
    let data = [];
    let jobs = [];
    let chartInstances = {};

    function enterSystem() {
        const pass = document.getElementById('customPass').value;
        if (!pass) return;
        dbKey = "FLY_YUN_26_" + btoa(pass);
        
        // 登录动画
        document.getElementById('loginOverlay').style.transform = 'translateY(-100%)';
        setTimeout(() => {
            document.getElementById('appBody').style.display = 'block';
            document.getElementById('iosToolbar').style.display = 'flex';
            document.getElementById('userTag').innerText = "Personal Cloud: " + pass;
            init();
        }, 500);
    }

    function init() {
        // 初始化年份
        let yOpt = '<option value="">请选择...</option>';
        for(let y=1960; y<=2022; y++) yOpt += `<option value="${y}">${y}年</option>`;
        document.getElementById('f6').innerHTML = yOpt;

        // 加载数据
        data = JSON.parse(localStorage.getItem(dbKey) || "[]");
        jobs = JSON.parse(localStorage.getItem(dbKey + "_j") || "[]");
        
        renderJobs();
        renderTable();
        updateCharts();
    }

    function addJob() {
        const val = document.getElementById('jobName').value.trim();
        if(val && !jobs.includes(val)) {
            jobs.push(val);
            localStorage.setItem(dbKey + "_j", JSON.stringify(jobs));
            document.getElementById('jobName').value = "";
            renderJobs();
        }
    }

    function renderJobs() {
        document.getElementById('jobList').innerHTML = jobs.map(j => `<div style="background:rgba(0,0,0,0.05); padding:8px 15px; border-radius:12px; font-size:13px; font-weight:600;">${j}</div>`).join('');
        document.getElementById('f2').innerHTML = '<option value="">请选择...</option>' + jobs.map(j => `<option value="${j}">${j}</option>`).join('');
    }

    function submitEntry() {
        const entry = {
            id: Date.now(),
            f1: document.getElementById('f1').value, f2: document.getElementById('f2').value,
            f3: document.getElementById('f3').value, f4: document.getElementById('f4').value,
            f5: document.getElementById('f5').value, f6: document.getElementById('f6').value,
            f7: document.getElementById('f7').value, f8: document.getElementById('f8').value,
            f9: document.getElementById('f9').value, f10: document.getElementById('f10').value,
            f11: document.getElementById('f11').value, f12: document.getElementById('f12').value,
            f13: document.getElementById('f13').value, f14: document.getElementById('f14').value,
            f15: document.getElementById('f15').value, f16: document.getElementById('f16').value
        };
        if(!entry.f3) return alert("姓名是必须的");
        data.push(entry);
        localStorage.setItem(dbKey, JSON.stringify(data));
        renderTable();
        updateCharts();
        alert("已同步至云端");
    }

    function renderTable() {
        document.getElementById('tableBody').innerHTML = data.map(i => `
            <tr>
                <td><strong>${i.f3}</strong></td>
                <td><span class="badge status-${i.f5}">${i.f5}</span></td>
                <td>${i.f2}</td><td>${i.f4}</td><td>${i.f6}</td>
                <td>${i.f10}</td><td>${i.f8}</td><td>${i.f11}</td>
                <td>${i.f13}</td><td>${i.f15}</td><td>${i.f16}</td>
                <td><span style="color:#FF3B30; cursor:pointer; font-weight:700" onclick="remove(${i.id})">移除</span></td>
            </tr>
        `).join('');
    }

    function remove(id) {
        if(confirm("确定移除此记录?")) {
            data = data.filter(i => i.id !== id);
            localStorage.setItem(dbKey, JSON.stringify(data));
            renderTable();
            updateCharts();
        }
    }

    function updateCharts() {
        if(data.length === 0) return;
        const stats = { '合适':0, '不合适':0, '正在联系中':0 };
        const edus = { '本科':0, '研究生':0, '博士':0 };
        const jbs = {};
        data.forEach(i => { stats[i.f5]++; edus[i.f13]++; jbs[i.f2] = (jbs[i.f2] || 0) + 1; });

        draw('chart1', 'doughnut', Object.keys(stats), Object.values(stats), ['#28CD41','#FF3B30','#FF9500']);
        draw('chart2', 'bar', Object.keys(edus), Object.values(edus), '#007AFF');
        draw('chart3', 'bar', Object.keys(jbs), Object.values(jbs), '#AF52DE');
    }

    function draw(id, type, labels, vals, color) {
        if(chartInstances[id]) chartInstances[id].destroy();
        chartInstances[id] = new Chart(document.getElementById(id), {
            type: type,
            data: { labels, datasets: [{ data: vals, backgroundColor: color, borderRadius: 10, borderWidth: 0 }] },
            options: { cutout: '75%', plugins: { legend: { display: type === 'doughnut', position:'bottom' } }, scales: { y: { display: type !== 'doughnut' } } }
        });
    }

    function exportData() {
        const head = ["推荐公司", "岗位名称", "姓名", "性别", "状态", "出生年", "岗位产品", "目前所在地", "期望所在地", "现公司", "电话/微信", "邮箱", "学历", "入学年份", "学校", "备注"];
        const headerStyle = { fill: { fgColor: { rgb: "007AFF" } }, font: { color: { rgb: "FFFFFF" }, bold: true }, alignment: {horizontal:"center"} };
        const excelRows = [
            head.map(h => ({ v: h, s: headerStyle })),
            ...data.map(i => [i.f1, i.f2, i.f3, i.f4, i.f5, i.f6, i.f7, i.f8, i.f9, i.f10, i.f11, i.f12, i.f13, i.f14, i.f15, i.f16])
        ];
        const ws = XLSX.utils.aoa_to_sheet(excelRows);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "寻访结果");
        XLSX.writeFile(wb, "FLY_YUN_iOS26_Export.xlsx");
    }
</script>

</body>
</html>
