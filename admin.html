<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="robots" content="noindex,nofollow,noarchive">
<title>FLYUN · Studio Command Center</title>

<!-- 引入字体与图标 -->
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..900,0..100;1,9..144,300..900,0..100&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Noto+Serif+SC:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
:root{
  --bg:#0A0908; --surface:rgba(28,24,20,.55); --border:rgba(237,230,214,.08);
  --text:#EDE6D6; --accent:#FF4D2E; --ai-glow:#9d4edd; --danger:#ff5252;
  --serif:'Fraunces',serif; --sans:'Inter',sans-serif; --mono:'JetBrains Mono',monospace;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:var(--sans);background:var(--bg);color:var(--text);min-height:100vh;}
.shell{display:grid;grid-template-columns:260px 1fr;min-height:100vh;}
.sidebar{border-right:1px solid var(--border);padding:32px 0;background:rgba(13,11,9,.4);display:flex;flex-direction:column;}
.tab-btn{text-align:left;padding:12px 28px;background:transparent;border:none;color:var(--text);font-family:var(--mono);font-size:11px;cursor:pointer;display:flex;align-items:center;gap:12px;}
.tab-btn.active{color:var(--accent);border-left:2px solid var(--accent);background:rgba(255,77,46,.05);}
.main{padding:48px 56px;}
.card{padding:32px;border-radius:20px;background:var(--surface);border:1px solid var(--border);margin-bottom:24px;}
.panel-title{font-family:var(--serif);font-size:48px;font-weight:300;margin-bottom:32px;}
.panel-title em{color:var(--accent);font-style:italic;}
.writer-textarea{width:100%;min-height:300px;background:rgba(0,0,0,0.3);border:1px solid var(--border);color:var(--text);padding:20px;border-radius:12px;font-family:var(--serif);font-size:16px;}
.btn{height:48px;padding:0 24px;border-radius:12px;border:none;background:var(--accent);color:#fff;cursor:pointer;font-weight:600;}
.tab{display:none;} .tab.active{display:block;}
</style>
</head>
<body>

<div class="shell">
  <aside class="sidebar">
    <nav>
      <button class="tab-btn active" data-tab="dashboard"><i class="fas fa-chart-pie"></i>概览</button>
      <button class="tab-btn" data-tab="blog"><i class="fas fa-pen-nib"></i>写作室</button>
      <button class="tab-btn" data-tab="cases"><i class="fas fa-project-diagram"></i>案例</button>
      <button class="tab-btn" data-tab="images"><i class="fas fa-images"></i>图库</button>
      <button class="tab-btn" data-tab="system"><i class="fas fa-cloud"></i>系统与同步</button>
    </nav>
  </aside>

  <main class="main">
    <!-- 概览 -->
    <section class="tab active" data-tab="dashboard">
      <h2 class="panel-title">工作台 <em>Dashboard</em></h2>
      <div style="display:grid;grid-template-columns:repeat(3, 1fr);gap:24px;">
        <div class="card"><h3>文章总数</h3><p id="statPosts">0</p></div>
        <div class="card"><h3>案例总数</h3><p id="statCases">0</p></div>
        <div class="card"><h3>云端状态</h3><p>已连接</p></div>
      </div>
    </section>

    <!-- 写作室 (整合AI与编辑功能) -->
    <section class="tab" data-tab="blog">
      <h2 class="panel-title">写作室 <em>Journal</em></h2>
      <div class="card">
        <input type="text" class="title-input" id="postTitle" placeholder="文章标题..." style="width:100%;background:none;border:none;border-bottom:1px solid var(--border);color:white;font-size:24px;margin-bottom:20px;">
        <div class="editor-toolbar" style="margin-bottom:10px;">
            <button class="btn" style="height:30px;font-size:10px;" onclick="openImgPicker('postBody')">插入图片</button>
            <button class="btn" style="height:30px;font-size:10px;background:var(--ai-glow);" onclick="mockAIPolish('postBody')">AI 润色</button>
        </div>
        <textarea id="postBody" class="writer-textarea"></textarea>
        <button class="btn" style="margin-top:20px;" id="savePost">发布文章</button>
      </div>
      <div id="postList"></div>
    </section>

    <!-- 案例管理 -->
    <section class="tab" data-tab="cases">
        <h2 class="panel-title">案例管理 <em>Cases</em></h2>
        <div class="card">
            <input type="text" id="caseTitle" placeholder="案例名称..." style="width:100%;padding:10px;margin-bottom:10px;">
            <button class="btn" id="saveCase">保存案例</button>
        </div>
        <div id="caseList"></div>
    </section>

    <!-- 图库 -->
    <section class="tab" data-tab="images">
      <h2 class="panel-title">媒体库 <em>Media</em></h2>
      <div class="card">
        <input type="text" id="imgKey" placeholder="图片标识 (如 hero.bg)" style="width:100%;padding:10px;margin-bottom:10px;">
        <input type="file" id="imgFile" accept="image/*">
        <button class="btn" id="saveImg">上传并保存</button>
      </div>
      <div id="imgGrid" style="display:grid;grid-template-columns:repeat(4,1fr);gap:15px;"></div>
    </section>

    <!-- 系统 -->
    <section class="tab" data-tab="system">
        <h2 class="panel-title">系统 <em>System</em></h2>
        <button class="btn" id="exportBtn">导出 JSON 备份</button>
    </section>
  </main>
</div>

<!-- 脚本逻辑 (引入你的 assets/flyun-cms.js 后) -->
<script src="assets/flyun-cms.js"></script>
<script>
// Tab 切换逻辑
document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        btn.classList.add('active');
        document.querySelector(`[data-tab="${btn.dataset.tab}"]`).classList.add('active');
    });
});

// AI 工具模拟
function mockAIPolish(id) {
    const el = document.getElementById(id);
    el.value += "\n\n[✨ AI 润色中... 工业极简风格已应用]";
}

// 图片转Base64逻辑
document.getElementById('imgFile').addEventListener('change', function(e) {
    const reader = new FileReader();
    reader.onload = function(event) {
        document.getElementById('imgUrl').value = event.target.result;
    };
    reader.readAsDataURL(e.target.files[0]);
});

// 初始化
function init() {
    if(typeof FlyunCMS !== 'undefined') {
        document.getElementById('statPosts').innerText = FlyunCMS.getPosts().length;
        document.getElementById('statCases').innerText = FlyunCMS.getCases().length;
    }
}
init();
</script>
</body>
</html>
