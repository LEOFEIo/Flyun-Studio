<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>RecruitMaster AI - 猎头话术生产力工具</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 min-h-screen pb-10">

    <nav class="bg-slate-900 text-white p-4 mb-8 shadow-md">
        <div class="container mx-auto flex justify-between items-center">
            <span class="text-xl font-bold italic"><i class="fas fa-bolt text-yellow-400 mr-2"></i>RecruitMaster AI</span>
            <span class="text-xs opacity-60">专业猎头工作台 v1.1</span>
        </div>
    </nav>

    <div class="container mx-auto px-4 grid grid-cols-1 lg:grid-cols-12 gap-6">
        
        <div class="lg:col-span-5 space-y-4">
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                <h3 class="font-bold text-gray-700 mb-3 flex items-center">
                    <i class="fas fa-keyboard mr-2 text-blue-500"></i> 第一步：粘贴岗位 JD
                </h3>
                <textarea id="jdInput" class="w-full p-4 h-64 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm leading-relaxed" 
                    placeholder="请将公司的招聘要求粘贴在这里...&#10;例如：招聘Java开发，5年经验，熟悉Spring Cloud，坐标上海，薪资30-50K..."></textarea>
                
                <div class="mt-4">
                    <label class="block text-sm font-medium text-gray-600 mb-2">选择沟通目标</label>
                    <div class="grid grid-cols-3 gap-2">
                        <button onclick="setStyle('warm')" id="btn-warm" class="style-btn border p-2 rounded text-xs bg-blue-50 border-blue-500 text-blue-700">热情(微信)</button>
                        <button onclick="setStyle('pro')" id="btn-pro" class="style-btn border p-2 rounded text-xs bg-white text-gray-600 hover:bg-gray-50">专业(LinkedIn)</button>
                        <button onclick="setStyle('short')" id="btn-short" class="style-btn border p-2 rounded text-xs bg-white text-gray-600 hover:bg-gray-50">极简(短信)</button>
                    </div>
                </div>

                <button onclick="startGenerate()" class="w-full mt-6 bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg flex justify-center items-center gap-2 transition-all">
                    <i class="fas fa-magic"></i> 立即生成猎头话术
                </button>
            </div>
        </div>

        <div class="lg:col-span-7">
            <div id="loading" class="hidden flex flex-col items-center justify-center py-20 bg-white rounded-xl border border-dashed border-gray-300">
                <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600 mb-4"></div>
                <p class="text-gray-500 text-sm">AI 正在深度解析 JD 核心卖点...</p>
            </div>

            <div id="resultArea" class="hidden space-y-4">
                <div class="flex justify-between items-center">
                    <h3 class="font-bold text-gray-800">生成结果</h3>
                    <button onclick="copyAll()" class="text-blue-600 text-sm hover:underline"><i class="fas fa-copy"></i> 全部复制</button>
                </div>

                <div class="bg-white p-5 rounded-xl shadow-sm border-l-4 border-blue-500 group relative">
                    <div class="text-xs text-gray-400 mb-2 uppercase tracking-wider font-semibold">首轮沟通邀请 (Openings)</div>
                    <div id="output1" class="text-gray-700 text-sm leading-relaxed whitespace-pre-wrap"></div>
                    <button class="absolute top-4 right-4 text-gray-300 group-hover:text-blue-500 transition-colors"><i class="fas fa-clone"></i></button>
                </div>

                <div class="bg-white p-5 rounded-xl shadow-sm border-l-4 border-emerald-500 group relative">
                    <div class="text-xs text-gray-400 mb-2 uppercase tracking-wider font-semibold">职位核心卖点总结 (Pitch Points)</div>
                    <div id="output2" class="text-gray-700 text-sm leading-relaxed whitespace-pre-wrap"></div>
                </div>

                <div class="bg-slate-800 p-5 rounded-xl shadow-sm text-white">
                    <div class="text-xs text-slate-400 mb-2">推荐布尔搜索指令 (Boolean Search)</div>
                    <code id="booleanResult" class="text-yellow-400 text-xs break-all"></code>
                </div>
            </div>

            <div id="emptyState" class="flex flex-col items-center justify-center h-full min-h-[400px] bg-gray-50 rounded-xl border-2 border-dashed border-gray-200">
                <img src="https://cdn-icons-png.flaticon.com/512/2026/2026528.png" class="w-16 h-16 opacity-20 mb-4" alt="">
                <p class="text-gray-400 text-sm">暂无生成内容，请在左侧输入 JD</p>
            </div>
        </div>
    </div>

    <script>
        let currentStyle = 'warm';

        function setStyle(s) {
            currentStyle = s;
            document.querySelectorAll('.style-btn').forEach(btn => {
                btn.className = 'style-btn border p-2 rounded text-xs bg-white text-gray-600';
            });
            document.getElementById('btn-' + s).className = 'style-btn border p-2 rounded text-xs bg-blue-50 border-blue-500 text-blue-700';
        }

        function startGenerate() {
            const input = document.getElementById('jdInput').value;
            if(!input || input.length < 10) {
                alert("JD 太短了，请多提供一些职位信息以便 AI 分析！");
                return;
            }

            // UI 交互
            document.getElementById('emptyState').classList.add('hidden');
            document.getElementById('resultArea').classList.add('hidden');
            document.getElementById('loading').classList.remove('hidden');

            // 模拟 1秒 延迟
            setTimeout(() => {
                generateContent(input);
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('resultArea').classList.remove('hidden');
            }, 1000);
        }

        function generateContent(text) {
            // 1. 简单的关键词提取模拟
            const techKeywords = text.match(/[a-zA-Z]+/g) || ["关键技能"];
            const location = text.includes("上海") ? "上海" : (text.includes("北京") ? "北京" : "核心城市");
            const topSkill = techKeywords[0];

            // 2. 话术模板库
            const templates = {
                warm: `[候选人姓名] 您好，我是这边的猎头助手。关注到您在 ${topSkill} 领域的深厚积淀，目前有一家 ${location} 的明星企业正在物色核心人选。
这个岗位的核心亮点在于【技术自由度高+千万级项目实战】，薪资上浮空间非常可观 (30%+)。不知近期是否愿意花 2 分钟沟通下岗位详情？`,
                pro: `Dear [Name],
我是专注于 ${location} 市场的资深猎头。目前我司受客户委托，寻找一位优秀的【${topSkill} 专家】。
该机会隶属公司核心业务线，直接汇报给业务负责人。鉴于您在过往项目中展现出的技术领导力，我认为该机会与您的职业曲线高度契合。期待您的回复以获取详细 JD。`,
                short: `【急聘】${location} 知名企业招 ${topSkill}，50K+，期权激励，核心业务。有看新机会的想法吗？回复 1 详聊。`
            };

            // 3. 渲染结果
            document.getElementById('output1').innerText = templates[currentStyle];
            document.getElementById('output2').innerText = `1. 行业地位：对标行业头部企业，项目含金量高\n2. 薪酬结构：Base 高，包含 [年底双薪/年终奖] \n3. 团队氛围：扁平化管理，${topSkill} 技术氛围浓厚\n4. 地理优势：坐标 ${location} 核心地段。`;
            
            // 4. 生成布尔搜索
            const uniqueSkills = [...new Set(techKeywords)].slice(0, 3);
            document.getElementById('booleanResult').innerText = `("${uniqueSkills.join('" AND "')}") AND ("${location}") NOT "实习"`;
        }

        function copyAll() {
            const text = document.getElementById('output1').innerText;
            navigator.clipboard.writeText(text);
            alert("第一份话术已复制到剪贴板！");
        }
    </script>
</body>
</html>
