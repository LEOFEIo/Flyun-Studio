<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>飞云人才助手 - 专业猎头工作台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* 云朵 Logo 动画 */
        @keyframes cloudFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }
        .logo-cloud {
            animation: cloudFloat 3s ease-in-out infinite;
            background: linear-gradient(135deg, #3b82f6 0%, #6366f1 100%);
        }
        .card-active { border: 2px solid #3b82f6; background-color: #eff6ff; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">

    <header class="bg-white border-b px-6 py-4 flex justify-between items-center sticky top-0 z-50 shadow-sm">
        <div class="flex items-center gap-3">
            <div class="logo-cloud text-white p-2.5 rounded-xl shadow-lg flex items-center justify-center">
                <i class="fas fa-cloud text-xl"></i>
            </div>
            <div>
                <h1 class="text-2xl font-black tracking-tighter text-slate-800">
                    飞云<span class="text-blue-600 font-light ml-1">Flyun</span>
                </h1>
                <p class="text-[10px] text-gray-400 uppercase tracking-widest font-bold">Recruit Intelligence</p>
            </div>
        </div>
        
        <div class="hidden md:flex gap-6 items-center">
            <nav class="flex gap-4 text-sm font-medium text-gray-600">
                <a href="#" class="hover:text-blue-600 transition">话术生成</a>
                <a href="#" class="hover:text-blue-600 transition">简历中心</a>
                <a href="#" class="hover:text-blue-600 transition">人才寻访</a>
            </nav>
            <div class="h-6 w-[1px] bg-gray-200"></div>
            <button class="bg-gray-100 hover:bg-gray-200 p-2 rounded-full text-gray-600 transition">
                <i class="fas fa-bell"></i>
            </button>
        </div>
    </header>

    <main class="container mx-auto px-4 py-8 grid grid-cols-12 gap-8">
        <div class="col-span-12 lg:col-span-5 space-y-6">
            <div class="bg-white rounded-2xl shadow-sm p-6 border border-gray-100">
                <label class="block text-sm font-bold text-gray-700 mb-3">1. 粘贴岗位 JD</label>
                <textarea id="jdInput" class="w-full p-4 h-48 border border-gray-200 rounded-xl focus:ring-4 focus:ring-blue-100 outline-none text-sm transition-all" 
                    placeholder="例如：高级产品经理，负责飞云 App 的迭代..."></textarea>
                
                <div class="mt-4 grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-xs text-gray-400 block mb-1">目标人群</label>
                        <select id="targetUser" class="w-full p-2 border rounded-lg text-sm bg-gray-50">
                            <option value="tech">技术大牛</option>
                            <option value="manager">中高管</option>
                            <option value="junior">初级潜力股</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-xs text-gray-400 block mb-1">风格倾向</label>
                        <select id="industry" class="w-full p-2 border rounded-lg text-sm bg-gray-50">
                            <option value="internet">互联网/高燃</option>
                            <option value="finance">金融/稳重</option>
                        </select>
                    </div>
                </div>

                <button onclick="handleMagic()" class="w-full mt-6 bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-bold py-4 rounded-xl shadow-lg hover:shadow-blue-200 transition-all flex justify-center items-center gap-2">
                    <i class="fas fa-sparkles"></i> 飞云智造话术
                </button>
            </div>

            <div class="bg-white rounded-2xl shadow-sm p-6 border border-gray-100">
                <h3 class="font-bold text-gray-700 mb-4"><i class="fas fa-search-nodes mr-2 text-blue-500"></i>全网寻访指令</h3>
                <input id="mustHave" type="text" class="w-full p-3 border rounded-lg text-xs mb-3" placeholder="核心词: 如 Python">
                <div id="booleanOutput" class="p-3 bg-slate-900 text-emerald-400 text-[10px] font-mono rounded-lg break-all hidden"></div>
            </div>
        </div>

        <div class="col-span-12 lg:col-span-7">
            <div id="welcomeScreen" class="h-full min-h-[400px] flex flex-col items-center justify-center bg-white border border-gray-100 rounded-3xl">
                <div class="text-blue-100 text-7xl mb-4"><i class="fas fa-cloud-upload-alt"></i></div>
                <p class="text-gray-400">等待飞云指令生成...</p>
            </div>

            <div id="resultContainer" class="hidden space-y-6">
                <div class="bg-white p-6 rounded-2xl shadow-sm border-l-8 border-blue-500">
                    <div class="flex justify-between mb-4">
                        <span class="text-xs font-bold text-blue-600 uppercase">First Contact / 初次联系</span>
                        <button onclick="copy('iceBreaker')" class="text-gray-300 hover:text-blue-600"><i class="fas fa-copy"></i></button>
                    </div>
                    <p id="iceBreaker" class="text-gray-700 text-sm leading-relaxed"></p>
                </div>
            </div>
        </div>
    </main>

    <script>
        // ... (保持之前的 JS 逻辑不变) ...
        function handleMagic() {
            const jd = document.getElementById('jdInput').value;
            if(!jd) return alert("请输入 JD");
            document.getElementById('welcomeScreen').classList.add('hidden');
            document.getElementById('resultContainer').classList.remove('hidden');
            
            document.getElementById('iceBreaker').innerText = "【飞云人才推荐】您好，我是飞云咨询的顾问。关注到您在行业内的优秀表现，目前我们有个核心岗位与您的背景高度契合，想邀您进一步交流。";
            
            const must = document.getElementById('mustHave').value || "关键词";
            document.getElementById('booleanOutput').innerText = `site:linkedin.com "飞云" AND "${must}"`;
            document.getElementById('booleanOutput').classList.remove('hidden');
        }

        function copy(id) {
            const text = document.getElementById(id).innerText;
            navigator.clipboard.writeText(text);
            alert("飞云话术已复制！");
        }
    </script>
</body>
</html>
