<div class="bg-white rounded-2xl shadow-sm border p-6 mt-6">
    <h3 class="font-bold text-lg mb-4 flex items-center gap-2">
        <i class="fas fa-chart-radar text-blue-600"></i> 岗位情报站 (Baidu Insight)
    </h3>
    <div class="flex gap-3 mb-6">
        <input id="jobSearchInput" type="text" class="flex-1 p-3 border-2 border-slate-100 rounded-xl focus:border-blue-400 outline-none text-sm" placeholder="输入目标岗位，如：架构师、直播运营...">
        <button onclick="searchAndAnalyze()" class="bg-slate-800 hover:bg-black text-white px-6 py-3 rounded-xl font-bold transition flex items-center gap-2">
            <i class="fas fa-search"></i> 搜索并分析
        </button>
    </div>

    <div id="analysisResult" class="hidden border-t pt-4">
        <div class="flex items-center justify-between mb-4">
            <span class="text-xs font-bold text-slate-400">百度实时检索：<span id="targetJobName" class="text-blue-600"></span></span>
            <span class="text-[10px] bg-green-100 text-green-600 px-2 py-1 rounded">已提取最高频关键词</span>
        </div>
        
        <div class="flex flex-wrap gap-2 mb-4" id="keywordTags">
            </div>

        <div class="bg-blue-50 p-4 rounded-xl border border-blue-100">
            <p class="text-xs text-blue-800 leading-relaxed">
                <i class="fas fa-lightbulb mr-1"></i> <b>飞云建议：</b> 
                该岗位的候选人非常看重 <span id="topKeyword" class="font-bold underline"></span>。
                建议在话术中重点突出这方面的项目背景。
            </p>
        </div>
    </div>
</div>

<script>
    function searchAndAnalyze() {
        const job = document.getElementById('jobSearchInput').value;
        if (!job) return alert("请先输入岗位名称！");

        // 1. 模拟打开百度搜索（新标签页打开）
        // 这里的搜索词增加了“招聘要求”，能更精准地触发 JD 相关的搜索结果
        const baiduUrl = `https://www.baidu.com/s?wd=${encodeURIComponent(job + " 招聘要求 关键词")}`;
        window.open(baiduUrl, '_blank');

        // 2. 模拟分析逻辑（展示 UI）
        document.getElementById('analysisResult').classList.remove('hidden');
        document.getElementById('targetJobName').innerText = job;

        // 3. 根据岗位名称模拟“高频词”输出
        // 在实际开发中，这里可以对接后端爬虫或者大模型 API 进行实时分析
        const mockDatabase = {
            "Java": ["Spring Cloud", "高并发", "分布式架构", "微服务", "JVM调优"],
            "产品经理": ["用户增长", "数据分析", "原型设计", "竞品调研", "敏捷开发"],
            "销售": ["获客能力", "资源储备", "业绩达成", "商务谈判", "客情维护"],
            "default": ["核心技术", "项目经验", "团队管理", "沟通能力", "抗压性"]
        };

        const keywords = mockDatabase[job] || mockDatabase["default"];
        const tagContainer = document.getElementById('keywordTags');
        tagContainer.innerHTML = ''; // 清空旧标签

        keywords.forEach((word, index) => {
            const span = document.createElement('span');
            // 频率最高的词变大变亮
            const opacity = 1 - (index * 0.15);
            span.className = `px-3 py-1 bg-blue-600 text-white text-xs rounded-full shadow-sm`;
            span.style.opacity = opacity;
            span.innerHTML = `<i class="fas fa-fire-alt mr-1 text-orange-300"></i> ${word}`;
            tagContainer.appendChild(span);
        });

        document.getElementById('topKeyword').innerText = keywords[0];
    }
</script>
