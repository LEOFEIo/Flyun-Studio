<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RecruitMaster - 猎头全能助手</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .glass-morphism {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(226, 232, 240, 1);
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans text-slate-900">

    <nav class="bg-indigo-700 text-white p-4 shadow-lg">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold flex items-center">
                <i class="fas fa-rocket-launch mr-2"></i> RecruitMaster AI
            </h1>
            <div class="space-x-6 text-sm">
                <a href="#" class="hover:text-indigo-200">话术库</a>
                <a href="#" class="hover:text-indigo-200">人才搜索</a>
                <a href="#" class="hover:text-indigo-200">简历解析</a>
            </div>
        </div>
    </nav>

    <main class="container mx-auto py-8 px-4 grid grid-cols-1 lg:grid-cols-12 gap-8">
        
        <div class="lg:col-span-4 space-y-6">
            <section class="glass-morphism rounded-xl p-6 shadow-sm">
                <h2 class="text-lg font-semibold mb-4 flex items-center text-indigo-700">
                    <i class="fas fa-file-alt mr-2"></i> 岗位信息 (JD)
                </h2>
                <textarea id="jdInput" rows="8" class="w-full p-3 border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm" placeholder="在此粘贴原始岗位描述..."></textarea>
                
                <div class="mt-4 space-y-3">
                    <label class="block text-sm font-medium">沟通风格</label>
                    <select id="styleSelect" class="w-full p-2 bg-white border border-slate-200 rounded-md text-sm">
                        <option>专业干练版 (LinkedIn/邮件)</option>
                        <option>热情亲和版 (微信/IM)</option>
                        <option>极简效率版 (短信/Cold Call)</option>
                    </select>
                </div>

                <button onclick="generateScript()" class="w-full mt-6 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-lg transition duration-200 shadow-md">
                    一键生成话术
                </button>
            </section>

            <section class="glass-morphism rounded-xl p-6 shadow-sm border-t-4 border-emerald-500">
                <h2 class="text-lg font-semibold mb-4 text-emerald-700 flex items-center">
                    <i class="fas fa-search mr-2"></i> 布尔搜索转换器
                </h2>
                <input id="keywords" type="text" class="w-full p-2 border border-slate-200 rounded-md text-sm mb-3" placeholder="关键词(逗号分隔)，如：Java, 架构, 自动驾驶">
                <button onclick="generateBoolean()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white text-sm py-2 rounded-md transition">
                    生成 Boolean 语句
                </button>
                <div id="booleanResult" class="mt-3 p-3 bg-slate-100 rounded text-xs font-mono break-all hidden"></div>
            </section>
        </div>

        <div class="lg:col-span-8 space-y-6">
            
            <div id="resultContainer" class="hidden space-y-4">
                <div class="flex justify-between items-center px-2">
                    <h3 class="font-bold text-slate-700">生成的话术方案</h3>
                    <span class="text-xs text-slate-500 italic">内容已根据行业痛点优化</span>
                </div>

                <div class="glass-morphism rounded-xl p-6 shadow-sm border-l-4 border-indigo-500 relative group">
                    <div class="absolute top-4 right-4 space-x-2">
                        <button class="text-slate-400 hover:text-indigo-600"><i class="fas fa-copy"></i></button>
                    </div>
                    <span class="inline-block bg-indigo-100 text-indigo-700 text-xs px-2 py-1 rounded mb-3">微信/IM 场景</span>
                    <p id="scriptText1" class="text-slate-700 leading-relaxed">
                        [候选人姓名] 您好，看到您在 [公司名] 负责 [业务模块] 的经验非常契合。我们目前有个 [职级] 的机会，对标业界核心团队，业务正处于快速增长期，不知您是否有兴趣聊聊更广阔的平台？
                    </p>
                </div>

                <div class="glass-morphism rounded-xl p-6 shadow-sm border-l-4 border-orange-500 relative group">
                    <span class="inline-block bg-orange-100 text-orange-700 text-xs px-2 py-1 rounded mb-3">高管/正式邀约</span>
                    <p id="scriptText2" class="text-slate-700 leading-relaxed italic">
                        “这里的核心卖点将自动替换为：技术前瞻性、决策权重、全球化布局...”
                    </p>
                </div>
            </div>

            <div id="emptyState" class="flex flex-col items-center justify-center h-64 border-2 border-dashed border-slate-200 rounded-xl bg-white opacity-50">
                <i class="fas fa-magic text-4xl mb-4 text-slate-300"></i>
                <p class="text-slate-500">输入 JD 并点击生成，解锁高效沟通</p>
            </div>

        </div>
    </main>

    <script>
        // 模拟话术生成逻辑
        function generateScript() {
            const jd = document.getElementById('jdInput').value;
            if(!jd) {
                alert("请先输入岗位描述(
