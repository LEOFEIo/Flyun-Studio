<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FLY YUN - 猎头专家数智化空间</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --ios-accent: #007AFF;
            --ios-red: #FF3B30;
            --ios-bg: #F2F2F7;
            --radius-max: 30px;
        }

        body, html {
            margin: 0; padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", sans-serif;
            background: #F2F2F7;
            -webkit-font-smoothing: antialiased;
        }

        /* --- iOS 26 流光背景 --- */
        .liquid-bg {
            position: fixed; inset: 0;
            background: linear-gradient(120deg, #dbeafe 0%, #fdfbfb 100%);
            z-index: -1;
        }

        /* --- 空间登录 UI --- */
        #loginOverlay {
            position: fixed; inset: 0; display: flex; justify-content: center; align-items: center;
            z-index: 10000; backdrop-filter: blur(30px); background: rgba(255,255,255,0.1);
            transition: 0.8s ease;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.4); backdrop-filter: blur(50px) saturate(200%);
            border: 1px solid rgba(255, 255, 255, 0.5); border-radius: 50px;
            padding: 50px 40px; width: 340px; text-align: center;
            box-shadow: 0 40px 100px rgba(0,0,0,0.05);
        }
        .login-card h1 { font-size: 42px; font-weight: 900; margin: 0; letter-spacing: -2px; color: #1d1d1f; }
        .login-card p { font-size: 14px; color: #6e6e73; margin: 10px 0 35px; line-height: 1.5; }

        .pass-input {
            width: 100%; padding: 18px; border-radius: 20px; border: none;
            background: rgba(255, 255, 255, 0.6); font-size: 18px; font-weight: 600;
            text-align: center; outline: none; transition: 0.3s; box-sizing: border-box;
        }
        .btn-enter {
            width: 100%; padding: 18px; border-radius: 20px; border: none;
            background: #1d1d1f; color: white; font-weight: 700; margin-top: 20px;
            cursor: pointer; transition: 0.3s;
        }

        /* --- 主界面布局 --- */
        .app-shell { max-width: 1400px; margin: 0 auto; padding: 30px 20px 120px; display: none; }
        .ios-card {
            background: rgba(255, 255, 255, 0.65); backdrop-filter: blur(25px);
            border-radius: var(--radius-max); padding: 25px; margin-bottom: 25px;
            border: 1px solid rgba(255,255,255,0.7); box-shadow: 0 10px 30px rgba(0,0,0,0.02);
        }

        /* 搜索雷达模块 */
        .radar-box { background: linear-gradient(135deg, rgba(0,122,255,0.05), rgba(255,255,255,0.5)); }
        .radar-grid { display: flex; gap: 10px; margin-top: 15px; }

        /* 看板分析图表 */
        .dashboard-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 25px; }
        @media (max-width: 900px) { .dashboard-row { grid-template-columns: 1fr; } }
        .chart-wrap { height: 200px; }

        /* Mapping联动管理 */
        .mgmt-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media (max-width: 768px) { .mgmt-row { grid-template-columns: 1fr; } }
        .node { background: rgba(0,0,0,0.03); border-radius: 20px; padding: 15px; margin-bottom: 15px; }
        .tag { display: inline-flex; align-items: center; background: white; padding: 5px 12px; border-radius: 10px; font-size: 12px; font-weight: 600; margin: 4px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }

        /* 寻访录入表单 */
        .form-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
        @media (max-width: 768px) { .form-grid { grid-template-columns: 1fr; } }
        .field { display: flex; flex-direction: column; }
        .field label { font-size: 11px; font-weight: 700; color: #8E8E93; margin-bottom: 4px; margin-left: 8px; }
        .field input, .field select { padding: 12px; border-radius: 14px; border: 1px solid rgba(0,0,0,0.08); background: white; font-size: 15px; outline: none; }

        /* 综合搜索区 */
        .search-area { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 15px; }
        .input-with-btn { display: flex; gap: 5px; }
        .btn-ios { background: var(--ios-accent); color: white; border: none; border-radius: 12px; padding: 8px 15px; font-weight: 600; cursor: pointer; }

        /* 资历计算结果样式 */
        .age-text { display: block; font-size: 11px; color: var(--ios-accent); font-weight: 800; margin-top: 2px; }

        /* 底部操作 Dock */
        .dock {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: rgba(255,255,255,0.8); backdrop-filter: blur(35px);
            padding: 12px 25px; border-radius: 35px; display: flex; gap: 15px;
            border: 1px solid rgba(255,255,255,0.5); box-shadow: 0 20px 50px rgba(0,0,0,0.1); z-index: 999;
        }
        .badge { padding: 4px 10px; border-radius: 8px; font-size: 11px; font-weight: 700; }
        .badge-合适 { background: #D2F9D8; color: #1E6726; }
        .badge-不合适 { background: #FFE5E5; color: #D32F2F; }
        .badge-正在联系中 { background: #FFF4D2; color: #8A6D1F; }
    </style>
</head>
<body>

<div class="liquid-bg"></div>

<div id="loginOverlay">
    <div class="login-card">
        <h1>FLY YUN</h1>
        <p>生成您自己的存储空间<br><span style="opacity: 0.6;">输入密码后自动创建私有加密空间</span></p>
        <input type="password" id="sysPass" class="pass-input" placeholder="输入访问密码" onkeydown="if(event.keyCode==13) login()">
        <button class="btn-enter" onclick="login()">进入空间</button>
    </div>
</div>

<div class="app-shell" id="app">
    <header style="margin-bottom: 30px; padding: 0 10px;">
        <h2 style="font-size: 32px; font-weight: 900; letter-spacing: -2px; margin: 0;">FLY YUN</h2>
        <div id="userTag" style="color: #8E8E93; font-size: 12px; margin-top: 5px;"></div>
    </header>

    <div class="ios-card radar-box">
        <div style="font-size: 15px; font-weight: 800; color: var(--ios-accent);">🔍 全网人才穿透雷达</div>
        <div class="radar-grid">
            <input type="text" id="radarKw" class="field" style="flex:1; border:none; padding:15px; border-radius:15px; font-size:15px;" placeholder="搜公司 + 岗位 (如: 腾讯 架构师)">
            <button class="btn-ios" onclick="radar('boss')">搜BOSS</button>
            <button class="btn-ios" onclick="radar('liepin')">搜猎聘</button>
            <button class="btn-ios" style="background:#000" onclick="radar('google')">搜全网</button>
        </div>
    </div>

    <div class="dashboard-row">
        <div class="ios-card"><div class="chart-wrap"><canvas id="c1"></canvas></div></div>
        <div class="ios-card"><div class="chart-wrap"><canvas id="c2"></canvas></div></div>
        <div class="ios-card"><div class="chart-wrap"><canvas id="c3"></canvas></div></div>
    </div>

    <div class="ios-card">
        <div class="mgmt-row">
            <div>
                <div style="font-size: 14px; font-weight: 700; margin-bottom: 12px;">🏢 客户管理</div>
                <div style="display:flex; gap:8px;">
                    <input type="text" id="newC" style="flex:1; padding:10px; border-radius:12px; border:1px solid #ddd;" placeholder="客户名称...">
                    <button class="btn-ios" onclick="addC()">添加</button>
                </div>
            </div>
            <div>
                <div style="font-size: 14px; font-weight: 700; margin-bottom: 12px;">💼 岗位 Mapping</div>
                <div style="display:flex; gap:8px;">
                    <select id="selC" style="flex:1; padding:10px; border-radius:12px; border:1px solid #ddd;"></select>
                    <input type="text" id="newJ" style="flex:1; padding:10px; border-radius:12px; border:1px solid #ddd;" placeholder="岗位名称...">
                    <button class="btn-ios" onclick="addJ()">添加</button>
                </div>
            </div>
        </div>
        <div id="tree" style="margin-top:20px;"></div>
    </div>

    <div class="ios-card">
        <div style="font-size: 15px; font-weight: 700; margin-bottom: 20px;">📝 16环节专家级寻访录入</div>
        <div class="form-grid">
            <div class="field"><label>1. 推荐公司</label><select id="f1" onchange="syncJ()"></select></div>
            <div class="field"><label>2. 推荐岗位</label><select id="f2"></select></div>
            <div class="field"><label>3. 姓名</label><input type="text" id="f3"></div>
            <div class="field"><label>4. 性别</label><select id="f4"><option>男</option><option>女</option></select></div>
            <div class="field"><label>5. 状态</label><select id="f5"><option>正在联系中</option><option>合适</option><option>不合适</option></select></div>
            <div class="field"><label>6. 出生年份</label><select id="f6"></select></div>
            <div class="field"><label>7. 岗位产品</label><input type="text" id="f7"></div>
            <div class="field"><label>8. 目前所在地</label><input type="text" id="f8"></div>
            <div class="field"><label>9. 期望所在地</label><input type="text" id="f9"></div>
            <div class="field"><label>10. 现公司</label><input type="text" id="f10"></div>
            <div class="field"><label>11. 电话/微信</label><input type="text" id="f11"></div>
            <div class="field"><label>12. 邮箱</label><input type="text" id="f12"></div>
            <div class="field"><label>13. 学历</label><select id="f13"><option>大专</option><option>本科</option><option>研究生</option><option>博士</option></select></div>
            <div class="field"><label>14. 入学年份</label><select id="f14"></select></div>
            <div class="field"><label>15. 学校</label><input type="text" id="f15"></div>
            <div class="field"><label>16. 备注</label><input type="text" id="f16"></div>
        </div>
    </div>

    <div class="ios-card" style="padding:0; overflow:hidden;">
        <div style="padding: 25px;">
            <div style="font-size: 15px; font-weight: 800; margin-bottom: 15px;">🔍 人才 Mapping 检索</div>
            <div class="search-area">
                <div class="field"><label>人选姓名</label><div class="input-with-btn"><input type="text" id="sN" style="flex:1; border:1px solid #ddd; border-radius:10px; padding:8px;"><button class="btn-ios" onclick="renderTable()">搜人</button></div></div>
                <div class="field"><label>所属客户</label><div class="input-with-btn"><input type="text" id="sC" style="flex:1; border:1px solid #ddd; border-radius:10px; padding:8px;"><button class="btn-ios" onclick="renderTable()">搜客户</button></div></div>
                <div class="field"><label>寻访岗位</label><div class="input-with-btn"><input type="text" id="sJ" style="flex:1; border:1px solid #ddd; border-radius:10px; padding:8px;"><button class="btn-ios" onclick="renderTable()">搜岗位</button></div></div>
            </div>
        </div>
        <div style="overflow-x:auto;">
            <table style="width:100%; border-collapse:collapse; min-width:1400px;">
                <thead>
                    <tr style="background:rgba(0,0,0,0.02);">
                        <th style="padding:15px; text-align:left; font-size:12px; color:#8e8e93;">人选姓名</th>
                        <th style="text-align:left; font-size:12px; color:#8e8e93;">当前状态</th>
                        <th style="text-align:left; font-size:12px; color:#8e8e93;">所属 Mapping 公司/岗位</th>
                        <th style="text-align:left; font-size:12px; color:#8e8e93;">出生年/年龄</th>
                        <th style="text-align:left; font-size:12px; color:#8e8e93;">学历/资历</th>
                        <th style="text-align:left; font-size:12px; color:#8e8e93;">管理操作</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>
</div>

<div class="dock" id="dock" style="display:none">
    <button class="btn-ios" onclick="save()">✅ 存入名单</button>
    <button class="btn-ios" style="background:#34C759" onclick="exportXls()">📊 导出表格</button>
    <button class="btn-ios" style="background:#E5E5EA; color:#000" onclick="location.reload()">🔒 退出空间</button>
</div>

<script>
    let dbKey = ""; let data = []; let tree = {}; let charts = {};
    const curY = new Date().getFullYear();

    function login() {
        const p = document.getElementById('sysPass').value; if(!p) return;
        dbKey = "FLY_YUN_EXPERT_V1_" + btoa(p);
        document.getElementById('loginOverlay').style.opacity = '0';
        setTimeout(() => {
            document.getElementById('loginOverlay').style.display='none';
            document.getElementById('app').style.display='block';
            document.getElementById('dock').style.display='flex';
            document.getElementById('userTag').innerText = "已进入私有空间: " + p;
            init();
        }, 500);
    }

    function init() {
        let y6 = '<option value="">出生年份</option>'; for(let i=1960; i<=2022; i++) y6 += `<option value="${i}">${i}</option>`; document.getElementById('f6').innerHTML = y6;
        let y14 = '<option value="">入学年份</option>'; for(let i=1900; i<=2024; i++) y14 += `<option value="${i}">${i}</option>`; document.getElementById('f14').innerHTML = y14;
        data = JSON.parse(localStorage.getItem(dbKey) || "[]");
        tree = JSON.parse(localStorage.getItem(dbKey + "_t") || "{}");
        refreshMgmt(); renderTable(); updateCharts();
    }

    function radar(p) {
        const kw = document.getElementById('radarKw').value; if(!kw) return alert("输入关键词");
        let url = "";
        if(p === 'boss') url = `https://www.google.com/search?q=site:zhipin.com ${kw}`;
        if(p === 'liepin') url = `https://www.liepin.com/zhaopin/?key=${kw}`;
        if(p === 'google') url = `https://www.google.com/search?q=("简历" OR "resume") ${kw} -inurl:jobs`;
        window.open(url, '_blank');
    }

    function addC() { const v = document.getElementById('newC').value.trim(); if(v && !tree[v]) { tree[v] = []; saveT(); document.getElementById('newC').value = ""; refreshMgmt(); } }
    function addJ() { const c = document.getElementById('selC').value; const j = document.getElementById('newJ').value.trim(); if(c && j && !tree[c].includes(j)) { tree[c].push(j); saveT(); document.getElementById('newJ').value = ""; refreshMgmt(); } }
    function saveT() { localStorage.setItem(dbKey + "_t", JSON.stringify(tree)); }
    function delC(c) { if(confirm("删除公司？")) { delete tree[c]; saveT(); refreshMgmt(); } }

    function refreshMgmt() {
        document.getElementById('tree').innerHTML = Object.keys(tree).map(c => `
            <div class="node"><div style="font-weight:800; display:flex; justify-content:space-between;">${c}<span style="color:red;cursor:pointer" onclick="delC('${c}')">移除</span></div>
                <div style="margin-top:8px;">${tree[c].map(j => `<span class="tag">${j}</span>`).join('')}</div>
            </div>
        `).join('');
        const opt = '<option value="">-- 选择公司 --</option>' + Object.keys(tree).map(c => `<option value="${c}">${c}</option>`).join('');
        document.getElementById('selC').innerHTML = opt; document.getElementById('f1').innerHTML = opt;
        syncJ();
    }

    function syncJ() {
        const c = document.getElementById('f1').value;
        document.getElementById('f2').innerHTML = (c && tree[c]) ? '<option value="">-- 选择岗位 --</option>' + tree[c].map(j => `<option value="${j}">${j}</option>`).join('') : '<option value="">先选公司</option>';
    }

    function save() {
        const r = { id: Date.now() }; for(let i=1; i<=16; i++) r['f'+i] = document.getElementById('f'+i).value;
        if(!r.f3 || !r.f1 || !r.f2) return alert("姓名、客户及岗位是核心");
        data.push(r); localStorage.setItem(dbKey, JSON.stringify(data));
        renderTable(); updateCharts(); alert("已 Mapping 到云端");
    }

    function renderTable() {
        const n = document.getElementById('sN').value.toLowerCase();
        const c = document.getElementById('sC').value.toLowerCase();
        const j = document.getElementById('sJ').value.toLowerCase();
        const fil = data.filter(i => i.f3.toLowerCase().includes(n) && i.f1.toLowerCase().includes(c) && i.f2.toLowerCase().includes(j));
        
        document.getElementById('tableBody').innerHTML = fil.map(i => {
            const age = i.f6 ? (curY - i.f6) : "-";
            const exp = i.f14 ? (curY - i.f14) : "-";
            return `
                <tr style="border-bottom:1px solid rgba(0,0,0,0.03);">
                    <td style="padding:15px;"><strong>${i.f3}</strong></td>
                    <td><span class="badge badge-${i.f5}">${i.f5}</span></td>
                    <td><div style="font-weight:700">${i.f1}</div><div style="font-size:12px; color:#8E8E93">${i.f2}</div></td>
                    <td>${i.f6 || "-"}<span class="age-text">${age != "-" ? age + " 岁" : ""}</span></td>
                    <td>${i.f13}<span class="age-text">${exp != "-" ? "资历 " + exp + " 年" : ""}</span></td>
                    <td><span style="color:red; cursor:pointer; font-weight:700;" onclick="del(${i.id})">移除</span></td>
                </tr>
            `;
        }).join('');
    }

    function del(id) { if(confirm("移除记录?")) { data = data.filter(x => x.id !== id); localStorage.setItem(dbKey, JSON.stringify(data)); renderTable(); updateCharts(); } }

    function updateCharts() {
        if(data.length === 0) return;
        const s = {'合适':0,'不合适':0,'正在联系中':0}, e = {'大专':0,'本科':0,'研究生':0,'博士':0}, jb = {};
        data.forEach(i => { s[i.f5]++; e[i.f13]++; jb[i.f1] = (jb[i.f1] || 0) + 1; });
        draw('c1', 'doughnut', Object.keys(s), Object.values(s), ['#34C759','#FF3B30','#FF9500'], true);
        draw('c2', 'bar', Object.keys(e), Object.values(e), '#007AFF', false);
        draw('c3', 'bar', Object.keys(jb), Object.values(jb), '#AF52DE', false);
    }

    function draw(id, type, labels, d, colors, isD) {
        if(charts[id]) charts[id].destroy();
        charts[id] = new Chart(document.getElementById(id), {
            type: type,
            data: { labels, datasets: [{ data: d, backgroundColor: colors, borderRadius: isD ? 0 : 10 }] },
            options: { maintainAspectRatio:false, cutout: isD ? '75%' : 0, plugins:{ legend:{ display:isD, position:'bottom', labels:{ boxWidth:10, font:{size:10} } } }, scales:{ y:{ display:!isD, beginAtZero:true, ticks:{stepSize:1} }, x:{ display:!isD } } }
        });
    }

    function exportXls() {
        const h = ["客户", "岗位", "姓名", "性别", "状态", "出生年", "年龄", "产品", "所在地", "期望地", "现公司", "联系方式", "邮箱", "学历", "入学年", "资历", "学校", "备注"];
        const s = { fill: { fgColor: { rgb: "007AFF" } }, font: { color: { rgb: "FFFFFF" }, bold: true }, alignment: {horizontal:"center"} };
        const rows = [ h.map(x => ({v:x, s:s})), ...data.map(i => [i.f1, i.f2, i.f3, i.f4, i.f5, i.f6, i.f6?(curY-i.f6):"", i.f7, i.f8, i.f9, i.f10, i.f11, i.f12, i.f13, i.f14, i.f14?(curY-i.f14):"", i.f15, i.f16]) ];
        const ws = XLSX.utils.aoa_to_sheet(rows);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "人才寻访报表");
        XLSX.writeFile(wb, "FLY_YUN_Expert_Report.xlsx");
    }
</script>
</body>
</html>
