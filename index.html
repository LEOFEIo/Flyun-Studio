<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FLYUN STUDIO // Chronos Warp v2.1</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syncopate:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --cyan: #00F3FF; --purple: #BD00FF; --black: #000; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        /* 允许手机端滚动查看业务板块 */
        body { 
            background-color: var(--black); 
            color: white; 
            font-family: 'Space Mono', monospace; 
            overflow-x: hidden; 
            background: #000;
        }

        canvas { position: fixed; top: 0; left: 0; z-index: 1; pointer-events: none; }
        .vignette { position: fixed; inset: 0; background: radial-gradient(circle at center, transparent 0%, rgba(0,0,0,0.9) 100%); z-index: 2; pointer-events: none; }

        /* 导航栏：适配移动端间距 */
        nav { 
            position: fixed; top: 0; width: 100%; padding: 20px 30px; 
            display: flex; justify-content: space-between; align-items: center; 
            z-index: 100; backdrop-filter: blur(10px);
        }
        .logo { font-family: 'Syncopate', sans-serif; color: var(--cyan); letter-spacing: 3px; font-size: 12px; text-decoration: none; }
        .nav-links a { color: white; text-decoration: none; margin-left: 15px; font-size: 9px; letter-spacing: 2px; text-transform: uppercase; opacity: 0.6; cursor: pointer; }

        /* 主视图：手机端取消固定高度，改为最小高度 */
        #viewport { 
            position: relative; z-index: 10; 
            min-height: 100vh; 
            display: flex; flex-direction: column; justify-content: center; align-items: center; 
            perspective: 2000px; transition: 0.8s ease;
            padding: 100px 20px; /* 顶部留出导航位置 */
        }

        .main-title { 
            font-family: 'Syncopate', sans-serif; 
            font-size: 8vw; 
            letter-spacing: 10px; 
            color: white; 
            margin-bottom: 40px; 
            text-align: center; 
        }

        /* 核心业务板块：手机端自动纵向堆叠 */
        .module-container { 
            display: flex; 
            gap: 20px; 
            transform-style: preserve-3d;
            flex-wrap: wrap; /* 关键：允许折行 */
            justify-content: center;
            width: 100%;
        }

        .module-box { 
            width: 280px; 
            padding: 30px; 
            background: rgba(255, 255, 255, 0.03); 
            border: 1px solid rgba(0, 243, 255, 0.15); 
            backdrop-filter: blur(15px); 
            transition: 0.5s cubic-bezier(0.2, 0.8, 0.2, 1); 
            cursor: pointer; text-decoration: none; color: white;
        }

        /* 手机端取消 3D 旋转动画以保证兼容性 */
        @media (min-width: 769px) {
            .module-box:hover { border-color: var(--cyan); background: rgba(0, 243, 255, 0.08); transform: translateZ(100px); box-shadow: 0 0 50px rgba(0, 243, 255, 0.2); }
        }

        @media (max-width: 768px) {
            .main-title { font-size: 12vw; margin-bottom: 30px; }
            .module-box { width: 100%; max-width: 340px; } /* 手机端宽度占满 */
            .nav-links a { margin-left: 10px; font-size: 8px; }
        }

        .module-header { font-size: 9px; color: var(--purple); letter-spacing: 2px; margin-bottom: 10px; border-bottom: 1px solid rgba(189, 0, 255, 0.3); display: inline-block; }
        .module-box h2 { font-size: 14px; letter-spacing: 2px; margin-bottom: 10px; }
        .module-box p { font-size: 11px; line-height: 1.6; color: rgba(255,255,255,0.4); }

        /* 白皮书：全屏适配 */
        #whitepaper-view { 
            position: fixed; inset: 0; z-index: 200; background: rgba(0,0,0,0.98); 
            padding: 80px 5%; transform: translateY(100%); transition: 0.8s cubic-bezier(0.19, 1, 0.22, 1); overflow-y: auto; 
        }
        #whitepaper-view.active { transform: translateY(0); }
        .paper-content { max-width: 800px; margin: 0 auto; border-left: 2px solid var(--cyan); padding-left: 20px; }
        .paper-title { font-size: 24px; color: var(--cyan); margin-bottom: 30px; font-family: 'Syncopate'; }
        .paper-section { margin-bottom: 30px; font-size: 13px; line-height: 1.8; color: #ccc; }
        .close-btn { position: fixed; top: 20px; right: 20px; color: var(--cyan); border: 1px solid var(--cyan); padding: 8px 15px; cursor: pointer; font-size: 10px; z-index: 201; background: #000; }

        .hud-bottom { width: 100%; margin-top: 50px; font-size: 8px; color: rgba(0, 243, 255, 0.3); letter-spacing: 1px; text-align: center; }
