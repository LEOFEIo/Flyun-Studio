    <script>
        const canvas = document.getElementById('warpCanvas');
        const ctx = canvas.getContext('2d');
        let stars = [];
        let speed = 2;
        let mouseX = 0, mouseY = 0;

        window.onresize = () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; };
        window.onresize();

        class Star {
            constructor() { this.reset(); this.z = Math.random() * canvas.width; }
            reset() { this.x = (Math.random() - 0.5) * canvas.width; this.y = (Math.random() - 0.5) * canvas.height; this.z = canvas.width; this.pz = this.z; }
            update() {
                this.pz = this.z;
                this.z -= speed;
                if (this.z < 1) this.reset();
            }
            show() {
                ctx.strokeStyle = '#00F3FF';
                let sx = (this.x / this.z) * canvas.width + canvas.width/2;
                let sy = (this.y / this.z) * canvas.height + canvas.height/2;
                let px = (this.x / this.pz) * canvas.width + canvas.width/2;
                let py = (this.y / this.pz) * canvas.height + canvas.height/2;
                ctx.beginPath(); ctx.lineWidth = (1 - this.z / canvas.width) * 3;
                ctx.moveTo(px, py); ctx.lineTo(sx, sy); ctx.stroke();
            }
        }

        for (let i = 0; i < 600; i++) stars.push(new Star());

        function draw() {
            ctx.fillStyle = '#000'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.save();
            ctx.translate(mouseX * 0.1, mouseY * 0.1);
            stars.forEach(s => { s.update(); s.show(); });
            ctx.restore();
            requestAnimationFrame(draw);
        }
        draw();

        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX - canvas.width / 2;
            mouseY = e.clientY - canvas.height / 2;
            if(!document.getElementById('whitepaper-view').classList.contains('active')) {
                speed = 2 + (Math.abs(mouseX) + Math.abs(mouseY)) / 150;
            }
            const boxes = document.querySelectorAll('.module-box');
            boxes.forEach(box => {
                const depth = box.getAttribute('data-depth');
                const rx = (e.clientY - window.innerHeight/2) * -0.05 * depth;
                const ry = (e.clientX - window.innerWidth/2) * 0.05 * depth;
                box.style.transform = `rotateX(${rx}deg) rotateY(${ry}deg) translateZ(${depth * 50}px)`;
            });
        });

        function togglePaper() {
            const paper = document.getElementById('whitepaper-view');
            const viewport = document.getElementById('viewport');
            paper.classList.toggle('active');
            if(paper.classList.contains('active')) {
                viewport.style.opacity = '0.1';
                viewport.style.transform = 'scale(0.9) translateZ(-500px)';
                speed = 0.5;
            } else {
                viewport.style.opacity = '1';
                viewport.style.transform = 'scale(1) translateZ(0)';
                speed = 2;
            }
        }
    </script>
