<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>飞云数据看板 · FLY YUN Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --apple-blue: #007AFF;
            --apple-gray: #F5F5F7;
            --apple-text: #1D1D1F;
            --apple-sub: #6E6E73;
            --radius-xl: 32px;
            --glass: rgba(255, 255, 255, 0.72);
            --glass-saturate: blur(40px) saturate(210%);
        }

        body, html {
            margin: 0; padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", sans-serif;
            background-color: #FFFFFF;
            color: var(--apple-text);
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        /* --- iOS 26 Vision Fluid 背景 --- */
        .vision-bg {
            position: fixed; inset: 0; z-index: -1;
            background: radial-gradient(at 0% 0%, #f0f7ff 0%, transparent 50%),
                        radial-gradient(at 100% 0%, #fff0f6 0%, transparent 50%),
                        radial-gradient(at 50% 100%, #f6fcf9 0%, transparent 50%);
        }
        .orb {
            position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.3;
            animation: orbFloat 25s infinite alternate ease-in-out;
        }
        .orb-1 { width: 600px; height: 600px; background: #c3dafe; top: -100px; left: -100px; }
        .orb-2 { width: 500px; height: 500px; background: #ffd6e7; bottom: 10%; right: -50px; animation-duration: 35s; }
        @keyframes orbFloat { from { transform: translate(0,0) rotate(0deg); } to { transform: translate(120px, 60px) rotate(15deg); } }

        /* --- 极简登录层 --- */
        #loginOverlay {
            position: fixed; inset: 0; display: flex; justify-content: center; align-items: center;
            z-index: 10000; backdrop-filter: var(--glass-saturate); background: rgba(255, 255, 255, 0.1);
            transition: opacity 0.8s ease;
        }
        .login-spatial {
            background: var(--glass); border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 52px; padding: 70px 45px; width: 85%; max-width: 380px;
            text-align: center; box-shadow: 0 40px 120px rgba(0,0,0,0.04);
        }
        .login-spatial h1 { font-size: 46px; font-weight: 900; margin: 0; letter-spacing: -3.5px; }
        .login-spatial p { font-size: 14px; color: var(--apple-sub); margin: 15px 0 45px; letter-spacing: -0.2px; }

        /* --- 苹果规范组件 --- */
        .ios-input-group {
            width: 100%; padding: 20px; border-radius: 20px; border: none;
            background: rgba(0,0,0,0.04); font-size: 18px; font-weight: 600;
            text-align: center; outline: none; transition: 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .ios-input-group:focus { background: #FFFFFF; box-shadow: 0 0 0 1px rgba(0,0,0,0.05), 0 8px 25px rgba(0,0,0,0.03); }

        .btn-ios {
            background: #000; color: #fff; border: none; border-radius: 20px;
            padding: 18px 25px; font-size: 16px; font-weight: 700; cursor: pointer;
            transition: all 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
            display: flex; align-items: center; justify-content: center;
        }
        .btn-ios:hover { transform: scale(1.02); filter: brightness(1.1); }
        .btn-ios:active { transform: scale(0.96); }
        .btn-accent { background: var(--apple-blue); }

        /* --- 主界面容器 --- */
        .app-shell { max-width: 1300px; margin: 0 auto; padding: 50px 24px 150px; display: none; }
        .ios-card {
            background: var(--glass); backdrop-filter: var(--glass-saturate);
            border-radius: var(--radius-xl); padding: 30px; margin-bottom: 24px;
            border: 1px solid rgba(255, 255, 255, 0.8); box-shadow: 0 10px 40px rgba(0,0,0,0.015);
        }

        /* 可视化横排 */
        .dashboard-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; margin-bottom: 30px; }
        @media (max-width: 1024px) { .dashboard-row { grid-template-columns: 1fr; } }
        .chart-label { font-size: 11px; font-weight: 800; color: var(--apple-sub); text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 20px; text-align: center; display: block; }

        /* 两级联动区 */
        .mgmt-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
        @media (max-width: 768px) { .mgmt-grid { grid-template-columns: 1fr; } }
        .control-group { display: flex; gap: 10px; background: rgba(0,0,0,0.03); padding: 8px; border-radius: 22px; }
        .control-input { flex: 1; background: transparent; border: none; padding: 10px 15px; font-size: 14px; font-weight: 600; outline: none; }

        /* 寻访详情表单 */
        .form-master { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }
        @media (max-width: 800px) { .form-master { grid-template-columns: 1fr 1fr; } }
        .field-unit { display: flex; flex-direction: column; gap: 7px; }
        .field-unit label { font-size: 11px; font-weight: 700; color: var(--apple-sub); margin-left: 8px; }
        .field-unit input, .field-unit select { padding: 14px; border-radius: 14px; border: 1px solid #E5E5EA; background: #FFF; font-size: 15px; transition: 0.3s; }

        /* 搜索功能区 */
        .search-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin: 25px 0; }
        .search-pill { display: flex; align-items: center; background: #FFF; border: 1px solid #E5E5EA; border-radius: 16px; padding: 4px 6px; }
        .search-pill input { flex: 1; border: none; padding: 8px 12px; font-size: 13px; outline: none; background: transparent; }

        /* 表格样式 */
        .ios-table { width: 100%; border-collapse: collapse; }
        .ios-table th { text-align: left; padding: 16px; font-size: 12px; color: var(--apple-sub); font-weight: 600; border-bottom: 1px solid rgba(0,0,0,0.05); }
        .ios-table td { padding: 22px 16px; font-size: 14px; border-bottom: 1px solid rgba(0,0,0,0.03); }
        .calc-badge { display: inline-block; font-size: 10px; background: rgba(0,122,255,0.08); color: var(--apple-blue); padding: 2px 8px; border-radius: 6px; font-weight: 800; margin-top: 5px; }

        /* 底部 Dock */
        .dock-bar {
            position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.8); backdrop-filter: var(--glass-saturate);
            padding: 14px 35px; border-radius: 45px; display: flex; gap: 20px;
            border: 1px solid rgba(255, 255, 255, 0.8); box-shadow: 0 20px 60px rgba(0,0,0,0.1); z-index: 999;
        }
        .badge-pill { padding: 4px 10px; border-radius: 8px; font-size: 11px; font-weight: 700; }
        .badge-合适 { background: #EAF9EE; color: #1E6726; }
        .badge-不合适 { background: #FFF0F0; color: #B51B1B; }

        /* 顶部导航 */
        .top-nav {
            position: fixed; top: 18px; left: 50%; transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(30px) saturate(180%);
            border: 1px solid rgba(0,0,0,0.05); border-radius: 999px;
            padding: 8px 8px 8px 18px; display: flex; align-items: center; gap: 14px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.06); z-index: 998;
        }
        .top-nav-brand { font-weight: 800; font-size: 13px; letter-spacing: -0.5px; }
        .top-nav-brand b { color: var(--apple-blue); }
        .top-nav-divider { width: 1px; height: 18px; background: rgba(0,0,0,0.08); }
        .top-nav-links { display: flex; gap: 4px; }
        .top-nav-link {
            padding: 6px 12px; border-radius: 999px;
            text-decoration: none; color: var(--apple-sub); font-size: 12px; font-weight: 600;
            transition: 0.2s;
        }
        .top-nav-link:hover { background: rgba(0,0,0,0.04); color: var(--apple-text); }
        .top-nav-link.current { background: var(--apple-blue); color: #fff; }
        .top-nav-link.vr { background: linear-gradient(135deg, #7c3aed, #2563eb); color: #fff; }
        @media (max-width: 768px) {
            .top-nav { padding: 6px; gap: 4px; left: 10px; right: 10px; transform: none; max-width: calc(100% - 20px); overflow-x: auto; }
            .top-nav-brand, .top-nav-divider { display: none; }
        }

        .vr-banner {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 6px 14px; background: linear-gradient(135deg, rgba(124,58,237,0.1), rgba(37,99,235,0.1));
            border: 1px solid rgba(124,58,237,0.2); border-radius: 999px;
            font-size: 11px; font-weight: 700; color: #7c3aed; letter-spacing: 1px;
        }
        .vr-banner .pulse {
            width: 6px; height: 6px; border-radius: 50%; background: #7c3aed;
            box-shadow: 0 0 8px #7c3aed; animation: vrPulse 1.5s ease-in-out infinite;
        }
        @keyframes vrPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    </style>
</head>
<body>

<div class="vision-bg">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
</div>

<!-- 顶部统一导航 -->
<div class="top-nav" id="topNav" style="display:none;">
    <div class="top-nav-brand">FLY <b>YUN</b> · 数据看板</div>
    <div class="top-nav-divider"></div>
    <div class="top-nav-links">
        <a href="index.html" class="top-nav-link">主站</a>
        <a href="F.html" class="top-nav-link">顾问站</a>
        <a href="X.html" class="top-nav-link">寻访</a>
        <a href="M.html" class="top-nav-link current">看板</a>
        <a href="Z.html" class="top-nav-link">候选人</a>
        <a href="admin.html" class="top-nav-link vr">管理终端</a>
    </div>
</div>

<div id="loginOverlay">
    <div class="login-spatial">
        <h1>FLY YUN</h1>
        <p>顾问数据看板 · iOS 26 Spatial</p>
        <input type="password" id="sysPass" class="ios-input-group" placeholder="请输入密码密钥" onkeydown="if(event.keyCode==13) handleLogin()">
        <button class="btn-ios btn-accent" style="width: 100%; margin-top: 35px;" onclick="handleLogin()">解锁空间</button>
        <div style="margin-top:24px; font-size:11px; color:var(--apple-sub); display:flex; justify-content:center; gap:12px; flex-wrap:wrap;">
            <a href="index.html" style="color:var(--apple-blue); text-decoration:none; font-weight:600;">← 返回主站</a>
            <span style="color:#ddd;">·</span>
            <a href="X.html" style="color:var(--apple-blue); text-decoration:none; font-weight:600;">寻访空间</a>
            <span style="color:#ddd;">·</span>
            <a href="F.html" style="color:var(--apple-blue); text-decoration:none; font-weight:600;">顾问工作站</a>
        </div>
        <div style="margin-top: 16px; font-size: 11px; color: var(--apple-blue); cursor: pointer; font-weight: 600; opacity: 0.6;" onclick="toggleAdmin()">超级管理中心</div>
    </div>
</div>

<div class="app-shell" id="app">
    <header style="margin-bottom: 50px;">
        <div style="display:flex; align-items:flex-start; justify-content:space-between; flex-wrap:wrap; gap:16px;">
            <div>
                <h2 style="font-size: 38px; font-weight: 900; letter-spacing: -3px; margin: 0;">FLY YUN · 数据看板</h2>
                <div id="userDisplay" style="color: var(--apple-sub); font-weight: 700; font-size: 13px; margin-top: 8px;"></div>
            </div>
            <div class="vr-banner">
                <span class="pulse"></span>
                看板已联动 VR 沉浸面试 · 实时同步
            </div>
        </div>
    </header>

    <div class="dashboard-row">
        <div class="ios-card"><span class="chart-label">寻访状态分布</span><div style="height:190px;"><canvas id="chartStatus"></canvas></div></div>
        <div class="ios-card"><span class="chart-label">候选人学历画像</span><div style="height:190px;"><canvas id="chartEdu"></canvas></div></div>
        <div class="ios-card"><span class="chart-label">客户项目分布</span><div style="height:190px;"><canvas id="chartJob"></canvas></div></div>
    </div>

    <div class="ios-card">
        <div class="mgmt-grid">
            <div class="field-unit">
                <label>🏢 管理客户公司</label>
                <div class="control-group">
                    <input type="text" id="newComp" class="control-input" placeholder="输入客户名称">
                    <button class="btn-ios" style="border-radius:16px; padding:8px 18px;" onclick="addComp()">添加</button>
                </div>
            </div>
            <div class="field-unit">
                <label>💼 管理招聘岗位</label>
                <div class="control-group">
                    <select id="compSelect" class="control-input"><option value="">所属客户</option></select>
                    <input type="text" id="newJob" class="control-input" placeholder="岗位名称">
                    <button class="btn-ios" style="border-radius:16px; padding:8px 18px;" onclick="addJob()">添加</button>
                </div>
            </div>
        </div>
        <div id="treeDisplay" style="margin-top:25px; display:flex; flex-wrap:wrap; gap:10px;"></div>
    </div>

    <div class="ios-card">
        <div style="font-weight: 800; margin-bottom: 25px; font-size: 16px; letter-spacing: -0.5px;">📝 候选人数据同步 (16环节)</div>
        <div class="form-master">
            <div class="field-unit"><label>客户</label><select id="f1" onchange="filterJobs()"></select></div>
            <div class="field-unit"><label>岗位</label><select id="f2"></select></div>
            <div class="field-unit"><label>姓名</label><input type="text" id="f3"></div>
            <div class="field-unit"><label>性别</label><select id="f4"><option>男</option><option>女</option></select></div>
            <div class="field-unit"><label>状态</label><select id="f5"><option>正在联系中</option><option>合适</option><option>不合适</option></select></div>
            <div class="field-unit"><label>出生年份</label><select id="f6"></select></div>
            <div class="field-unit"><label>现公司</label><input type="text" id="f10"></div>
            <div class="field-unit"><label>学历</label><select id="f13"><option>大专</option><option>本科</option><option>研究生</option><option>博士</option></select></div>
            <div class="field-unit"><label>入学年份</label><select id="f14"></select></div>
            <div class="field-unit"><label>联系方式</label><input type="text" id="f11"></div>
            <div class="field-unit"><label>所在地</label><input type="text" id="f8"></div>
            <div class="field-unit"><label>备注说明</label><input type="text" id="f16"></div>
        </div>
    </div>

    <div class="ios-card" style="padding: 0; overflow: hidden;">
        <div style="padding: 30px 30px 0;">
            <div style="font-weight: 800; margin-bottom: 15px; font-size: 16px;">🔍 空间深度搜索</div>
            <div class="search-container">
                <div class="search-pill"><input type="text" id="sName" placeholder="搜姓名"><button class="btn-ios" style="padding:6px 14px; border-radius:12px; font-size:12px" onclick="doSearch()">搜</button></div>
                <div class="search-pill"><input type="text" id="sComp" placeholder="搜客户"><button class="btn-ios" style="padding:6px 14px; border-radius:12px; font-size:12px" onclick="doSearch()">搜</button></div>
                <div class="search-pill"><input type="text" id="sJob" placeholder="搜岗位"><button class="btn-ios" style="padding:6px 14px; border-radius:12px; font-size:12px" onclick="doSearch()">搜</button></div>
            </div>
        </div>
        <div style="overflow-x: auto;">
            <table class="ios-table">
                <thead><tr><th>姓名</th><th>当前状态</th><th>客户 / 岗位 Mapping</th><th>年龄资历</th><th>联系方式</th><th>操作</th></tr></thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>
</div>

<div class="dock-bar" id="userDock" style="display:none">
    <button class="btn-ios btn-accent" style="padding:12px 35px" onclick="saveData()">✅ 存入空间</button>
    <button class="btn-ios" style="background:#34C759; padding:12px 25px" onclick="exportXLS()">📊 导出</button>
    <button class="btn-ios" style="background:#F2F2F7; color:#1d1d1f; padding:12px 20px" onclick="location.reload()">🔒 退出</button>
</div>

<script>
    let dbKey = ""; let data = []; let tree = {}; let charts = {};
    const curY = new Date().getFullYear();
    const MASTER_HASH = "8c6976e5b5410415bde908bd4dee15dfb167a9c873fc4bb8a81f6f2ab448a918"; 

    function toggleAdmin() {
        // 跳转至独立的核心管理终端
        if (confirm("即将进入飞云核心管理终端，需要管理员权限，是否继续？")) {
            window.location.href = "admin.html";
        }
    }

    async function hash(s) {
        const u = new TextEncoder().encode(s);
        const b = await crypto.subtle.digest('SHA-256', u);
        return Array.from(new Uint8Array(b)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    async function handleLogin() {
        const p = document.getElementById('sysPass').value; if(!p) return;
        if(await hash(p) === MASTER_HASH) { alert("后台激活：此处可载入管理逻辑..."); } 
        else {
            dbKey = "FLY_L_V16_" + btoa(p);
            document.getElementById('loginOverlay').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('loginOverlay').style.display='none';
                document.getElementById('app').style.display='block';
                document.getElementById('userDock').style.display='flex';
                document.getElementById('topNav').style.display='flex';
                document.getElementById('userDisplay').innerText = "加密空间 · " + p.substring(0,2) + "****";
                initApp();
            }, 600);
        }
    }

    function initApp() {
        let y6 = ''; for(let i=1960; i<=2022; i++) y6 += `<option value="${i}">${i}</option>`;
        document.getElementById('f6').innerHTML = '<option value="">出生年</option>' + y6;
        let y14 = ''; for(let i=1900; i<=2024; i++) y14 += `<option value="${i}">${i}</option>`;
        document.getElementById('f14').innerHTML = '<option value="">入学年</option>' + y14;
        data = JSON.parse(localStorage.getItem(dbKey) || "[]");
        tree = JSON.parse(localStorage.getItem(dbKey+"_t") || "{}");
        refreshMgmt(); render(); updateCharts();
    }

    function addComp() { const v = document.getElementById('newComp').value.trim(); if(v && !tree[v]) { tree[v] = []; saveT(); document.getElementById('newComp').value = ""; refreshMgmt(); } }
    function addJob() { const c = document.getElementById('compSelect').value; const j = document.getElementById('newJob').value.trim(); if(c && j && !tree[c].includes(j)) { tree[c].push(j); saveT(); document.getElementById('newJob').value = ""; refreshMgmt(); } }
    function saveT() { localStorage.setItem(dbKey+"_t", JSON.stringify(tree)); }
    function refreshMgmt() {
        document.getElementById('treeDisplay').innerHTML = Object.keys(tree).map(c => `<span class="badge-pill" style="background:#FFF; border:1px solid #E5E5EA;">${c}</span>`).join('');
        const opt = '<option value="">-- 选择客户 --</option>' + Object.keys(tree).map(c => `<option value="${c}">${c}</option>`).join('');
        document.getElementById('compSelect').innerHTML = opt; document.getElementById('f1').innerHTML = opt;
    }
    function filterJobs() { const c = document.getElementById('f1').value; document.getElementById('f2').innerHTML = (c && tree[c]) ? '<option value="">-- 选择岗位 --</option>' + tree[c].map(j => `<option value="${j}">${j}</option>`).join('') : '<option value="">先选公司</option>'; }

    function doSearch() { render(); }
    function saveData() { 
        const r = { id: Date.now() }; for(let i=1; i<=16; i++) { let el=document.getElementById('f'+i); if(el) r['f'+i] = el.value; }
        if(!r.f3) return alert("姓名必填");
        data.push(r); localStorage.setItem(dbKey, JSON.stringify(data)); render(); updateCharts();
    }

    function render() {
        const n = document.getElementById('sName').value.toLowerCase();
        const filtered = data.filter(i => i.f3.toLowerCase().includes(n));
        document.getElementById('tableBody').innerHTML = filtered.map(i => {
            const age = i.f6 ? (curY - parseInt(i.f6)) : "-";
            const exp = i.f14 ? (curY - parseInt(i.f14)) : "-";
            return `<tr><td><b style="font-size:16px">${i.f3}</b></td><td><span class="badge-pill badge-${i.f5}">${i.f5}</span></td><td><b>${i.f1||"-"}</b><br><span style="color:var(--apple-sub);font-size:12px">${i.f2||"-"}</span></td><td>${age} 岁<br><span class="calc-badge">资历 ${exp} 年</span></td><td>${i.f11||"-"}</td><td><button style="color:red;border:none;background:none;cursor:pointer;font-weight:700" onclick="del(${i.id})">移除</button></td></tr>`;
        }).join('');
    }

    function del(id) { if(confirm("确定移除？")) { data = data.filter(x => x.id !== id); localStorage.setItem(dbKey, JSON.stringify(data)); render(); updateCharts(); } }

    function updateCharts() {
        if(data.length===0) return;
        const s = {'合适':0,'不合适':0,'正在联系中':0}, e = {'大专':0,'本科':0,'研究生':0,'博士':0}, jb = {};
        data.forEach(i => { s[i.f5]++; e[i.f13]++; jb[i.f1||"未分类"] = (jb[i.f1||"未分类"] || 0) + 1; });
        draw('chartStatus', 'doughnut', Object.keys(s), Object.values(s), ['#34C759','#FF3B30','#FF9500'], true);
        draw('chartEdu', 'bar', Object.keys(e), Object.values(e), '#007AFF', false);
        draw('chartJob', 'bar', Object.keys(jb), Object.values(jb), '#AF52DE', false);
    }
    function draw(id, type, labels, data, colors, isD) {
        if(charts[id]) charts[id].destroy();
        charts[id] = new Chart(document.getElementById(id), {
            type: type, data: { labels, datasets: [{ data, backgroundColor: colors, borderRadius: 12 }] },
            options: { maintainAspectRatio:false, cutout: isD?'85%':0, plugins:{ legend:{ display:isD, position:'bottom', labels:{boxWidth:8, usePointStyle:true, font:{size:10}}} }, scales:{ y:{ display:!isD, beginAtZero:true}, x:{display:!isD}} }
        });
    }

    function exportXLS() {
        if(data.length === 0) return alert("暂无数据可导出");
        const headers = ["客户", "岗位", "姓名", "性别", "状态", "出生年", "年龄", "现公司", "联系方式", "学历", "入学年", "资历", "所在地", "备注"];
        const rows = [headers, ...data.map(i => [
            i.f1, i.f2, i.f3, i.f4, i.f5, i.f6,
            i.f6 ? (curY - parseInt(i.f6)) : "",
            i.f10, i.f11, i.f13, i.f14,
            i.f14 ? (curY - parseInt(i.f14)) : "",
            i.f8, i.f16
        ])];
        const ws = XLSX.utils.aoa_to_sheet(rows);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "候选人名单");
        XLSX.writeFile(wb, `飞云寻访报告_${new Date().toISOString().split('T')[0]}.xlsx`);
    }
</script>
